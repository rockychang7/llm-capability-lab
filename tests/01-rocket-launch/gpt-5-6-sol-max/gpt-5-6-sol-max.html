<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>逐星一号 · 火箭发射</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="experience" id="experience">
    <section class="world" id="world" aria-label="火箭发射场景">
      <div class="sky"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>
      <div class="space"><div class="stars"></div><div class="earth"></div></div>
      <div class="ground" id="ground"></div>
      <div class="complex" id="complex">
        <div class="trench"></div><div class="pad"></div>
        <div class="tower"><div class="tower-frame"></div><i class="arm a1"></i><i class="arm a2"></i><i class="arm a3"></i></div>
        <div class="water-tower"></div>
      </div>
      <canvas id="fxCanvas"></canvas>
      <div class="rocket-stage">
        <div class="rocket-wrap" id="rocketWrap">
          <div class="heat-haze"></div><div class="flame"></div>
          <div class="rocket">
            <i class="fin left"></i><i class="fin right"></i>
            <div class="bells"><i></i><i></i><i></i></div>
            <div class="engine-skirt"></div><div class="body"></div><div class="nose"></div><div class="band"></div>
            <div class="marking">ZHU XING · CZ-01</div><div class="flag">★</div><div class="umbilical"></div>
          </div>
        </div>
      </div>
    </section>
    <header class="topbar">
      <div class="brand"><i class="brand-mark"></i><div><strong>ORBITAL FRONTIER</strong><small>逐星航天</small></div></div>
      <div class="mission-tag">MISSION ZHUXING-01 · LC-07</div>
    </header>
    <aside class="telemetry">
      <div><span>ALTITUDE</span><p><strong id="altitude">0.0</strong><em>KM</em></p></div>
      <div><span>VELOCITY</span><p><strong id="velocity">0</strong><em>KM/H</em></p></div>
      <div><span>MISSION</span><p><strong id="missionTime">T+00:00</strong></p></div>
    </aside>
    <section class="status-panel" id="statusPanel">
      <div class="kicker"><i></i><span id="statusKicker">ALL SYSTEMS NOMINAL</span></div>
      <h1 id="statusTitle">逐星一号 · 等待发射</h1>
      <p id="statusText">发动机预冷完成，导航与遥测链路正常。点击按钮，开启从地面到星海的完整发射任务。</p>
      <button class="launch-button" id="launchButton">点火发射</button>
      <div class="timeline"><i id="timelineProgress"></i></div>
    </section>
    <div class="countdown" id="countdown"><strong>3</strong><span>IGNITION SEQUENCE</span></div>
    <section class="completion"><div><small>ORBIT INSERTION CONFIRMED</small><h2>已抵达太空</h2><p>逐星一号穿越卡门线，飞行任务圆满完成。</p><button id="replayButton">再次发射</button></div></section>
    <div class="flash"></div><div class="noise"></div><div class="vignette"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
