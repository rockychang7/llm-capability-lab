<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIMI-3 火箭发射</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;
    user-select:none; -webkit-user-select:none; }

  /* ============ 场景 ============ */
  #scene { position:fixed; inset:0; overflow:hidden; will-change:transform; }

  .sky { position:absolute; inset:0; }
  .sky-day   { background:linear-gradient(#2a6fc4 0%, #5aa5e0 45%, #a8d4f0 78%, #d8ecf9 100%); }
  .sky-dusk  { background:linear-gradient(#141c52 0%, #4a2a72 45%, #a04a7a 72%, #ff9a5a 100%); opacity:0; }
  .sky-space { background:linear-gradient(#0a0e1e 0%, #04060e 55%, #000 100%); opacity:0; }

  #sun { position:absolute; top:12%; right:16%; width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,252,230,.95), rgba(255,236,170,.45) 40%, rgba(255,236,170,0) 70%); }

  #ambientClouds { position:absolute; inset:0; pointer-events:none; }
  .a-cloud { position:absolute; border-radius:50%; filter:blur(2px);
    background:radial-gradient(ellipse, rgba(255,255,255,.9), rgba(255,255,255,0) 70%);
    animation:drift 70s ease-in-out infinite alternate; }
  @keyframes drift { from { transform:translateX(-4vw); } to { transform:translateX(6vw); } }

  #stars { position:absolute; inset:0; }

  #earthGlow { position:absolute; left:50%; bottom:-46vh; width:190vw; height:70vh;
    transform:translateX(-50%); border-radius:50%; opacity:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%, rgba(90,160,255,.65), rgba(40,90,220,.28) 42%, rgba(20,40,120,0) 72%); }
  #earthLimb { position:absolute; left:50%; bottom:-2px; width:190vw; height:3px; transform:translateX(-50%);
    opacity:0; pointer-events:none; filter:blur(2px);
    background:linear-gradient(90deg, transparent, rgba(150,200,255,.9) 30%, rgba(190,225,255,1) 50%, rgba(150,200,255,.9) 70%, transparent); }

  /* ============ 世界（随摄像机移动） ============ */
  #world { position:absolute; inset:0; will-change:transform; }

  #ground { position:absolute; left:0; right:0; bottom:0; height:190px;
    background:linear-gradient(#5d8a48 0%, #4a7238 30%, #3a5c2c 100%); }
  #ground::before { content:""; position:absolute; left:0; right:0; top:0; height:10px;
    background:linear-gradient(rgba(255,255,255,.14), transparent); }

  #apron { position:absolute; left:50%; bottom:190px; width:760px; height:16px;
    transform:translateX(-50%); background:linear-gradient(#9aa0a6, #787e85); border-radius:2px; }

  #pad { position:absolute; left:50%; bottom:206px; width:210px; height:34px;
    transform:translateX(-50%); background:linear-gradient(#6d7278, #4c5157);
    border-top:3px solid #878d94; }
  #trench { position:absolute; left:50%; bottom:206px; width:120px; height:20px;
    transform:translateX(-50%); background:#101216; border-radius:0 0 6px 6px; }

  #padGlow { position:absolute; left:50%; bottom:180px; width:560px; height:190px;
    transform:translateX(-50%); opacity:0; pointer-events:none; mix-blend-mode:screen;
    background:radial-gradient(ellipse at 50% 20%, rgba(255,170,70,.85), rgba(255,110,30,.35) 45%, transparent 75%); }

  /* 发射塔 */
  #tower { position:absolute; left:calc(50% - 150px); bottom:206px; width:44px; height:470px;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,.22) 0 6px, transparent 6px 14px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.22) 0 6px, transparent 6px 14px),
      repeating-linear-gradient(0deg, #c94f43 0 58px, #e8e4da 58px 116px);
    border:2px solid rgba(0,0,0,.28); }
  #tower::after { content:""; position:absolute; left:-4px; right:-4px; top:30%; height:8px;
    background:rgba(0,0,0,.3); box-shadow:0 130px 0 rgba(0,0,0,.3), 0 260px 0 rgba(0,0,0,.3); }
  #crane { position:absolute; left:calc(50% - 106px); bottom:600px; width:70px; height:10px;
    background:linear-gradient(#b8452f, #8f3220); transform-origin:left center; transform:rotate(-4deg);
    border-radius:3px; }
  #towerLight { position:absolute; left:calc(50% - 152px); bottom:682px; width:8px; height:8px;
    border-radius:50%; background:#ff4b3e; animation:blink 1.4s infinite; }
  @keyframes blink { 0%,55% { opacity:1; box-shadow:0 0 10px 3px rgba(255,70,50,.8);} 56%,100% { opacity:.15; box-shadow:none;} }

  /* 避雷针 */
  #mast { position:absolute; left:calc(50% + 170px); bottom:206px; width:5px; height:520px;
    background:linear-gradient(90deg,#7c8288,#c9ced4,#7c8288); }
  #mast::before { content:""; position:absolute; top:-14px; left:50%; width:2px; height:16px;
    transform:translateX(-50%); background:#dfe3e8; }

  /* 燃料罐与附属建筑 */
  #tank { position:absolute; left:calc(50% - 330px); bottom:206px; width:86px; height:86px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #ffffff, #c7ccd2 55%, #8f959c);
    box-shadow:inset -8px -10px 18px rgba(0,0,0,.18); }
  #tank::after { content:""; position:absolute; left:50%; bottom:-16px; width:60px; height:18px;
    transform:translateX(-50%); background:#6d7278; }
  #building { position:absolute; left:calc(50% + 250px); bottom:206px; width:130px; height:52px;
    background:linear-gradient(#b9bec4, #8f959c); border-top:4px solid #6d7278; }
  #building::before { content:""; position:absolute; left:12px; top:12px; width:16px; height:14px;
    background:#3d4a56; box-shadow:28px 0 #3d4a56, 56px 0 #3d4a56, 84px 0 #3d4a56; }

  /* 世界中的云层（高空云，随摄像机掠过） */
  .w-cloud { position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(ellipse, rgba(255,255,255,.95), rgba(255,255,255,0) 68%);
    filter:blur(3px); }

  /* 固定夹臂 */
  .clamp { position:absolute; bottom:240px; width:26px; height:14px; background:#3a3f45;
    transition:transform .6s ease-in, opacity .6s; z-index:3; }
  #clampL { left:calc(50% - 52px); transform-origin:left bottom; }
  #clampR { left:calc(50% + 26px); transform-origin:right bottom; }
  .clamp.released#clampL { transform:rotate(-95deg) translateY(30px); opacity:0; }
  .clamp.released#clampR { transform:rotate(95deg) translateY(30px); opacity:0; }

  /* ============ 火箭 ============ */
  #rocketWrap { position:absolute; left:50%; bottom:238px; width:220px; height:640px;
    transform-origin:50% 100%; will-change:transform,opacity; z-index:2; }
  #rocketWrap svg { position:absolute; left:0; top:0; filter:drop-shadow(0 8px 14px rgba(0,0,0,.28)); }
  #flame { position:absolute; left:50%; top:588px; width:220px; height:430px;
    transform:translateX(-50%); pointer-events:none; }

  #smoke { position:absolute; inset:0; z-index:4; pointer-events:none; }

  #vignette { position:absolute; inset:0; z-index:5; pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(0,0,0,.38)); }

  /* ============ HUD ============ */
  #hud { position:fixed; top:22px; left:22px; z-index:10; padding:14px 18px;
    font-family:"Consolas","Courier New",monospace; color:#7dff9a; font-size:14px; line-height:1.75;
    background:rgba(2,18,8,.55); border:1px solid rgba(125,255,154,.35); border-radius:8px;
    text-shadow:0 0 6px rgba(125,255,154,.6); backdrop-filter:blur(3px); min-width:230px; }
  #hud .title { color:#c9ffd9; font-weight:700; letter-spacing:2px; margin-bottom:4px; font-size:13px; }
  #hud .row { display:flex; justify-content:space-between; gap:18px; }
  #hud .val { color:#eafff0; }

  #status { position:fixed; left:50%; bottom:158px; transform:translateX(-50%); z-index:10;
    padding:9px 26px; color:#eaf6ff; font-size:16px; letter-spacing:3px; white-space:nowrap;
    background:rgba(8,14,26,.5); border:1px solid rgba(140,190,255,.3); border-radius:999px;
    backdrop-filter:blur(4px); transition:opacity .4s; }

  /* ============ 点火按钮 ============ */
  #btnWrap { position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:11;
    text-align:center; transition:opacity .6s; perspective:600px; }
  #btnWrap.hidden { opacity:0; pointer-events:none; }
  #launchBtn { position:relative; width:104px; height:104px; border-radius:50%; cursor:pointer;
    border:6px solid #7a1210; color:#fff; font-size:22px; font-weight:800; letter-spacing:4px;
    font-family:inherit; text-indent:4px;
    background:radial-gradient(circle at 34% 30%, #ff7a6a, #e02918 55%, #a31308);
    box-shadow:0 0 0 6px #2b2f36, 0 0 34px rgba(255,60,30,.55), 0 10px 22px rgba(0,0,0,.5);
    transition:transform .15s, box-shadow .3s; }
  #btnWrap:hover #launchBtn { transform:scale(1.06);
    box-shadow:0 0 0 6px #2b2f36, 0 0 54px rgba(255,80,40,.85), 0 10px 22px rgba(0,0,0,.5); }
  #launchBtn:active { transform:scale(.96); }
  #launchBtn:disabled { cursor:default; filter:saturate(.4) brightness(.75); }
  #btnCover { position:absolute; left:-14px; top:-16px; width:132px; height:120px; z-index:2;
    border-radius:14px 14px 60px 60px; pointer-events:none; transform-origin:top center;
    transition:transform .45s cubic-bezier(.2,.9,.3,1.2);
    background:repeating-linear-gradient(45deg, rgba(230,180,40,.32) 0 12px, rgba(30,30,30,.32) 12px 24px),
      rgba(120,130,140,.28);
    border:2px solid rgba(255,255,255,.35); backdrop-filter:blur(2px); }
  #btnWrap:hover #btnCover { transform:rotateX(108deg); }
  #btnLabel { margin-top:12px; color:rgba(255,255,255,.75); font-size:12px; letter-spacing:3px; }

  #soundBtn { position:fixed; top:22px; right:22px; z-index:11; padding:8px 16px; cursor:pointer;
    color:#cfe6ff; font-size:13px; letter-spacing:2px; font-family:inherit;
    background:rgba(10,18,32,.55); border:1px solid rgba(140,190,255,.35); border-radius:999px; }
  #soundBtn:hover { background:rgba(30,50,80,.6); }

  /* ============ 完成遮罩 ============ */
  #doneOverlay { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center;
    opacity:0; pointer-events:none; transition:opacity 1.6s ease; }
  #doneOverlay.show { opacity:1; pointer-events:auto; }
  #doneOverlay h1 { color:#fff; font-size:46px; font-weight:800; letter-spacing:10px;
    text-shadow:0 0 30px rgba(120,180,255,.8); }
  #doneOverlay p { color:#a9c6e8; font-size:17px; letter-spacing:5px; }
  #againBtn { margin-top:14px; padding:13px 44px; cursor:pointer; font-size:16px; letter-spacing:4px;
    color:#fff; font-family:inherit; background:rgba(40,90,200,.35);
    border:1px solid rgba(140,190,255,.6); border-radius:999px; transition:background .3s; }
  #againBtn:hover { background:rgba(70,130,240,.55); }
</style>
</head>
<body>

<div id="scene">
  <div class="sky sky-day"></div>
  <div class="sky sky-dusk"></div>
  <div class="sky sky-space"></div>
  <div id="sun"></div>
  <div id="ambientClouds">
    <div class="a-cloud" style="top:14%; left:12%; width:300px; height:64px;"></div>
    <div class="a-cloud" style="top:24%; left:58%; width:380px; height:78px; animation-duration:90s;"></div>
    <div class="a-cloud" style="top:8%;  left:74%; width:220px; height:50px; animation-duration:60s;"></div>
  </div>
  <canvas id="stars"></canvas>
  <div id="earthGlow"></div>
  <div id="earthLimb"></div>

  <div id="world">
    <div class="w-cloud" style="left:6%;  bottom:2190px;  width:420px; height:90px;"></div>
    <div class="w-cloud" style="left:58%; bottom:2490px;  width:520px; height:110px;"></div>
    <div class="w-cloud" style="left:26%; bottom:2890px;  width:640px; height:130px;"></div>
    <div class="w-cloud" style="left:66%; bottom:3290px;  width:560px; height:120px;"></div>
    <div class="w-cloud" style="left:2%;  bottom:3590px;  width:480px; height:100px;"></div>
    <div class="w-cloud" style="left:40%; bottom:6440px;  width:700px; height:120px; opacity:.8;"></div>
    <div class="w-cloud" style="left:10%; bottom:10190px; width:760px; height:110px; opacity:.6;"></div>
    <div class="w-cloud" style="left:55%; bottom:15190px; width:820px; height:100px; opacity:.45;"></div>

    <div id="ground"></div>
    <div id="apron"></div>
    <div id="tank"></div>
    <div id="building"></div>
    <div id="mast"></div>
    <div id="tower"></div>
    <div id="crane"></div>
    <div id="towerLight"></div>
    <div id="pad"></div>
    <div id="trench"></div>
    <div class="clamp" id="clampL"></div>
    <div class="clamp" id="clampR"></div>
    <div id="padGlow"></div>
  </div>

  <div id="rocketWrap">
    <canvas id="flame"></canvas>
    <svg id="rocket" viewBox="0 0 220 640" width="220" height="640">
      <defs>
        <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#98a1ab"/><stop offset=".16" stop-color="#e9eef3"/>
          <stop offset=".5" stop-color="#ffffff"/><stop offset=".84" stop-color="#dde4ea"/>
          <stop offset="1" stop-color="#8a929d"/>
        </linearGradient>
        <linearGradient id="redG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8f1d14"/><stop offset=".5" stop-color="#d23a2c"/>
          <stop offset="1" stop-color="#8f1d14"/>
        </linearGradient>
        <linearGradient id="metalG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#3c4148"/><stop offset=".5" stop-color="#6b7178"/>
          <stop offset="1" stop-color="#33373d"/>
        </linearGradient>
        <linearGradient id="finG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7d858f"/><stop offset=".5" stop-color="#c3cad2"/>
          <stop offset="1" stop-color="#7d858f"/>
        </linearGradient>
        <radialGradient id="glassG" cx=".38" cy=".32" r=".9">
          <stop offset="0" stop-color="#bfe6ff"/><stop offset=".45" stop-color="#3f8fd2"/>
          <stop offset="1" stop-color="#0d2f52"/>
        </radialGradient>
        <radialGradient id="nozGlowG" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#fff3c0"/><stop offset=".5" stop-color="#ff9a30"/>
          <stop offset="1" stop-color="rgba(255,80,20,0)"/>
        </radialGradient>
      </defs>

      <!-- 尾翼（后层） -->
      <path d="M62 402 C42 462 28 512 20 562 L62 562 Z" fill="url(#finG)" stroke="rgba(0,0,0,.18)"/>
      <path d="M20 562 L62 562 L62 544 C46 548 30 554 20 562 Z" fill="#c8332b"/>
      <path d="M158 402 C178 462 192 512 200 562 L158 562 Z" fill="url(#finG)" stroke="rgba(0,0,0,.18)"/>
      <path d="M200 562 L158 562 L158 544 C174 548 190 554 200 562 Z" fill="#c8332b"/>

      <!-- 整流罩 / 鼻锥 -->
      <path d="M110 6 C84 40 66 96 62 150 L158 150 C154 96 136 40 110 6 Z"
            fill="url(#bodyG)" stroke="rgba(30,40,55,.16)"/>
      <path d="M110 6 C98 23 88 44 81 64 L139 64 C132 44 122 23 110 6 Z" fill="url(#redG)"/>
      <line x1="81" y1="64" x2="139" y2="64" stroke="rgba(0,0,0,.22)" stroke-width="1.5"/>

      <!-- 箭体 -->
      <rect x="62" y="150" width="96" height="330" fill="url(#bodyG)"/>
      <rect x="62" y="150" width="96" height="24" fill="#15181e"/>
      <line x1="64" y1="158" x2="156" y2="158" stroke="rgba(255,255,255,.14)" stroke-width="2" stroke-dasharray="1 7"/>
      <rect x="62" y="444" width="96" height="16" fill="#15181e"/>
      <line x1="62" y1="232" x2="158" y2="232" stroke="rgba(30,40,55,.12)" stroke-width="1.5"/>
      <line x1="62" y1="322" x2="158" y2="322" stroke="rgba(30,40,55,.12)" stroke-width="1.5"/>
      <line x1="62" y1="412" x2="158" y2="412" stroke="rgba(30,40,55,.12)" stroke-width="1.5"/>
      <rect x="65" y="180" width="7" height="4" fill="#39424e"/>
      <rect x="148" y="180" width="7" height="4" fill="#39424e"/>

      <!-- 旗帜与标识 -->
      <g transform="translate(74,192)">
        <rect width="30" height="20" rx="2" fill="#f4f6f8" stroke="rgba(0,0,0,.15)"/>
        <rect y="2"  width="30" height="2.4" fill="#c8332b"/>
        <rect y="7"  width="30" height="2.4" fill="#c8332b"/>
        <rect y="12" width="30" height="2.4" fill="#c8332b"/>
        <rect y="17" width="30" height="2"   fill="#c8332b"/>
        <rect width="13" height="10" fill="#27436e"/>
      </g>
      <text transform="translate(138,336) rotate(90)" font-family="Arial" font-size="19"
            font-weight="800" letter-spacing="5" fill="#39424e">KIMI-3</text>

      <!-- 舷窗 -->
      <circle cx="110" cy="262" r="18" fill="#20262e"/>
      <circle cx="110" cy="262" r="14" fill="url(#glassG)"/>
      <ellipse cx="104" cy="256" rx="5" ry="3" fill="rgba(255,255,255,.75)"/>

      <!-- 发动机短舱 -->
      <path d="M62 480 L158 480 L170 536 L50 536 Z" fill="url(#metalG)" stroke="rgba(0,0,0,.25)"/>
      <line x1="58" y1="508" x2="162" y2="508" stroke="rgba(0,0,0,.3)" stroke-width="2"/>

      <!-- 三台发动机喷管 -->
      <path d="M70 536 L92 536 L98 582 Q99 590 91 590 L73 590 Q65 590 66 582 Z"
            fill="url(#metalG)" stroke="rgba(0,0,0,.3)"/>
      <path d="M99 536 L121 536 L128 586 Q129 594 120 594 L100 594 Q91 594 92 586 Z"
            fill="url(#metalG)" stroke="rgba(0,0,0,.3)"/>
      <path d="M128 536 L150 536 L154 582 Q155 590 147 590 L129 590 Q121 590 122 582 Z"
            fill="url(#metalG)" stroke="rgba(0,0,0,.3)"/>
      <ellipse cx="81"  cy="588" rx="13" ry="4.5" fill="#07090d"/>
      <ellipse cx="110" cy="592" rx="15" ry="5"   fill="#07090d"/>
      <ellipse cx="138" cy="588" rx="13" ry="4.5" fill="#07090d"/>
      <g id="nozzleGlow" opacity="0">
        <ellipse cx="81"  cy="588" rx="15" ry="6" fill="url(#nozGlowG)"/>
        <ellipse cx="110" cy="592" rx="17" ry="7" fill="url(#nozGlowG)"/>
        <ellipse cx="138" cy="588" rx="15" ry="6" fill="url(#nozGlowG)"/>
      </g>
    </svg>
  </div>

  <canvas id="smoke"></canvas>
  <div id="vignette"></div>
</div>

<div id="hud">
  <div class="title">KIMI-3 · 遥测</div>
  <div class="row"><span>任务时钟</span><span class="val" id="hudT">T- --:--</span></div>
  <div class="row"><span>高度</span><span class="val" id="hudAlt">0 m</span></div>
  <div class="row"><span>速度</span><span class="val" id="hudVel">0 km/h</span></div>
  <div class="row"><span>节流阀</span><span class="val" id="hudThr">0%</span></div>
</div>

<div id="status">待命 — 等待点火指令</div>

<div id="btnWrap">
  <div id="btnCover"></div>
  <button id="launchBtn">点火</button>
  <div id="btnLabel">KIMI-3 · 发射控制</div>
</div>

<button id="soundBtn">音效：开</button>

<div id="doneOverlay">
  <h1>火箭已进入太空</h1>
  <p>KIMI-3 发射任务圆满成功</p>
  <button id="againBtn">再次发射</button>
</div>

<script>
"use strict";
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const smooth = (p,a,b) => { const t = clamp((p-a)/(b-a),0,1); return t*t*(3-2*t); };

const scene = $('#scene'), world = $('#world'), rocketWrap = $('#rocketWrap');
const flameCv = $('#flame'), smokeCv = $('#smoke'), starsCv = $('#stars');
const fctx = flameCv.getContext('2d'), sctx = smokeCv.getContext('2d'), stx = starsCv.getContext('2d');
const hudT=$('#hudT'), hudAlt=$('#hudAlt'), hudVel=$('#hudVel'), hudThr=$('#hudThr');
const statusEl=$('#status'), duskEl=$('.sky-dusk'), spaceEl=$('.sky-space');
const earthGlow=$('#earthGlow'), earthLimb=$('#earthLimb'), ambient=$('#ambientClouds');
const padGlow=$('#padGlow'), nozzleGlow=$('#nozzleGlow'), sunEl=$('#sun');

const PPM = 2.5;                 // 像素 / 米
const GROUND_H = 190, PAD_TOP = 238;
const CAM_MAX_M = 60000;         // 摄像机跟随上限
const ASCENT_T = 26000;          // 升空段时长 ms
const IGNITE_HOLD = 2800;        // 点火后按住时间 ms
const BASE_SCALE = 0.62;

let W=0, H=0, DPR=1, padTopY0=0, marginM=0;

function fitCanvas(cv){
  cv.width = cv.clientWidth * DPR; cv.height = cv.clientHeight * DPR;
  const ctx = cv.getContext('2d'); ctx.setTransform(DPR,0,0,DPR,0,0);
}
function resize(){
  W = scene.clientWidth; H = scene.clientHeight;
  DPR = Math.min(window.devicePixelRatio||1, 2);
  fitCanvas(smokeCv); fitCanvas(starsCv); fitCanvas(flameCv);
  padTopY0 = H - PAD_TOP;
  marginM = Math.max(20, (padTopY0 - H*0.62) / PPM);
  initStars();
}
window.addEventListener('resize', resize);

/* ================= 精灵贴图 ================= */
function makeSprite(size, stops){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  stops.forEach(s => grad.addColorStop(s[0], s[1]));
  g.fillStyle = grad; g.fillRect(0,0,size,size);
  return c;
}
const puffGray  = makeSprite(128, [[0,'rgba(205,203,200,.55)'],[.5,'rgba(185,182,180,.26)'],[1,'rgba(175,172,170,0)']]);
const puffWhite = makeSprite(128, [[0,'rgba(245,246,250,.5)'],[.5,'rgba(235,238,245,.2)'],[1,'rgba(230,235,245,0)']]);
const glowW = makeSprite(64, [[0,'rgba(255,255,240,1)'],[.4,'rgba(255,240,180,.65)'],[1,'rgba(255,220,120,0)']]);
const glowO = makeSprite(64, [[0,'rgba(255,195,95,.95)'],[.5,'rgba(255,125,40,.5)'],[1,'rgba(255,85,20,0)']]);
const glowR = makeSprite(64, [[0,'rgba(255,95,45,.75)'],[1,'rgba(200,40,20,0)']]);
const glowB = makeSprite(64, [[0,'rgba(170,210,255,.9)'],[1,'rgba(80,120,255,0)']]);
const starSpr = makeSprite(32, [[0,'rgba(255,255,255,1)'],[.35,'rgba(220,230,255,.5)'],[1,'rgba(200,220,255,0)']]);

/* ================= 星空 ================= */
let stars = [];
function initStars(){
  stars = [];
  const n = Math.floor(W*H/6500);
  for(let i=0;i<n;i++)
    stars.push({ x:Math.random()*W, y:Math.random()*H, r:rand(.8,2.6),
      b:rand(.35,1), tw:rand(.6,2.6), ph:rand(0,6.28) });
}

/* ================= 粒子系统 ================= */
const flameP = [], smokeP = [];
let flameAcc = 0, smokeAcc = 0, trailAcc = 0, passAcc = 0, ventTimer = 0;

function spawnFlame(vac){
  const r = Math.random(), cx = 110;
  if(r < .34){       // 高温核心
    flameP.push({ s: vac>.4 && Math.random()<.5 ? glowB : glowW,
      x:cx+rand(-6,6), y:rand(0,6), vx:rand(-18,18)*(1+vac*3), vy:rand(520,760),
      size:rand(6,12), grow:0, life:rand(.1,.2), max:0, a:1 });
  } else if(r < .74){ // 橙色主焰
    flameP.push({ s:glowO, x:cx+rand(-12,12), y:rand(0,10),
      vx:rand(-26,26)*(1+vac*3), vy:rand(380,580),
      size:rand(10,20), grow:14, life:rand(.18,.34), max:0, a:.95 });
  } else {            // 外围红焰
    flameP.push({ s:glowR, x:cx+rand(-17,17), y:rand(0,12),
      vx:rand(-34,34)*(1+vac*3.5), vy:rand(260,430),
      size:rand(16,30), grow:55, life:rand(.28,.5), max:0, a:.8 });
  }
  const p = flameP[flameP.length-1]; p.max = p.life;
  if(flameP.length > 850) flameP.splice(0, flameP.length-850);
}

function spawnSmoke(x, y, vx, vy, r, grow, life, alpha, sprite){
  smokeP.push({ x,y,vx,vy,r,grow,life,max:life,a:alpha,s:sprite||puffGray });
  if(smokeP.length > 750) smokeP.splice(0, smokeP.length-750);
}

/* ================= 音效（程序化轰鸣） ================= */
let actx=null, rumbleGain=null, audioOn=true, rumbleTimer=0;
function initAudio(){
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    const len = actx.sampleRate*2, buf = actx.createBuffer(1,len,actx.sampleRate);
    const d = buf.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.4; }
    const src = actx.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp = actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=340; lp.Q.value=.5;
    const osc = actx.createOscillator(); osc.type='sine'; osc.frequency.value=42;
    const og = actx.createGain(); og.gain.value=.5;
    rumbleGain = actx.createGain(); rumbleGain.gain.value=0;
    src.connect(lp); lp.connect(rumbleGain);
    osc.connect(og); og.connect(rumbleGain);
    rumbleGain.connect(actx.destination);
    src.start(); osc.start();
  }catch(e){ actx=null; }
}
function setRumble(v){
  if(actx && rumbleGain && audioOn)
    rumbleGain.gain.setTargetAtTime(clamp(v,0,.8), actx.currentTime, .08);
}
$('#soundBtn').addEventListener('click', e=>{
  audioOn = !audioOn;
  e.target.textContent = audioOn ? '音效：开' : '音效：关';
  if(!audioOn && actx && rumbleGain) rumbleGain.gain.setTargetAtTime(0, actx.currentTime, .05);
});

/* ================= 状态机 ================= */
let state='idle';           // idle | ignition | ascent | done
let t0=0, liftoffT=0, throttle=0, progress=0;
let altKm=0, prevAltKm=0, velMs=0;
let camAltM=0, prevCamAltM=0, camPx=0;
let statusIdx=-1;

const STATUS = [
  [0.0001, '升空！KIMI-3 已离开发射台'],
  [0.12,  '程序转弯 · 穿越云层'],
  [0.30,  'Max-Q · 最大动压'],
  [0.45,  '穿越平流层 · 一切正常'],
  [0.62,  '天空变暗 · 接近太空边缘'],
  [0.80,  '越过卡门线 · 进入太空'],
];

$('#launchBtn').addEventListener('click', ()=>{
  if(state !== 'idle') return;
  $('#launchBtn').disabled = true;
  $('#btnWrap').classList.add('hidden');
  initAudio();
  statusEl.textContent = '点火程序启动…';
  setTimeout(()=>{
    state = 'ignition'; t0 = performance.now();
    statusEl.textContent = '点火！主发动机推力正常';
  }, 900);
});
$('#againBtn').addEventListener('click', ()=>location.reload());

/* ================= 火焰锥体 ================= */
function drawFlameCone(vac){
  if(throttle <= .01) return;
  const flick = .86 + Math.random()*.28;
  const L = (70 + 175*throttle) * flick * (1 + .55*vac);
  const Wd = 30 * (1 + .95*vac);
  const cx = 110;
  const layer = (len, wid, stops, alpha)=>{
    const g = fctx.createLinearGradient(0,0,0,len);
    stops.forEach(s=>g.addColorStop(s[0],s[1]));
    fctx.globalAlpha = alpha; fctx.fillStyle = g;
    fctx.beginPath();
    fctx.moveTo(cx-wid*.45, 2);
    fctx.quadraticCurveTo(cx-wid, len*.35, cx, len);
    fctx.quadraticCurveTo(cx+wid, len*.35, cx+wid*.45, 2);
    fctx.closePath(); fctx.fill();
  };
  if(vac > .02) layer(L*1.12, Wd*1.25, [[0,'rgba(150,200,255,.5)'],[.6,'rgba(90,130,255,.18)'],[1,'rgba(80,120,255,0)']], vac*.75);
  layer(L, Wd, [[0,'rgba(255,255,235,.95)'],[.25,'rgba(255,214,120,.85)'],[.55,'rgba(255,130,40,.55)'],[1,'rgba(255,60,20,0)']], .9);
  layer(L*.55, Wd*.5, [[0,'rgba(255,255,255,.98)'],[.5,'rgba(255,240,180,.7)'],[1,'rgba(255,220,120,0)']], .95);
  fctx.globalAlpha = 1;
}

/* ================= 主循环 ================= */
let last = performance.now();

function tick(now){
  const dt = clamp((now-last)/1000, 0, .05); last = now;
  const vac = smooth(progress, .72, .95);

  /* ---- 状态推进 ---- */
  if(state === 'ignition'){
    const el = now - t0;
    const ramp = smooth(el, 150, 1400);
    throttle = ramp * (el < 500 ? rand(.75,1) : 1);   // 初始喘振
    if(el >= IGNITE_HOLD){
      state = 'ascent'; liftoffT = now;
      document.querySelectorAll('.clamp').forEach(c=>c.classList.add('released'));
    }
  } else if(state === 'ascent'){
    throttle = 1;
    progress = clamp((now - liftoffT)/ASCENT_T, 0, 1);
    prevAltKm = altKm;
    altKm = 100 * Math.pow(progress, 2.35);
    velMs = dt > 0 ? (altKm - prevAltKm)/dt*1000 : 0;
    if(progress >= 1 && state !== 'done') finish();
  }

  const altM = altKm*1000;

  /* ---- 摄像机 ---- */
  prevCamAltM = camAltM;
  camAltM = altM <= marginM ? 0 : Math.min(altM - marginM, CAM_MAX_M);
  camPx = camAltM * PPM;
  const camVelPx = dt > 0 ? (camAltM - prevCamAltM)*PPM/dt : 0;

  /* ---- 火箭位置 / 缩放 ---- */
  const risePx = (altM - camAltM) * PPM;
  let scale = BASE_SCALE;
  if(altM > CAM_MAX_M){
    const k = (altM - CAM_MAX_M)/(100000 - CAM_MAX_M);
    scale = BASE_SCALE * (1 - .78*k);
  }
  let opacity = 1;
  if(progress > .965) opacity = 1 - (progress-.965)/.035;
  rocketWrap.style.transform =
    `translateX(-50%) translateY(${-risePx}px) scale(${scale})`;
  rocketWrap.style.opacity = opacity;

  world.style.transform = `translateY(${camPx}px)`;

  /* ---- 天空过渡 ---- */
  duskEl.style.opacity  = smooth(progress,.12,.42) * (1 - smooth(progress,.5,.78));
  spaceEl.style.opacity = smooth(progress,.38,.85);
  const starAlpha = smooth(progress,.3,.75);
  earthGlow.style.opacity = smooth(progress,.68,.92);
  earthLimb.style.opacity = smooth(progress,.78,.95);
  ambient.style.opacity = 1 - smooth(progress,.08,.28);
  sunEl.style.opacity = 1 - smooth(progress,.2,.5);

  /* ---- 震动 ---- */
  let shake = 0;
  if(state === 'ignition'){
    const el = now - t0;
    shake = 9*(1 - el/IGNITE_HOLD) + 3;
  } else if(state === 'ascent'){
    shake = 2.2;
    if(progress > .30 && progress < .42)
      shake += 5*Math.sin((progress-.30)/.12*Math.PI);   // Max-Q
    if(altM > CAM_MAX_M) shake *= .35;
  }
  scene.style.transform = shake > .1
    ? `translate(${rand(-1,1)*shake}px, ${rand(-1,1)*shake}px)` : '';

  /* ---- 火焰 ---- */
  fctx.clearRect(0,0,220,430);
  fctx.globalCompositeOperation = 'lighter';
  drawFlameCone(vac);
  if(throttle > .02){
    flameAcc += (state==='ignition' ? 640 : 430) * throttle * dt;
    while(flameAcc > 1){ flameAcc--; spawnFlame(vac); }
  }
  for(let i=flameP.length-1; i>=0; i--){
    const p = flameP[i];
    p.life -= dt;
    if(p.life <= 0){ flameP.splice(i,1); continue; }
    p.y += p.vy*dt; p.x += p.vx*dt + Math.sin(p.y*.07 + i)*22*dt;
    p.size += p.grow*dt;
    const lf = p.life/p.max;
    fctx.globalAlpha = p.a * lf*lf;
    fctx.drawImage(p.s, p.x-p.size, p.y-p.size, p.size*2, p.size*2);
  }
  fctx.globalAlpha = 1;
  fctx.globalCompositeOperation = 'source-over';
  nozzleGlow.style.opacity = throttle*.9;

  /* ---- 烟雾发射 ---- */
  const padBaseY = H - 204 + camPx, cx = W/2;
  if(state === 'ignition' || (state==='ascent' && altM < 320)){
    const inten = state==='ignition' ? throttle : throttle*(1 - altM/320);
    smokeAcc += 150*inten*dt;
    while(smokeAcc > 1){
      smokeAcc--;
      const side = Math.random() < .5 ? -1 : 1;
      if(Math.random() < .7)   // 导流槽侧喷
        spawnSmoke(cx+side*rand(70,115), padBaseY+rand(-4,8),
          side*rand(130,340), rand(-95,-15), rand(14,30), rand(70,150),
          rand(1.3,2.6), rand(.28,.42));
      else                      // 底部翻滚
        spawnSmoke(cx+rand(-60,60), padBaseY+rand(-10,4),
          rand(-90,90), rand(-150,-40), rand(10,22), rand(60,120),
          rand(1,2), rand(.3,.45));
    }
  }
  if(state === 'idle'){        // 待机低温排放
    ventTimer -= dt;
    if(ventTimer <= 0){
      ventTimer = rand(.25,.6);
      spawnSmoke(cx+rand(-40,40), padBaseY, rand(-25,25), rand(-35,-10),
        rand(5,10), rand(25,50), rand(.8,1.4), rand(.1,.18), puffWhite);
    }
  }
  if(state==='ascent' && altKm>.3 && altKm<25){   // 凝结尾迹
    trailAcc += 90*dt;
    const nozzleY = (padTopY0 - risePx) - 52*scale;
    while(trailAcc > 1){
      trailAcc--;
      spawnSmoke(cx+rand(-4,4), nozzleY+rand(0,10), rand(-12,12),
        camVelPx + rand(20,70), rand(6,12), rand(35,80),
        rand(.8,1.6), rand(.09,.15), puffWhite);
    }
  }
  if(state==='ascent' && progress>.06 && progress<.5){  // 高速掠过的云
    passAcc += 3.2*dt;
    while(passAcc > 1){
      passAcc--;
      spawnSmoke(rand(0,W), -320, rand(-30,30), rand(520,920),
        rand(140,260), 30, 3.2, rand(.06,.12), puffWhite);
    }
  }

  /* ---- 烟雾更新/绘制 ---- */
  sctx.clearRect(0,0,W,H);
  for(let i=smokeP.length-1; i>=0; i--){
    const p = smokeP[i];
    p.life -= dt;
    if(p.life <= 0){ smokeP.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1 - .5*dt); p.vy *= (1 - .35*dt);
    p.r += p.grow*dt;
    const lf = p.life/p.max;
    sctx.globalAlpha = p.a * Math.min(1, lf*2);
    sctx.drawImage(p.s, p.x-p.r, p.y-p.r, p.r*2, p.r*2);
  }
  sctx.globalAlpha = 1;

  padGlow.style.opacity = throttle * (altM < 300 ? 1 : 0) * .9;

  /* ---- 星空 ---- */
  stx.clearRect(0,0,W,H);
  if(starAlpha > .01){
    for(const s of stars){
      stx.globalAlpha = starAlpha * s.b * (.55 + .45*Math.sin(now*.001*s.tw + s.ph));
      stx.drawImage(starSpr, s.x-s.r*2, s.y-s.r*2, s.r*4, s.r*4);
    }
  }
  stx.globalAlpha = 1;

  /* ---- 音效 ---- */
  if(actx){
    rumbleTimer -= dt;
    if(rumbleTimer <= 0){
      rumbleTimer = .09;
      let base = 0;
      if(state === 'ignition') base = .55;
      else if(state === 'ascent') base = altM > CAM_MAX_M ? .12 : .38;
      setRumble(base * (.85 + Math.random()*.3));
    }
  }

  /* ---- HUD / 状态文本 ---- */
  if(state === 'ignition' || state === 'ascent'){
    const t = now - t0;
    const mm = String(Math.floor(t/60000)).padStart(2,'0');
    const ss = (t%60000/1000).toFixed(1).padStart(4,'0');
    hudT.textContent = `T+ ${mm}:${ss}`;
  }
  hudAlt.textContent = altKm < 1 ? `${Math.round(altM)} m` : `${altKm.toFixed(1)} km`;
  hudVel.textContent = `${Math.round(velMs*3.6).toLocaleString()} km/h`;
  hudThr.textContent = `${Math.round(throttle*100)}%`;

  if(state === 'ascent'){
    for(let i=STATUS.length-1; i>=0; i--){
      if(progress >= STATUS[i][0]){
        if(statusIdx !== i){ statusIdx = i; statusEl.textContent = STATUS[i][1]; }
        break;
      }
    }
  }

  requestAnimationFrame(tick);
}

function finish(){
  state = 'done';
  statusEl.textContent = '已进入太空 · 发射任务圆满成功';
  setRumble(0);
  setTimeout(()=> $('#doneOverlay').classList.add('show'), 1200);
}

resize();
requestAnimationFrame(tick);
</script>
