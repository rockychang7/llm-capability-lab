  <title id="title">A pelican riding a bicycle</title>
  <desc id="description">A white pelican with a long golden bill and a generous peach throat pouch pedals a sea-green bicycle to the right. Its wing holds the handlebar, its webbed feet meet the pedals, and two detailed spoked wheels roll along a quiet coastal path.</desc>
