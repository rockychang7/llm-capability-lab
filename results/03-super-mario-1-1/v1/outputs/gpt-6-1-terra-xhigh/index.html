<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Mario Bros. 1-1</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
  body { display: grid; place-items: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
</style>
</head>
<body>
<canvas id="game" width="256" height="240" aria-label="Super Mario Bros. World 1-1"></canvas>
<script>
"use strict";
const CONFIG = {
  tile: 16, width: 256, height: 240, fps: 60,
  walkMax: 1.5625, runMax: 2.5625, walkAccel: 0.0371, runAccel: 0.0557,
  friction: 0.0508, brake: 0.1016, jump: 4, runJump: 5,
  jumpGravity: 0.125, releaseGravity: 0.4375, fallGravity: 0.21875,
  maxFall: 4.5, enemySpeed: 0.45, shellSpeed: 3.1,
  fireSpeed: 3.2, fireBounce: 2.5, invincibleFrames: 120, starFrames: 600,
  timerFrames: 24, levelLength: 212
};
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
function resize() {
  const scale = Math.max(1, Math.floor(Math.min(innerWidth / 256, innerHeight / 240)));
  canvas.style.width = (256 * scale) + "px";
  canvas.style.height = (240 * scale) + "px";
}
addEventListener("resize", resize); resize();

// . empty, # ground, B brick, ? question, S stair, [ ] pipe top,
// { } pipe body, F flag, C castle, H hidden 1UP, M multi-coin, * star.
const cells = Array.from({length: 15}, () => Array(CONFIG.levelLength).fill("."));
function put(x, y, c) { if (cells[y] && x >= 0 && x < CONFIG.levelLength) cells[y][x] = c; }
function row(y, x, text) { [...text].forEach((c, i) => put(x + i, y, c)); }
function pipe(x, h) {
  put(x, 13 - h, "["); put(x + 1, 13 - h, "]");
  for (let y = 14 - h; y < 13; y++) { put(x, y, "{"); put(x + 1, y, "}"); }
}
for (let x = 0; x < CONFIG.levelLength; x++) {
  if (!((x >= 69 && x <= 70) || (x >= 86 && x <= 88) || (x >= 153 && x <= 154))) {
    put(x, 13, "#"); put(x, 14, "#");
  }
}
put(16, 9, "?"); row(9, 20, "B?B?B"); put(22, 5, "?");
pipe(28, 2); pipe(38, 3); pipe(46, 4); pipe(57, 4); put(64, 9, "H");
row(9, 77, "B?B"); row(5, 80, "BBBBBBBB"); row(5, 91, "BBB?");
put(94, 9, "M"); row(9, 100, "B*");
[106,109,112].forEach(x => put(x, 9, "?")); put(109, 5, "?");
put(118, 9, "B"); row(5, 121, "BBB"); row(5, 128, "B??B"); row(9, 129, "BB");
function stairs(start, heights) { heights.forEach((h, i) => { for (let n = 0; n < h; n++) put(start + i, 12 - n, "S"); }); }
stairs(134, [1,2,3,4]); stairs(140, [4,3,2,1]);
stairs(148, [1,2,3,4,4]); stairs(155, [4,3,2,1]); pipe(163, 2);
row(9, 168, "BB?B"); pipe(179, 2); stairs(181, [1,2,3,4,5,6,7,8,8]);
for (let y = 3; y <= 11; y++) put(198, y, "F");
put(198, 12, "S"); row(12, 202, "CCCCC"); row(11, 202, "CCCCC"); row(10, 203, "CCC");
const LEVEL = cells.map(r => r.join(""));
let map;
const keys = Object.create(null), pressed = Object.create(null);
const handled = new Set(["ArrowLeft","ArrowRight","ArrowDown","ArrowUp","KeyZ","KeyX","Enter","Space"]);
addEventListener("keydown", e => {
  if (handled.has(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  unlockAudio();
});
addEventListener("keyup", e => { if (handled.has(e.code)) e.preventDefault(); keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
let audio;
function unlockAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  if (audio && audio.state === "suspended") audio.resume();
}
function sound(name) {
  if (!audio) return;
  const tones = {
    jump:[420,630,.12], bump:[150,95,.09], coin:[950,1350,.12], break:[170,65,.16],
    stomp:[220,110,.08], power:[340,760,.28], hurt:[500,120,.3], oneup:[650,1200,.3],
    fire:[600,200,.1], death:[480,95,.55], flag:[700,250,.5], clear:[480,960,.6]
  };
  const t = tones[name]; if (!t) return;
  const o = audio.createOscillator(), g = audio.createGain(), now = audio.currentTime;
  o.type = "square"; o.frequency.setValueAtTime(t[0], now);
  o.frequency.exponentialRampToValueAtTime(t[1], now + t[2]);
  g.gain.setValueAtTime(.045, now); g.gain.exponentialRampToValueAtTime(.001, now + t[2]);
  o.connect(g); g.connect(audio.destination); o.start(now); o.stop(now + t[2]);
}
const state = {scene:"title", frame:0, lives:3, coins:0, score:0, time:400, camera:0, world:"over", sceneTimer:0};
let mario, enemies, items, fireballs, effects, blockData, combo, undergroundCoins;
function initLevel() {
  map = LEVEL.map(r => r.split(""));
  mario = {x:48,y:192,w:12,h:16,vx:0,vy:0,ground:false,dir:1,power:0,inv:0,star:0,duck:false,anim:0,skid:false};
  enemies = [22,40,51,52.5,97,98.5,114,115.5,124,125.5,128,129.5,174,175.5]
    .map(x => ({type:"goomba",x:x*16,y:192,w:14,h:16,vx:-CONFIG.enemySpeed,vy:0,active:false,dead:0}));
  enemies.push(...[82,85].map(x => ({type:"goomba",x:x*16,y:64,w:14,h:16,vx:-CONFIG.enemySpeed,vy:0,active:false,dead:0})));
  enemies.push({type:"koopa",x:107*16,y:184,w:14,h:24,vx:-CONFIG.enemySpeed,vy:0,active:false,dead:0,shell:false});
  items = []; fireballs = []; effects = []; blockData = {}; combo = 0; undergroundCoins = new Set();
  state.camera = 0; state.time = 400; state.world = "over"; state.frame = 0;
}
function startGame() { state.score=0; state.coins=0; state.lives=3; initLevel(); state.scene="intro"; state.sceneTimer=120; }
function tile(x,y) {
  if (state.world === "under") {
    if (y >= 13) return "#";
    if (x < 0 || x >= 16) return "S";
    return ".";
  }
  if (x < 0 || x >= CONFIG.levelLength || y >= 15) return ".";
  if (y < 0) return ".";
  return map[y][x];
}
function solid(c) { return c === "#" || c === "B" || c === "?" || c === "S" || c === "[" || c === "]" || c === "{" || c === "}" || c === "U" || c === "M" || c === "*"; }
function hit(a,b) { return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function addScore(n,x,y) { state.score += n; if (x !== undefined) effects.push({kind:"text",x,y,t:45,text:String(n)}); }
function coin(x,y) {
  state.coins++; addScore(200,x,y); sound("coin");
  effects.push({kind:"coin",x,y,t:28});
  if (state.coins >= 100) { state.coins -= 100; state.lives++; sound("oneup"); }
}
function blockHit(tx,ty) {
  if (state.world !== "over" || !map[ty]) return;
  const c = map[ty][tx]; if (!c || c === "." || c === "U") return;
  const key = tx+","+ty;
  for (const e of enemies) {
    if (!e.dead && e.x+e.w > tx*16 && e.x < tx*16+16 && Math.abs(e.y+e.h-ty*16) < 6) {
      e.dead=35; e.vy=-3; e.flipped=true; addScore(100,e.x,e.y); sound("stomp");
    }
  }
  effects.push({kind:"bump",x:tx*16,y:ty*16,t:10});
  if (c === "H") {
    map[ty][tx]="U"; items.push({type:"oneup",x:tx*16,y:ty*16-16,w:14,h:14,vx:1,vy:0}); sound("power");
  } else if (c === "?" || c === "*") {
    map[ty][tx]="U";
    let type = null;
    if (c === "*") type="star";
    if ((tx===21 && ty===9) || (tx===78 && ty===9) || (tx===109 && ty===5)) type = mario.power ? "flower" : "mushroom";
    if (type) { items.push({type,x:tx*16,y:ty*16-16,w:14,h:14,vx: type==="flower"?0:1,vy:0}); sound("power"); }
    else coin(tx*16,ty*16-16);
  } else if (c === "M") {
    blockData[key]=(blockData[key]||0)+1; coin(tx*16,ty*16-16);
    if (blockData[key]>=10) map[ty][tx]="U";
  } else if (c === "B" && mario.power) {
    map[ty][tx]="."; addScore(50,tx*16,ty*16); sound("break");
    for (let i=0;i<4;i++) effects.push({kind:"debris",x:tx*16+8,y:ty*16+8,vx:(i%2?1:-1)*(1+i%2),vy:i<2?-3:-5,t:45});
  } else sound("bump");
}
function moveBody(o, headHit=false) {
  o.ground=false;
  o.x += o.vx;
  let x0=Math.floor(o.x/16), x1=Math.floor((o.x+o.w-.01)/16);
  let y0=Math.floor(o.y/16), y1=Math.floor((o.y+o.h-.01)/16);
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) {
    if (!solid(tile(x,y))) continue;
    if (o.vx>0) o.x=Math.min(o.x,x*16-o.w);
    if (o.vx<0) o.x=Math.max(o.x,(x+1)*16);
    o.wall=true;
  }
  o.y += o.vy;
  x0=Math.floor(o.x/16); x1=Math.floor((o.x+o.w-.01)/16);
  y0=Math.floor(o.y/16); y1=Math.floor((o.y+o.h-.01)/16);
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) {
    const c=tile(x,y), hidden = c==="H" && headHit && o.vy<0;
    if (!solid(c) && !hidden) continue;
    if (o.vy>0) { o.y=Math.min(o.y,y*16-o.h); o.vy=0; o.ground=true; }
    else if (o.vy<0) { o.y=Math.max(o.y,(y+1)*16); o.vy=0; if (headHit) blockHit(x,y); }
  }
}
function hurt() {
  if (mario.inv || mario.star || state.scene!=="play") return;
  if (mario.power) { mario.power--; mario.inv=CONFIG.invincibleFrames; sound("hurt"); }
  else die();
}
function die() {
  if (state.scene!=="play") return;
  state.scene="death"; state.sceneTimer=0; mario.vy=-4.2; mario.vx=0; sound("death");
}
function useItem(it) {
  if (it.type==="oneup") { state.lives++; sound("oneup"); effects.push({kind:"text",x:it.x,y:it.y,t:45,text:"1UP"}); }
  else {
    addScore(1000,it.x,it.y);
    if (it.type==="mushroom") mario.power=Math.max(1,mario.power);
    if (it.type==="flower") mario.power=2;
    if (it.type==="star") mario.star=CONFIG.starFrames;
    sound("power");
  }
  it.dead=true;
}
function stepMario() {
  let dir=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0), run=!!keys.KeyX;
  mario.duck=!!keys.ArrowDown && mario.power>0 && mario.ground;
  const newHeight=mario.power && !mario.duck?32:16;
  if (newHeight!==mario.h) { mario.y += mario.h-newHeight; mario.h=newHeight; }
  mario.skid=!!dir && mario.vx*dir<-.3;
  if (dir && !mario.duck) {
    let acceleration=run?CONFIG.runAccel:CONFIG.walkAccel;
    if (mario.skid) acceleration=CONFIG.brake;
    mario.vx += dir * acceleration;
    const max=run?CONFIG.runMax:CONFIG.walkMax;
    mario.vx=Math.max(-max,Math.min(max,mario.vx));
    mario.dir=dir;
  } else if (Math.abs(mario.vx)<=CONFIG.friction) mario.vx=0;
  else mario.vx-=Math.sign(mario.vx)*CONFIG.friction;
  if (pressed.KeyZ && mario.ground && !mario.duck) {
    mario.vy=-(Math.abs(mario.vx)>1.5?CONFIG.runJump:CONFIG.jump); mario.ground=false; sound("jump");
  }
  mario.vy=Math.min(CONFIG.maxFall,mario.vy+(mario.vy<0?(keys.KeyZ?CONFIG.jumpGravity:CONFIG.releaseGravity):CONFIG.fallGravity));
  mario.wall=false; moveBody(mario,true);
  if (mario.ground) combo=0;
  if (mario.inv) mario.inv--; if (mario.star) mario.star--;
  if (pressed.KeyX && mario.power===2 && fireballs.length<2) {
    fireballs.push({x:mario.x+(mario.dir>0?12:-6),y:mario.y+10,w:6,h:6,vx:mario.dir*CONFIG.fireSpeed,vy:0}); sound("fire");
  }
  if (state.world==="over") {
    mario.x=Math.max(state.camera, mario.x);
    state.camera=Math.max(state.camera,Math.min(mario.x-96,CONFIG.levelLength*16-256));
    if (keys.ArrowDown && mario.ground && mario.x+6>=57*16 && mario.x+6<59*16 && Math.abs(mario.y+mario.h-9*16)<3) {
      state.world="under"; mario.x=24; mario.y=176; mario.vx=0; mario.vy=0; state.camera=0;
    }
    if (mario.x+ mario.w >= 198*16 && mario.x < 199*16 && mario.y+mario.h > 48) {
      const height=Math.max(0,208-(mario.y+mario.h)), points=height>128?5000:height>96?2000:height>64?800:height>32?400:100;
      addScore(points,mario.x,mario.y); state.scene="flag"; state.sceneTimer=0; mario.vx=0; sound("flag");
    }
  } else if (mario.x>220 && keys.ArrowDown && mario.ground) {
    state.world="over"; mario.x=163*16; mario.y=160; mario.vx=0; mario.vy=0; state.camera=154*16;
  }
  if (mario.y>260) die();
}
function stepEnemies() {
  if (state.world!=="over") return;
  for (const e of enemies) {
    if (e.dead) { e.dead--; if(e.flipped) { e.y+=e.vy; e.vy+=.25; } continue; }
    if (!e.active && e.x<state.camera+272) e.active=true;
    if (!e.active) continue;
    e.vy=Math.min(CONFIG.maxFall,e.vy+CONFIG.fallGravity);
    e.wall=false; const old=e.vx; moveBody(e);
    if (e.wall) e.vx=-old;
    if (e.y>260) { e.dead=-1; continue; }
    if (e.type==="koopa" && e.shell && Math.abs(e.vx)>1) {
      for (const other of enemies) if (other!==e && !other.dead && hit(e,other)) { other.dead=35; other.flipped=true; other.vy=-3; addScore(200,other.x,other.y); sound("stomp"); }
    }
    if (!hit(mario,e)) continue;
    if (mario.star) { e.dead=35; e.flipped=true; e.vy=-3; addScore(200,e.x,e.y); sound("stomp"); continue; }
    const stomp=mario.vy>0 && mario.y+mario.h-e.y<10;
    if (stomp) {
      mario.vy=-3.2; const scores=[100,200,400,500,800,1000,2000,4000,5000,8000];
      if (combo<scores.length) addScore(scores[combo],e.x,e.y); else { state.lives++; sound("oneup"); }
      combo++; sound("stomp");
      if (e.type==="goomba") { e.dead=25; e.vx=0; }
      else if (!e.shell) { e.shell=true; e.y+=8; e.h=16; e.vx=0; }
      else if (e.vx) e.vx=0;
      else e.vx=(mario.x<e.x?1:-1)*CONFIG.shellSpeed;
    } else if (e.type==="koopa" && e.shell && !e.vx) {
      e.vx=(mario.x<e.x?1:-1)*CONFIG.shellSpeed; mario.inv=10; sound("stomp");
    } else hurt();
  }
  enemies=enemies.filter(e=>e.dead!==-1 && e.y<300 && !(e.dead===0 && e.type==="goomba" && e.vx===0));
}
function stepObjects() {
  for (const it of items) {
    if (it.type!=="flower") {
      it.vy=Math.min(CONFIG.maxFall,it.vy+CONFIG.fallGravity); it.wall=false; const old=it.vx; moveBody(it);
      if(it.wall) it.vx=-old;
      if(it.type==="star" && it.ground) it.vy=-3;
    }
    if(hit(mario,it)) useItem(it);
    if(it.y>260) it.dead=true;
  }
  items=items.filter(it=>!it.dead);
  for (const f of fireballs) {
    f.vy=Math.min(4,f.vy+.25); f.wall=false; moveBody(f);
    if(f.ground) f.vy=-CONFIG.fireBounce;
    if(f.wall || f.y>240 || f.x<state.camera || f.x>state.camera+256) f.dead=true;
    for(const e of enemies) if(!e.dead && hit(f,e)) { f.dead=true; e.dead=35; e.flipped=true; e.vy=-3; addScore(200,e.x,e.y); sound("stomp"); }
  }
  fireballs=fireballs.filter(f=>!f.dead);
  for(const e of effects) { e.t--; if(e.kind==="debris"){e.x+=e.vx;e.y+=e.vy;e.vy+=.25;} if(e.kind==="coin")e.y-=1; }
  effects=effects.filter(e=>e.t>0);
  if(state.world==="under") for(let x=3;x<=12;x++) for(let y=8;y<=10;y++) {
    const key=x+","+y;
    if(!undergroundCoins.has(key) && hit(mario,{x:x*16+4,y:y*16,w:8,h:12})) { undergroundCoins.add(key); coin(x*16,y*16); }
  }
}
function update() {
  state.frame++;
  if(state.scene==="title") { if(pressed.Enter || pressed.Space || pressed.KeyZ) startGame(); }
  else if(state.scene==="intro") { if(--state.sceneTimer<=0) state.scene="play"; }
  else if(state.scene==="play") {
    if(state.frame%CONFIG.timerFrames===0 && --state.time<=0) die();
    if(state.scene==="play") { stepMario(); stepEnemies(); stepObjects(); }
  } else if(state.scene==="death") {
    state.sceneTimer++;
    if(state.sceneTimer>25) { mario.y+=mario.vy; mario.vy+=.2; }
    if(state.sceneTimer>160) { state.lives--; if(state.lives<=0){state.scene="gameover";state.sceneTimer=180;} else {initLevel();state.scene="intro";state.sceneTimer=120;} }
  } else if(state.scene==="gameover") { if(--state.sceneTimer<=0 || pressed.Enter) state.scene="title"; }
  else if(state.scene==="flag") {
    state.sceneTimer++; mario.x=198*16-11; mario.y=Math.min(192,mario.y+1.5);
    state.camera=Math.max(state.camera,Math.min(mario.x-96,CONFIG.levelLength*16-256));
    if(mario.y>=192) { state.scene="walkcastle"; mario.dir=1; }
  } else if(state.scene==="walkcastle") {
    mario.x+=1; if(mario.x>204*16) { state.scene="tally"; sound("clear"); }
  } else if(state.scene==="tally") {
    if(state.time>0) { const n=Math.min(5,state.time); state.time-=n; state.score+=n*50; }
    else if(++state.sceneTimer>240) state.scene="title";
  }

}
function rect(x,y,w,h,c) { ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }
function text(s,x,y,color="#fff",size=8) { ctx.fillStyle=color;ctx.font=`bold ${size}px monospace`;ctx.textBaseline="top";ctx.fillText(s,x,y); }
function cloud(x,y) {
  rect(x+4,y,24,8,"#fff"); rect(x,y+5,36,8,"#fff"); rect(x+8,y-3,8,6,"#fff");
  rect(x+3,y+10,29,2,"#b8d8f8");
}
function bush(x,y) {
  rect(x,y+8,40,6,"#008800"); rect(x+4,y+3,31,8,"#00b800"); rect(x+12,y,12,8,"#00b800");
  rect(x+10,y+5,2,2,"#005800"); rect(x+27,y+5,2,2,"#005800");
}
function hill(x,y,w) {
  for(let i=0;i<w/2;i+=4) rect(x+i,y-i/2,w-i*2,4,"#00a800");
  rect(x+w/2-8,y-13,3,4,"#005800"); rect(x+w/2+8,y-9,3,4,"#005800");
}
function background() {
  rect(0,0,256,240,state.world==="under"?"#000":"#5c94fc");
  if(state.world==="over") {
    for(let base=0;base<CONFIG.levelLength*16;base+=384) {
      cloud(base+75-state.camera,48); cloud(base+215-state.camera,63);
      hill(base+15-state.camera,207,72); bush(base+130-state.camera,194); hill(base+270-state.camera,207,44);
    }
  }
}
function drawTile(c,x,y,tx,ty) {
  const brick=state.world==="under"?"#3060b8":"#c84c0c", light=state.world==="under"?"#7898e8":"#fc9860";
  if(c==="#" || c==="B" || c==="M" || c==="*") {
    rect(x,y,16,16,brick); rect(x,y,16,1,light); rect(x,y+7,16,1,"#602808");
    rect(x+7,y,1,7,"#602808"); rect(x+3,y+8,1,8,"#602808"); rect(x+12,y+8,1,8,"#602808");
    if(c==="#") { rect(x+1,y+1,5,5,"#e87830"); rect(x+9,y+9,6,5,"#e87830"); }
  } else if(c==="?" || c==="U") {
    rect(x,y,16,16,c==="U"?"#a85820":(state.frame%32<16?"#f8b800":"#e87818"));
    rect(x+1,y+1,14,1,"#ffe090"); rect(x+1,y+14,14,1,"#783000");
    rect(x+2,y+2,2,2,"#783000"); rect(x+12,y+12,2,2,"#783000");
    if(c==="?") text("?",x+4,y+2,"#fff",12);
  } else if(c==="S") {
    rect(x,y,16,16,"#c06020"); rect(x+1,y+1,13,13,"#e89048"); rect(x+2,y+2,11,11,"#c87030");
  } else if("[]{}".includes(c)) {
    rect(x,y,16,16,"#008800"); rect(x+2,y,5,16,"#58e048"); rect(x+9,y,4,16,"#00b800");
    if(c==="[" || c==="]") { rect(x,y,16,3,"#004800"); rect(x,y+3,16,2,"#68f858"); rect(x,y+14,16,2,"#004800"); }

    if(ty===3) {rect(x+4,y-4,8,7,"#38b800");rect(x-1,y+3,8,6,"#fff");rect(x+1,y+5,4,3,"#00a800");}
  } else if(c==="C") {
    rect(x,y,16,16,"#a84818"); rect(x,y,16,1,"#f09850"); rect(x+7,y,1,8,"#602808"); rect(x+2,y+8,1,8,"#602808");
    if(tx===204 && ty===12) { rect(x+3,y+4,10,12,"#000"); rect(x+5,y+1,6,4,"#000"); }
  }
}
function spriteMario(x,y) {
  if(mario.inv && state.frame%6<3) return;
  let red=mario.power===2?"#f8f8f8":"#d82800", over=mario.power===2?"#e84818":"#a80000";
  if(mario.star && state.frame%6<3) { red="#40d8a0"; over="#f8e000"; }
  const h=mario.h;
  if(h>16) { rect(x+3,y+14,10,16,red); rect(x+2,y+23,12,6,over); }
  const yy=y+(h>16?0:0);
  rect(x+3,yy,9,3,red);rect(x+2,yy+3,13,2,red);
  rect(x+3,yy+5,8,5,"#f8b878");rect(x+1,yy+5,3,5,"#704000");rect(x+9,yy+6,4,2,"#704000");
  rect(x+4,yy+10,7,4,red);rect(x+2,yy+11,3,4,"#f8b878");rect(x+10,yy+11,3,4,"#f8b878");
  const legY=y+h-4;
  if(!mario.ground || mario.skid) { rect(x,legY,6,4,"#704000");rect(x+9,legY-2,5,4,"#704000"); }
  else if(Math.abs(mario.vx)>.2 && Math.floor(state.frame/6)%3===0) {rect(x+1,legY,6,4,"#704000");rect(x+9,legY-1,5,4,"#704000");}
  else {rect(x+2,legY,5,4,"#704000");rect(x+9,legY,5,4,"#704000");}
}
function drawEnemy(e,x,y) {
  if(e.flipped) {ctx.save();ctx.translate(x+7,y+8);ctx.rotate(Math.PI);x=-7;y=-8;}
  if(e.type==="goomba") {
    if(e.dead) {rect(x,y+12,14,4,"#a84808");}
    else {rect(x+3,y+2,8,4,"#a84808");rect(x+1,y+6,12,6,"#a84808");rect(x,y+12,14,3,"#f8b878");rect(x+3,y+6,2,3,"#fff");rect(x+9,y+6,2,3,"#fff");rect(x+2,y+14,4,2,"#442000");rect(x+9,y+14,4,2,"#442000");}
  } else if(e.shell) { rect(x+1,y+5,12,10,"#00a800");rect(x+3,y+3,8,3,"#78e848");rect(x+2,y+13,10,3,"#f8d090"); }
  else {rect(x+5,y,7,9,"#f8c078");rect(x+2,y+8,11,11,"#00a800");rect(x+1,y+18,12,3,"#f8c078");rect(x+2,y+21,4,3,"#a85018");rect(x+9,y+21,4,3,"#a85018");}
  if(e.flipped) ctx.restore();
}
function render() {
  ctx.clearRect(0,0,256,240);
  if(state.scene==="title") {
    rect(0,0,256,240,"#5c94fc"); text("MARIO     000000    WORLD  TIME",24,16); text("          x00      1-1",24,27);
    text("SUPER",80,58,"#fff",16); text("MARIO BROS.",45,79,"#f8d050",20);
    text("1 PLAYER GAME",75,145); text("PUSH ENTER",86,164); text("(C) 1985",91,201);
    return;
  }
  if(state.scene==="intro" || state.scene==="gameover") {
    rect(0,0,256,240,"#000"); text("MARIO     000000    WORLD  TIME",24,16);
    if(state.scene==="gameover") text("GAME OVER",96,120);
    else {text("WORLD 1-1",92,104);text("MARIO  x "+state.lives,83,128);}
    return;
  }
  background();
  const cam=state.camera;
  if(state.world==="over") {
    const start=Math.max(0,Math.floor(cam/16)), end=Math.min(CONFIG.levelLength,start+18);
    for(let y=0;y<15;y++) for(let x=start;x<end;x++) {const c=map[y][x];if(c!=="." && c!=="H")drawTile(c,x*16-cam,y*16,x,y);}
  } else {
    for(let x=0;x<16;x++) for(let y=13;y<15;y++) drawTile("#",x*16,y*16,x,y);
    for(let x=3;x<=12;x++) for(let y=8;y<=10;y++) if(!undergroundCoins.has(x+","+y)) {rect(x*16+5,y*16+2,6,10,"#f8c000");rect(x*16+7,y*16+3,2,7,"#fff080");}
    rect(232,176,24,32,"#008800"); rect(228,174,28,5,"#58e048");
  }
  for(const e of enemies) if(state.world==="over" && e.active && e.x>cam-32 && e.x<cam+280) drawEnemy(e,e.x-cam,e.y);
  for(const it of items) {
    const x=it.x-cam,y=it.y; if(it.type==="flower"){rect(x+6,y+5,3,10,"#00b800");rect(x+2,y,11,9,"#f85018");rect(x+5,y+2,5,5,"#fff");}
    else if(it.type==="star"){text("*",x,y,"#f8d800",16);}
    else {rect(x+2,y+2,11,7,it.type==="oneup"?"#00b800":"#d82800");rect(x,y+6,15,4,it.type==="oneup"?"#00b800":"#d82800");rect(x+3,y+10,9,5,"#f8d8a0");rect(x+5,y+3,3,3,"#fff");}
  }
  for(const f of fireballs) rect(f.x-cam,f.y,6,6,"#f8b800");
  for(const e of effects) {
    if(e.kind==="text") text(e.text,e.x-cam,e.y-(45-e.t)/3,"#fff");
    if(e.kind==="coin") {rect(e.x-cam+5,e.y,6,10,"#f8c000");}
    if(e.kind==="debris") rect(e.x-cam,e.y,4,4,"#c86020");
  }
  if(state.scene!=="tally") spriteMario(mario.x-cam,mario.y);
  text("MARIO",24,16);text(String(state.score).padStart(6,"0"),24,26);
  text("x"+String(state.coins).padStart(2,"0"),100,26);
  rect(90,27,5,7,"#f8c000");text("WORLD",151,16);text("1-1",160,26);
  text("TIME",208,16);text(String(state.time).padStart(3,"0"),215,26);
}
let previous=0, accumulator=0;
function frame(now) {
  if(!previous) previous=now;
  accumulator+=Math.min(250,now-previous); previous=now;
  const step=1000/CONFIG.fps;
  while(accumulator>=step) { update(); accumulator-=step; }
  render(); requestAnimationFrame(frame);
}
