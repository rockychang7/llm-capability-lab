<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Super Mario Bros. - World 1-1</title>
<style>
  :root { color-scheme: dark; --ink: #101014; --line: #323238; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { display: grid; place-items: center; background: repeating-linear-gradient(0deg,#17171b 0px,#17171b 2px,#19191e 2px,#19191e 4px); touch-action: none; }
  main { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  canvas { display: block; width: 256px; height: 240px; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; box-shadow: 0 0 0 1px #38383e,0 12px 48px #0009; }
  .tools { position: absolute; top: 0; right: -40px; display: flex; flex-direction: column; gap: 6px; }
  button { -webkit-tap-highlight-color: transparent; touch-action: none; cursor: pointer; color: #ddd; background: #222228; border: 1px solid #45454c; border-radius: 4px; min-width: 32px; min-height: 32px; padding: 7px; }
  button:hover { background: #38383f; }
  button:focus-visible { outline: 2px solid #fcb434; outline-offset: 3px; }
  button[aria-pressed="true"] { border-color: #fcb434; }
  .pause-icon { display: block; width: 12px; height: 14px; border-left: 4px solid currentColor; border-right: 4px solid currentColor; margin: auto; }
  .sound-icon { display: block; width: 14px; height: 12px; background: currentColor; clip-path: polygon(0 30%,30% 30%,70% 0,70% 100%,30% 70%,0 70%); }
  #sound[aria-pressed="true"] .sound-icon { opacity: .35; }
  .full-icon { display: block; width: 15px; height: 15px; border: 2px dashed currentColor; }
  .touch { display: none; width: min(100vw - 24px,512px); justify-content: space-between; padding-top: 14px; user-select: none; }
  .dpad { display: grid; grid-template: repeat(2,44px) / repeat(3,44px); gap: 4px; }
  .touch button { width: 44px; height: 44px; font: bold 16px monospace; }
  .dpad [data-key="ArrowUp"] { grid-area: 1/2; }
  .dpad [data-key="ArrowLeft"] { grid-area: 2/1; }
  .dpad [data-key="ArrowDown"] { grid-area: 2/2; }
  .dpad [data-key="ArrowRight"] { grid-area: 2/3; }
  .arrow { display: block; width: 0; height: 0; margin: auto; border: 7px solid transparent; border-bottom-color: currentColor; transform: translateY(-4px); }
  .left { transform: rotate(-90deg) translateY(-4px); }
  .right { transform: rotate(90deg) translateY(-4px); }
  .down { transform: rotate(180deg) translateY(-4px); }
  .actions { display: flex; align-items: end; gap: 12px; padding: 0 6px 4px 0; }
  .actions button { width: 54px; height: 54px; border-radius: 50%; background: #963c29; }
  @media (pointer: coarse) { .touch { display: flex; } }
  @media (max-width: 900px) { .tools { top: -38px; right: 0; flex-direction: row; } }
</style>
</head>
<body>
<main>
  <canvas id="screen" width="256" height="240" tabindex="0" aria-label="Super Mario Bros. World 1-1 game"></canvas>
  <div class="tools">
    <button id="pause" title="Pause / resume (Enter)" aria-label="Pause / resume" aria-pressed="false"><span class="pause-icon"></span></button>
    <button id="sound" title="Mute / unmute (M)" aria-label="Mute / unmute" aria-pressed="false"><span class="sound-icon"></span></button>
    <button id="full" title="Fullscreen" aria-label="Fullscreen"><span class="full-icon"></span></button>
  </div>
  <div class="touch" aria-label="Game controls">
    <div class="dpad">
      <button data-key="ArrowUp" aria-label="Up"><span class="arrow"></span></button>
      <button data-key="ArrowLeft" aria-label="Left"><span class="arrow left"></span></button>
      <button data-key="ArrowDown" aria-label="Down"><span class="arrow down"></span></button>
      <button data-key="ArrowRight" aria-label="Right"><span class="arrow right"></span></button>
    </div>
    <div class="actions">
      <button data-key="KeyX" aria-label="Run / fire">X</button>

        for (let i=0;i<data.length;i++) data[i]=Math.random()*2-1;

function step() {

  if(G.mode==='intro') { if(G.modeTick>=CONFIG.timers.intro)setMode('play'); }
  else if(G.mode==='gameover') {
    if(G.modeTick>=CONFIG.timers.gameOver) { resetWorld(); setMode('title'); }
  } else if(G.mode==='death') {
    if(G.modeTick>CONFIG.player.deathWait) { P.y+=P.vy; P.vy+=CONFIG.player.deathGravity; }
    if(G.modeTick>=CONFIG.player.deathDuration) {

    }
  } else if(G.mode==='pipe') updatePipe();
  else if(G.mode==='flag') updateFlag();
  else if(G.mode==='play') {
    if(G.freeze>0) { G.freeze--; Input.pressed.clear(); return; }
    updatePlayer();
    if(G.mode==='play') {
      updateEnemies();

      updateParticles(); updateCamera();
      if(++G.timeTick>=CONFIG.timers.tickFrames) {

    }
  }
  Input.pressed.clear();
}
