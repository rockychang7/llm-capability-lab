/* 用代码生成的像素图：管道、横向管道、城堡砖、火球爆炸 */
function buildGeneratedArt() {
  const LIP = 'K' + 'G' + 'HH' + 'G' + 'H'.repeat(7) + 'G' + 'H' + 'G'.repeat(10) + 'H' + 'GG' + 'H' + 'GGG' + 'K';
  const BODY = '..' + 'K' + 'G' + 'HH' + 'G' + 'H'.repeat(5) + 'G' + 'H' + 'G'.repeat(10) + 'H' + 'G' + 'H' + 'GG' + 'K' + '..';
  const FULL = 'K'.repeat(32);
  const top = [], body = [];
  for (let y = 0; y < 16; y++) { top.push(y === 0 || y === 15 ? FULL : LIP); body.push(BODY); }
  ART.pipeTL = top.map(r => r.slice(0, 16)); ART.pipeTR = top.map(r => r.slice(16));
  ART.pipeBL = body.map(r => r.slice(0, 16)); ART.pipeBR = body.map(r => r.slice(16));
  // 横向管道：把竖管道的花纹转置 90 度
  const sideLip = [], sideBody = [];
  for (let y = 0; y < 32; y++) {
    let a = '', b = '';
    for (let x = 0; x < 16; x++) { a += (x === 0 || x === 15) ? 'K' : LIP[y]; b += BODY[y]; }
    sideLip.push(a); sideBody.push(b);
  }
  ART.sideLipTop = sideLip.slice(0, 16); ART.sideLipBot = sideLip.slice(16);
  ART.sideBodyTop = sideBody.slice(0, 16); ART.sideBodyBot = sideBody.slice(16);
  // 城堡：在砖块图上挖出垛口、窗户、门
  const wall = ART.brick.slice(); wall[0] = 'MMMMMMMKMMMMMMMK';
  const carve = (fn) => wall.map((row, y) => row.split('').map((ch, x) => { const r = fn(x, y); return r === null ? ch : r; }).join(''));
  ART.castleBrick = wall;
  ART.castleTop = carve((x, y) => (y < 8 && x >= 8) ? '.' : (y === 0 && x < 8 ? 'L' : null));
  ART.castleWindow = carve((x, y) => (x >= 6 && x <= 9 && y >= 3 && y <= 13 && !(y === 3 && (x === 6 || x === 9))) ? 'K' : null);
  ART.castleArch = carve((x, y) => {
    if (y >= 8 && x >= 3 && x <= 12) return 'K';
    if (y === 7 && x >= 4 && x <= 11) return 'K';
    if (y === 6 && x >= 6 && x <= 9) return 'K';
    return null;
  });
  ART.castleDoor = carve((x) => (x >= 3 && x <= 12) ? 'K' : null);
  // 火球打中时的小爆炸（3 帧）
  for (let k = 0; k < 3; k++) {
    const r = 2 + k * 2.5, rows = [];
    for (let y = 0; y < 16; y++) {
      let s = '';
      for (let x = 0; x < 16; x++) {
        const d = Math.hypot(x - 7.5, y - 7.5);
        s += Math.abs(d - r) < 1.1 ? 'O' : (d < r - 1 ? (k === 0 ? 'W' : 'Y') : '.');
      }
      rows.push(s);
    }
    ART['burst' + k] = rows;
  }
}
buildGeneratedArt();

/* =========================================================================
 * 5. 画布与像素图缓存
 * ========================================================================= */
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function buildSprite(rows, pal, flipX, flipY) {
  const h = rows.length, w = rows[0].length;
  const c = makeCanvas(w, h), g = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    const row = rows[flipY ? h - 1 - y : y];
    for (let x = 0; x < w; x++) {
      const col = pal[row[flipX ? w - 1 - x : x]];
      if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
  }
  return c;
}
const spriteCache = new Map();
function sprite(name, palKey, flipX, flipY) {
  const key = name + '|' + palKey + '|' + (flipX ? 1 : 0) + (flipY ? 1 : 0);
  let c = spriteCache.get(key);
  if (!c) { c = buildSprite(ART[name], PALETTES[palKey], !!flipX, !!flipY); spriteCache.set(key, c); }
  return c;
}

/* ---- 背景装饰：白云、灌木、小山丘（纯装饰，没有碰撞） ---- */
function blobCanvas(w, h, inside, colors, shadeFn, openBottom) {
  const c = makeCanvas(w, h), g = c.getContext('2d');
  const isIn = (x, y) => x >= 0 && y >= 0 && x < w && y < h && inside(x + 0.5, y + 0.5);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (!isIn(x, y)) continue;
      const bottomEdge = !isIn(x, y + 1) && !(openBottom && y === h - 1);
      const edge = !isIn(x - 1, y) || !isIn(x + 1, y) || !isIn(x, y - 1) || bottomEdge;
      g.fillStyle = edge ? colors.outline : (shadeFn && shadeFn(x, y, isIn) ? colors.shade : colors.fill);
      g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}
// 云朵形状：n 个上层圆团 + n+1 个下层圆团（灌木用同一个形状的上半截，和原版一样）
function cloudShape(n, w) {
  return (px, py) => {
    for (let i = 0; i <= n; i++) { const cx = 8 + 16 * i; if ((px - cx) ** 2 + (py - 15) ** 2 <= 64) return true; }

  const pattern = [

const STOMP_TABLE = [100, 200, 400, 500, 800, 1000, 2000, 4000, 5000, 8000];

function addScore(pts, x, y) {
  G.score = Math.min(999999, G.score + pts);
  if (x !== undefined) popups.push({ x, y, text: String(pts), t: 0 });
}
function oneUp(x, y) {
  G.lives = Math.min(99, G.lives + 1);
  Sound.play('oneup');
  if (x !== undefined) popups.push({ x, y, text: '1UP', t: 0 });
}
function chainScore(table, idx, x, y) {
  if (idx < table.length) addScore(table[idx], x, y); else oneUp(x, y);
}
function addCoin() {
  G.coins++;
  addScore(200);
  Sound.play('coin');
  if (G.coins >= 100) { G.coins -= 100; oneUp(); }
}

/* =========================================================================
 * 9. 碰撞：先横向再纵向，只检测"新进入的那一列 / 一行"，不会被吸进墙里
 * ========================================================================= */
function collideX(e, area, dx, upMario) {
  if (dx === 0) return false;
  const r0 = Math.floor(e.y / TILE), r1 = Math.floor((e.y + e.h - 0.001) / TILE);
  const nx = e.x + dx;
  if (dx > 0) {
    const oldEdge = Math.floor((e.x + e.w - 0.001) / TILE), newEdge = Math.floor((nx + e.w - 0.001) / TILE);
    for (let c = oldEdge + 1; c <= newEdge; c++)
      for (let r = r0; r <= r1; r++)
        if (isSolid(area, c, r, false)) { e.x = c * TILE - e.w; return true; }
  } else {
    const oldEdge = Math.floor(e.x / TILE), newEdge = Math.floor(nx / TILE);
    for (let c = oldEdge - 1; c >= newEdge; c--)
      for (let r = r0; r <= r1; r++)
        if (isSolid(area, c, r, false)) { e.x = (c + 1) * TILE; return true; }
  }
  e.x = nx;
  return false;
}
// 返回 1 = 落地，-1 = 顶到头，0 = 没碰到；碰到的行存进 e.hitRow
function collideY(e, area, dy, upMario) {
  e.hitRow = -1;
  if (dy === 0) return 0;
  const c0 = Math.floor(e.x / TILE), c1 = Math.floor((e.x + e.w - 0.001) / TILE);
  const ny = e.y + dy;
  if (dy > 0) {
    const oldEdge = Math.floor((e.y + e.h - 0.001) / TILE), newEdge = Math.floor((ny + e.h - 0.001) / TILE);
    for (let r = oldEdge + 1; r <= newEdge; r++)
      for (let c = c0; c <= c1; c++)
        if (isSolid(area, c, r, false)) { e.y = r * TILE - e.h; e.hitRow = r; return 1; }
  } else {
    const oldEdge = Math.floor(e.y / TILE), newEdge = Math.floor(ny / TILE);
    for (let r = oldEdge - 1; r >= newEdge; r--)
      for (let c = c0; c <= c1; c++)
        if (isSolid(area, c, r, upMario)) { e.y = (r + 1) * TILE; e.hitRow = r; return -1; }
  }
  e.y = ny;
  return 0;
}
// 速度为 0 时探测脚下是否有地（站稳用）
function probeGround(e, area) {
  const feet = e.y + e.h;
  const r = Math.round(feet / TILE);
  if (Math.abs(feet - r * TILE) > 0.5) return false;
  const c0 = Math.floor(e.x / TILE), c1 = Math.floor((e.x + e.w - 0.001) / TILE);
  for (let c = c0; c <= c1; c++) if (isSolid(area, c, r, false)) { e.y = r * TILE - e.h; return true; }
  return false;
}
function stepVertical(e, area, gravity, maxFall, upMario) {
  e.onGround = false;
  const res = collideY(e, area, e.vy, upMario);
  if (res === 1) { e.onGround = true; e.vy = 0; }
  else if (res === -1) { e.vy = 0; }
  else if (e.vy >= 0 && probeGround(e, area)) { e.onGround = true; e.vy = 0; }
  if (!e.onGround) e.vy = Math.min(e.vy + gravity, maxFall);
  return res;
}
function boxHitsSolid(area, x, y, w, h) {
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 0.001) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 0.001) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (isSolid(area, c, r, false)) return true;
  return false;
}
function overlap(ax, ay, aw, ah, bx, by, bw, bh) { return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by; }
function alive(e) { return e.state !== 'dead' && e.state !== 'flat'; }

/* =========================================================================
 * 10. 马里奥
 * ========================================================================= */
function marioTargetH() { return (m.power > 0 && !m.crouch) ? 32 : 16; }
function applyMarioBox() {
  const nh = marioTargetH();
  if (nh === m.h) return;
  if (nh > m.h && boxHitsSolid(G.area, m.x, m.y + m.h - nh, m.w, nh - m.h)) { m.crouch = true; return; } // 头顶有东西，站不起来
  m.y += m.h - nh; m.h = nh;
}
function land() {
  m.onGround = true; m.vy = 0; m.jumping = false; m.jumpPose = false; m.stompChain = 0;
}
function updateMario() {
  const area = G.area;
  let dir = 0;
  if (held.left && !held.right) dir = -1; else if (held.right && !held.left) dir = 1;
  const running = !!held.run;

  // 蹲下（只有大马里奥能蹲，碰撞框变矮）
  if (m.onGround) {
    const want = m.power > 0 && !!held.down;
    if (want !== m.crouch) { m.crouch = want; applyMarioBox(); }
  }

  // ---- 水平速度 ----
  if (m.onGround) {
    m.skid = false;
    if (m.crouch || dir === 0) {
      const s = Math.max(0, Math.abs(m.vx) - CONFIG.RELEASE_DECEL);
      m.vx = Math.sign(m.vx) * s;
    } else if (m.vx !== 0 && Math.sign(m.vx) !== dir) {
      m.skid = true; m.skidDir = dir;                         // 反向急转：刹车滑步
      m.vx += dir * CONFIG.SKID_DECEL;
      if (m.vx === 0 || Math.sign(m.vx) === dir) { m.vx = 0; m.skid = false; m.facing = dir; }
    } else {
      m.facing = dir;
      const max = running ? CONFIG.RUN_MAX : CONFIG.WALK_MAX;
      const acc = running ? CONFIG.RUN_ACCEL : CONFIG.WALK_ACCEL;
      const s = Math.abs(m.vx);
      if (s < max) m.vx = dir * Math.min(s + acc, max);
      else if (s > max) m.vx = dir * Math.max(s - CONFIG.RELEASE_DECEL, max);
    }
    m.airMax = Math.abs(m.vx) > CONFIG.WALK_MAX + 0.01 ? CONFIG.RUN_MAX : CONFIG.WALK_MAX;
  } else if (dir !== 0) {
    // 空中只能微调，面朝方向不变
    if (m.vx !== 0 && Math.sign(m.vx) !== dir) m.vx += dir * CONFIG.AIR_DECEL;
    else { const s = Math.abs(m.vx); if (s < m.airMax) m.vx = dir * Math.min(s + CONFIG.AIR_ACCEL, m.airMax); }
  }

  // ---- 起跳 ----
  if (input.jumpPressed && m.onGround) {
    const s = Math.abs(m.vx);
    m.vy = -(s >= CONFIG.JUMP_FAST_SPEED ? CONFIG.JUMP_VEL_FAST : CONFIG.JUMP_VEL_SLOW);
    m.jumping = true; m.jumpPose = true; m.onGround = false; m.skid = false;
    Sound.play(m.power > 0 ? 'jumpBig' : 'jump');
  }
  if (!held.jump) m.jumping = false;

  // ---- 发火球 ----
  if (m.throwT > 0) m.throwT--;
  if (input.runPressed && m.power === 2 && !m.crouch) throwFireball();

  // ---- 横向移动 ----
  if (collideX(m, area, m.vx, true)) m.vx = 0;
  if (m.x < G.camX) { m.x = G.camX; if (m.vx < 0) m.vx = 0; }       // 不能走出屏幕左边缘
  const maxX = area.w * TILE - m.w;
  if (m.x > maxX) { m.x = maxX; m.vx = 0; }

  // ---- 纵向移动 ----
  const wasGround = m.onGround;
  m.onGround = false;
  const res = collideY(m, area, m.vy, true);
  if (res === 1) land();
  else if (res === -1) { headBump(m.hitRow); m.vy = 0; m.jumping = false; }
  else if (m.vy >= 0 && probeGround(m, area)) land();
  if (!m.onGround) {
    if (wasGround && !m.jumpPose) m.airMax = Math.abs(m.vx) > CONFIG.WALK_MAX + 0.01 ? CONFIG.RUN_MAX : CONFIG.WALK_MAX;
    const g = (m.vy < 0 && m.jumping) ? CONFIG.GRAVITY_HOLD : CONFIG.GRAVITY_RELEASE;
    m.vy = Math.min(m.vy + g, CONFIG.MAX_FALL);
  }

  // ---- 走路动画（按移动距离切帧：越快切得越快）----
  if (m.onGround && !m.skid && Math.abs(m.vx) > 0.05) {
    m.animT += Math.abs(m.vx);
    if (m.animT >= 7) { m.animT -= 7; m.anim = (m.anim + 1) % 3; }
  } else if (m.onGround && !m.skid) { m.anim = 0; m.animT = 0; }

  // ---- 掉进坑 ----
  if (m.y > SCREEN_H + 8) { killMario(true); return; }

  collectTileCoins();
  checkPipesAndFlag();
}
function headBump(row) {
  const area = G.area;
  const c0 = Math.floor(m.x / TILE), c1 = Math.floor((m.x + m.w - 0.001) / TILE);
  let target = Math.floor((m.x + m.w / 2) / TILE);           // 优先顶头顶正中那一块
  if (!isSolid(area, target, row, true)) target = (target === c0) ? c1 : c0;
  if (isSolid(area, target, row, true)) hitBlock(target, row);
}
function collectTileCoins() {
  const area = G.area;
  const c0 = Math.floor(m.x / TILE), c1 = Math.floor((m.x + m.w - 0.001) / TILE);
  const r0 = Math.floor(m.y / TILE), r1 = Math.floor((m.y + m.h - 0.001) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (getTile(area, c, r) === 'o') { setTile(area, c, r, '.'); addCoin(); }
  }
}
function checkPipesAndFlag() {
  const area = G.area;
  if (area.kind === 'over') {
    // x=57 的管道：站在管口正上方按"下"
    const px = PIPE_IN.x * TILE;
    if (held.down && m.onGround && Math.abs(m.y + m.h - PIPE_IN.top * TILE) < 0.5 && m.x >= px + 1 && m.x + m.w <= px + 31) {
      startPipe('down'); return;
    }
    // 抓旗杆
    if (m.x + m.w >= POLE_X && m.x < POLE_X + 4 && m.y + m.h <= POLE_BASE_Y + 2) { startFlag(); return; }
  } else {
    // 地下房间：贴着右边横向管道口按"右"
    if (held.right && m.onGround && Math.abs(m.y + m.h - 13 * TILE) < 0.5 && m.x + m.w >= SIDE_PIPE_X * TILE - 0.5) {
      startPipe('right');
    }
  }
}
function throwFireball() {
  const alive = fireballs.filter(f => !f.explode).length;
  if (alive >= CONFIG.MAX_FIREBALLS) return;
  const f = {
    x: m.facing > 0 ? m.x + m.w - 2 : m.x - 6, y: m.y + 10, w: 8, h: 8,
    vx: m.facing * CONFIG.FIREBALL_SPEED, vy: CONFIG.FIREBALL_START_VY, t: 0, explode: 0, dead: false, hitRow: -1,
  };
  if (boxHitsSolid(G.area, f.x, f.y, f.w, f.h)) f.explode = 1;
  fireballs.push(f);
  m.throwT = 10;
  Sound.play('fireball');
}
function hurtMario() {
  if (m.star > 0 || m.invuln > 0 || G.phase !== 'run') return;
  if (m.power === 0) { killMario(false); return; }
  Sound.play('pipe');
  m.invuln = CONFIG.INVINCIBLE_FRAMES + CONFIG.TRANSFORM_FRAMES;
  startTransform(m.power === 2 ? 'unfire' : 'shrink');   // 受伤降一级
}
function startTransform(kind) { G.phase = 'freeze'; G.trans = { kind, t: 0 }; }
function updateTransform() {
  const tr = G.trans;
  tr.t++;
  updatePopups();
  if (tr.t < CONFIG.TRANSFORM_FRAMES) return;
  if (tr.kind === 'grow') { m.power = 1; m.crouch = false; m.y -= 32 - m.h; m.h = 32; }
  else if (tr.kind === 'shrink') { m.power = 0; m.crouch = false; m.y += m.h - 16; m.h = 16; }
  else if (tr.kind === 'fire') { m.power = 2; }
  else if (tr.kind === 'unfire') { m.power = 1; }
  G.trans = null; G.phase = 'run';
}
function killMario(pit) {
  G.phase = 'dead';
  G.death = { t: 0, pit };
  Sound.stopMusic(); Sound.playMusic('death');
  m.vx = 0; m.vy = 0; m.star = 0; m.invuln = 0; m.crouch = false;
  if (pit) { m.h = 16; m.y = SCREEN_H; }
  else { m.y += m.h - 16; m.h = 16; }
}
function updateDeath() {
  const d = G.death;
  d.t++;
  updatePopups();
  if (d.t === CONFIG.DEATH_PAUSE) m.vy = -CONFIG.DEATH_JUMP;          // 跳一下
  if (d.t > CONFIG.DEATH_PAUSE && m.y < SCREEN_H + 40) { m.y += m.vy; m.vy = Math.min(m.vy + CONFIG.DEATH_GRAVITY, CONFIG.MAX_FALL); }
  if (d.t >= CONFIG.DEATH_TOTAL) loseLife();
}
function loseLife() {
  G.lives--;
  G.top = Math.max(G.top, G.score);
  if (G.lives <= 0) { G.state = 'gameover'; G.stateT = 0; Sound.playMusic('gameover'); }
  else { resetLevel(); G.state = 'intro'; G.stateT = 0; Sound.stopMusic(); }
}

/* ---- 钻管道 ---- */
function startPipe(kind) {
  G.phase = 'pipe'; G.pipe = { kind, t: 0 };
  Sound.play('pipe'); Sound.stopMusic();
  m.vx = 0; m.vy = 0; m.skid = false;
  if (m.crouch) { m.crouch = false; m.y -= 32 - m.h; m.h = 32; }
  if (kind === 'down') { m.x = PIPE_IN.x * TILE + TILE - m.w / 2; m.facing = 1; }
  if (kind === 'right') m.facing = 1;
}
function updatePipe() {
  const p = G.pipe;
  p.t++;
  if (p.kind === 'down') {
    m.y += 1;
    if (p.t >= m.h + 4) enterUnderground();
  } else if (p.kind === 'right') {
    m.x += 1;
    if (p.t % 6 === 0) m.anim = (m.anim + 1) % 3;
    if (p.t >= 26) exitToOverworld();
  } else if (p.kind === 'up') {
    m.y -= 1;
    if (m.y + m.h <= PIPE_OUT.top * TILE) { m.y = PIPE_OUT.top * TILE - m.h; G.phase = 'run'; G.pipe = null; land(); }
  }
}
function enterUnderground() {
  G.saved = { enemies, items };
  enemies = []; items = []; fireballs = []; coinPops = []; debris = []; bumps = [];
  G.area = G.areas.under; G.camX = 0;
  m.x = 2 * TILE + 2; m.y = 0; m.vx = 0; m.vy = 0; m.onGround = false; m.facing = 1; m.jumpPose = false;
  G.phase = 'run'; G.pipe = null; G.blackout = 12;
  playAreaMusic();
}
function exitToOverworld() {
  G.area = G.areas.over;
  enemies = G.saved ? G.saved.enemies : []; items = G.saved ? G.saved.items : []; G.saved = null;
  fireballs = []; coinPops = []; debris = []; bumps = [];
  m.x = (PIPE_OUT.x + 1) * TILE - m.w / 2; m.y = PIPE_OUT.top * TILE; m.vx = 0; m.vy = 0; m.facing = 1;
  G.camX = Math.max(0, Math.min(camMax(), PIPE_OUT.x * TILE - 64));
  enemies = enemies.filter(e => e.x + e.w >= G.camX - 16);       // 镜头左边的敌人直接清掉
  items = items.filter(it => it.x + 16 >= G.camX);
  G.phase = 'pipe'; G.pipe = { kind: 'up', t: 0 }; G.blackout = 12;
  Sound.play('pipe');
  playAreaMusic();
}

/* ---- 抓旗杆与通关 ---- */
function startFlag() {
  G.phase = 'flag';
  const feet = m.y + m.h;   // 抓得越高分越高
  const pts = feet >= 186 ? 100 : feet >= 162 ? 400 : feet >= 120 ? 800 : feet >= 94 ? 2000 : 5000;
  addScore(pts);
  G.flagScore = { text: String(pts), y: POLE_BASE_Y - 8 };
  Sound.stopMusic(); Sound.play('flagpole');
  if (m.crouch) { m.crouch = false; applyMarioBox(); }
  m.vx = 0; m.vy = 0; m.star = 0; m.skid = false; m.facing = 1; m.climbT = 0;
  m.x = POLE_X + 1 - m.w;
  G.flag = { phase: 'slide', t: 0 };
}
function updateFlag() {
  const f = G.flag, area = G.area;
  f.t++;
  if (G.flagScore && G.flagScore.y > FLAG_TOP_Y + 4) G.flagScore.y -= CONFIG.FLAG_SLIDE_SPEED;
  if (f.phase === 'slide') {
    let moving = false;
    if (m.y + m.h < POLE_BASE_Y) { m.y = Math.min(m.y + CONFIG.FLAG_SLIDE_SPEED, POLE_BASE_Y - m.h); m.climbT++; moving = true; }
    if (G.flagY < FLAG_BOTTOM_Y) { G.flagY = Math.min(G.flagY + CONFIG.FLAG_SLIDE_SPEED, FLAG_BOTTOM_Y); moving = true; }
    if (!moving) { f.phase = 'turn'; f.t = 0; m.facing = -1; m.x = POLE_X + 1; }   // 换到旗杆右侧
  } else if (f.phase === 'turn') {
    if (f.t >= 24) { f.phase = 'walk'; f.t = 0; m.facing = 1; m.x += 2; m.onGround = false; Sound.playMusic('clear'); }
  } else if (f.phase === 'walk') {
    m.vx = CONFIG.AUTO_WALK_SPEED;                         // 自己走进城堡
    collideX(m, area, m.vx, false);
    const res = collideY(m, area, m.vy, false);
    m.onGround = res === 1 || (m.vy >= 0 && probeGround(m, area));
    if (m.onGround) { m.vy = 0; m.jumpPose = false; } else m.vy = Math.min(m.vy + CONFIG.GRAVITY_RELEASE, CONFIG.MAX_FALL);
    m.animT += m.vx;
    if (m.animT >= 7) { m.animT -= 7; m.anim = (m.anim + 1) % 3; }
    updateCamera();
    if (m.x + m.w / 2 >= CASTLE_DOOR_X) { m.hidden = true; f.phase = 'tally'; f.t = 0; }
  } else if (f.phase === 'tally') {
    if (G.time > 0) {                                    // 剩余时间每 1 点换 50 分
      G.time--; addScore(50);
      if (f.t % 3 === 0) Sound.play('tick');
      f.t2 = 0;
    } else if ((f.t2 = (f.t2 || 0) + 1) > 30) { f.phase = 'castle'; f.t = 0; G.castleFlagUp = true; }
  } else if (f.phase === 'castle') {
    G.castleFlagY = Math.max(CASTLE_FLAG_END, G.castleFlagY - 0.5);   // 城堡上升起小旗
    if (G.castleFlagY <= CASTLE_FLAG_END && f.t > 40) { f.phase = 'done'; f.t = 0; }
  } else if (f.phase === 'done') {
    if (f.t >= 150) { G.state = 'clear'; G.stateT = 0; G.top = Math.max(G.top, G.score); }
  }
}

/* =========================================================================
 * 11. 方块被顶
 * ========================================================================= */
function hitBlock(tx, ty) {
  const area = G.area, c = getTile(area, tx, ty);
  const big = m.power > 0;
  let anim = true;
  switch (c) {
    case '?': setTile(area, tx, ty, 'U'); spawnCoinPop(tx, ty); break;
    case 'M': setTile(area, tx, ty, 'U'); spawnItem(big ? 'flower' : 'mushroom', tx, ty); break;
    case 'H': setTile(area, tx, ty, 'U'); spawnItem('1up', tx, ty); break;
    case '*': setTile(area, tx, ty, 'U'); spawnItem('star', tx, ty); break;
    case '$': {
      const key = tx + ',' + ty;
      let st = area.multi[key];
      if (!st) st = area.multi[key] = { until: G.playFrames + CONFIG.MULTI_COIN_FRAMES, n: 0 };
      st.n++;
      spawnCoinPop(tx, ty);
      if (G.playFrames >= st.until || st.n >= CONFIG.MULTI_COIN_MAX) setTile(area, tx, ty, 'U');
      break;
    }
    case 'B':
      if (big) { breakBrick(tx, ty); anim = false; }       // 大马里奥：砖块碎成 4 块
      else Sound.play('bump');                              // 小马里奥：只弹一下
      break;
    default:
      Sound.play('bump'); anim = false;
  }
  if (anim) bumps.push({ tx, ty, t: 0 });
  bumpAbove(tx, ty);
}
function bumpAbove(tx, ty) {
  const top = ty * TILE, left = tx * TILE;
  for (const e of enemies) {
    if (!e.active || !alive(e)) continue;
    if (e.x + e.w > left && e.x < left + TILE && Math.abs(e.y + e.h - top) <= 4) {
      flipKill(e, e.x + e.w / 2 < left + 8 ? -1 : 1);       // 站在上面的敌人被顶翻
      addScore(100, e.x, e.y);
    }
  }
  for (const it of items) {
    if (it.rise > 0 || it.kind === 'flower') continue;
    if (it.x + it.w > left && it.x < left + TILE && Math.abs(it.y + it.h - top) <= 4) {
      it.vy = -CONFIG.ITEM_BUMP; it.onGround = false; it.dir = it.x + 8 < left + 8 ? -1 : 1;
    }
  }
  if (getTile(G.area, tx, ty - 1) === 'o') { setTile(G.area, tx, ty - 1, '.'); spawnCoinPop(tx, ty - 1); }
}
function spawnCoinPop(tx, ty) {
  addCoin();
  coinPops.push({ x: tx * TILE, y: (ty - 1) * TILE, y0: (ty - 1) * TILE, vy: -CONFIG.COIN_POP_VY, t: 0 });
}
function breakBrick(tx, ty) {
  setTile(G.area, tx, ty, '.');
  const x = tx * TILE, y = ty * TILE;
  const vx = CONFIG.DEBRIS_VX, top = -CONFIG.DEBRIS_VY_TOP, bot = -CONFIG.DEBRIS_VY_BOTTOM;
  debris.push({ x, y, vx: -vx, vy: top, t: 0 }, { x: x + 8, y, vx, vy: top, t: 0 },
    { x, y: y + 8, vx: -vx, vy: bot, t: 0 }, { x: x + 8, y: y + 8, vx, vy: bot, t: 0 });
  addScore(50);
  Sound.play('brick');
}
function spawnItem(kind, tx, ty) {
  items.push({ kind, x: tx * TILE, y: ty * TILE, w: 16, h: 16, vx: 0, vy: 0, dir: 1, rise: 16, onGround: false, dead: false, hitRow: -1, t: 0 });
  Sound.play('sprout');
}

/* =========================================================================
 * 12. 道具、敌人、火球、特效
 * ========================================================================= */
function updateItems() {
  const area = G.area;
  for (const it of items) {
    it.t++;
    if (it.rise > 0) {                       // 从方块里慢慢冒出来
      it.y -= CONFIG.ITEM_RISE; it.rise -= CONFIG.ITEM_RISE;
      if (it.rise <= 0) it.rise = 0;
      continue;
    }
    if (it.kind === 'flower') continue;      // 火焰花不动
    const speed = it.kind === 'star' ? CONFIG.STAR_SPEED : CONFIG.MUSHROOM_SPEED;
    if (collideX(it, area, it.dir * speed, false)) it.dir = -it.dir;
    if (it.kind === 'star') {
      stepVertical(it, area, CONFIG.STAR_GRAVITY, CONFIG.MAX_FALL, false);
      if (it.onGround) { it.vy = -CONFIG.STAR_BOUNCE; it.onGround = false; }   // 星星一路弹跳
    } else {
      stepVertical(it, area, CONFIG.ITEM_GRAVITY, CONFIG.MAX_FALL, false);
    }
    if (it.y > SCREEN_H || it.x + 16 < G.camX - 16 || it.x > G.camX + SCREEN_W + 64) it.dead = true;
  }
  items = items.filter(it => !it.dead);
}
function marioVsItems() {
  for (const it of items) {
    if (it.dead || it.rise > 6) continue;
    if (!overlap(m.x, m.y, m.w, m.h, it.x + 1, it.y + 1, 14, 15)) continue;
    it.dead = true;
    if (it.kind === 'mushroom') { addScore(1000, it.x, it.y); if (m.power === 0) { Sound.play('powerup'); startTransform('grow'); } else Sound.play('powerup'); }
    else if (it.kind === 'flower') {
      addScore(1000, it.x, it.y); Sound.play('powerup');
      if (m.power === 0) startTransform('grow');            // 小马里奥吃花：先变大
      else if (m.power === 1) startTransform('fire');       // 大马里奥吃花：变火焰
    }
    else if (it.kind === 'star') { addScore(1000, it.x, it.y); m.star = CONFIG.STAR_FRAMES; m.starChain = 0; Sound.play('powerup'); Sound.playMusic('star'); }
    else if (it.kind === '1up') { oneUp(it.x, it.y); }
  }
  items = items.filter(it => !it.dead);
}
function flipKill(e, dir) {
  e.state = 'dead'; e.vy = -CONFIG.DEAD_ENEMY_HOP; e.vx = (dir || 1) * CONFIG.DEAD_ENEMY_VX; e.t = 0;
  Sound.play('kick');
}
function updateEnemies() {
  const area = G.area;
  for (const e of enemies) {
    if (e.remove) continue;
    if (!e.active) {
      if (e.x < G.camX + SCREEN_W) e.active = true;   // 进入屏幕后才开始移动
      else continue;
    }
    e.t++;
    if (e.kickGrace > 0) e.kickGrace--;
    if (e.kickCool > 0) e.kickCool--;
    if (e.state === 'dead') {
      e.x += e.vx; e.y += e.vy; e.vy = Math.min(e.vy + CONFIG.DEAD_ENEMY_GRAVITY, CONFIG.MAX_FALL);
      if (e.y > SCREEN_H + 16) e.remove = true;
      continue;
    }
    if (e.state === 'flat') { if (e.t > CONFIG.FLAT_FRAMES) e.remove = true; continue; }
    let speed = 0;
    if (e.state === 'walk') speed = e.type === 'koopa' ? CONFIG.KOOPA_SPEED : CONFIG.GOOMBA_SPEED;
    else if (e.state === 'slide') speed = CONFIG.SHELL_SPEED;
    else if (e.state === 'shell') {
      e.shellT++;
      if (e.shellT >= CONFIG.SHELL_REVIVE) { e.state = 'walk'; e.dir = (m.x + m.w / 2 < e.x + e.w / 2) ? -1 : 1; e.t = 0; }
    }
    if (speed > 0 && collideX(e, area, e.dir * speed, false)) {   // 碰到墙 / 管道就掉头
      e.dir = -e.dir;
      if (e.state === 'slide' && e.x < G.camX + SCREEN_W && e.x + e.w > G.camX) Sound.play('bump');
    }
    stepVertical(e, area, CONFIG.ENEMY_GRAVITY, CONFIG.MAX_FALL, false);   // 走到边缘会直接掉下去
    if (e.y > SCREEN_H) e.remove = true;
    if (e.x + e.w < G.camX - 48) e.remove = true;
    if (e.state === 'slide' && e.x > G.camX + SCREEN_W + 32) e.remove = true;
  }
  // 敌人互相碰撞：普通敌人互相掉头；滑行的龟壳撞死路上的敌人
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (a.remove || !a.active || !alive(a)) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (b.remove || !b.active || !alive(b) || !alive(a)) continue;
      if (!overlap(a.x, a.y, a.w, a.h, b.x, b.y, b.w, b.h)) continue;
      const aS = a.state === 'slide', bS = b.state === 'slide';
      if (aS && bS) { flipKill(a, -a.dir); flipKill(b, -b.dir); addScore(500, a.x, a.y); }
      else if (aS) shellKill(a, b);
      else if (bS) shellKill(b, a);
      else {
        if (a.state === 'walk' && (b.x - a.x) * a.dir > 0) a.dir = -a.dir;
        if (b.state === 'walk' && (a.x - b.x) * b.dir > 0) b.dir = -b.dir;
      }
    }
  }
  enemies = enemies.filter(e => !e.remove && !(e.x + e.w < G.camX - 48));
}
function shellKill(shell, victim) {
  flipKill(victim, shell.dir);
  chainScore(SHELL_TABLE, shell.chain, victim.x, victim.y);
  shell.chain++;
}
function kickShell(e) {
  e.state = 'slide'; e.shellT = 0; e.chain = 0;
  e.dir = (m.x + m.w / 2 < e.x + e.w / 2) ? 1 : -1;
  e.kickGrace = CONFIG.SHELL_KICK_GRACE;
  addScore(400, e.x, e.y);
  Sound.play('kick');
}
function marioVsEnemies() {
  const mx = m.x + 1, my = m.y + 2, mw = m.w - 2, mh = m.h - 2;
  for (const e of enemies) {
    if (G.phase !== 'run') return;
    if (e.remove || !e.active || !alive(e)) continue;
    if (!overlap(mx, my, mw, mh, e.x + 1, e.y + 3, e.w - 2, e.h - 3)) continue;
    if (m.star > 0) {                                   // 无敌星：碰到直接消灭
      flipKill(e, m.facing);
      chainScore(STOMP_TABLE, m.starChain++, e.x, e.y);
      continue;
    }
    const falling = m.vy > 0 || m.y > m.prevY;
    const feet = m.y + m.h, feetPrev = m.prevY + m.h;
    const stomp = falling && (feetPrev <= e.y + 8 || feet <= e.y + 8);
    if (e.state === 'shell') {
      if (e.kickCool > 0) continue;
      kickShell(e);                                     // 静止的龟壳：碰一下就踢出去
      if (stomp) { m.vy = -CONFIG.STOMP_BOUNCE; m.jumping = !!held.jump; m.jumpPose = true; }
      continue;
    }
    if (stomp) {
      if (e.type === 'goomba') { e.state = 'flat'; e.t = 0; }
      else { e.state = 'shell'; e.shellT = 0; e.kickCool = CONFIG.SHELL_KICK_COOLDOWN; }
      chainScore(STOMP_TABLE, m.stompChain++, e.x, e.y);   // 连续踩：100、200、400 ...
      m.vy = -CONFIG.STOMP_BOUNCE; m.jumping = !!held.jump; m.jumpPose = true; m.onGround = false;
      Sound.play('stomp');
    } else {
      if (e.state === 'slide' && e.kickGrace > 0) continue;
      hurtMario();                                      // 侧面或下面碰到：受伤
    }
  }
}
function updateFireballs() {
  const area = G.area;
  for (const f of fireballs) {
    f.t++;
    if (f.explode) { f.explode++; if (f.explode > 9) f.dead = true; continue; }
    if (collideX(f, area, f.vx, false)) { f.explode = 1; Sound.play('bump'); continue; }
    const res = collideY(f, area, f.vy, false);
    if (res === 1) f.vy = -CONFIG.FIREBALL_BOUNCE;                  // 落地弹跳
    else if (res === -1) { f.explode = 1; continue; }
    else f.vy = Math.min(f.vy + CONFIG.FIREBALL_GRAVITY, CONFIG.FIREBALL_MAX_FALL);
    if (f.x < G.camX - 16 || f.x > G.camX + SCREEN_W + 8 || f.y > SCREEN_H) { f.dead = true; continue; }
    for (const e of enemies) {
      if (e.remove || !e.active || !alive(e)) continue;
      if (overlap(f.x, f.y, f.w, f.h, e.x, e.y, e.w, e.h)) {
        flipKill(e, Math.sign(f.vx));
        addScore(e.type === 'goomba' ? 100 : 200, e.x, e.y);
        f.explode = 1;
        break;
      }
    }
  }
  fireballs = fireballs.filter(f => !f.dead);
}
function updatePopups() {
  for (const p of popups) { p.t++; if (p.t < 30) p.y -= 1; }
  popups = popups.filter(p => p.t < 48);
}
function updateEffects() {
  for (const d of debris) { d.x += d.vx; d.y += d.vy; d.vy += CONFIG.DEBRIS_GRAVITY; d.t++; }
  debris = debris.filter(d => d.y < SCREEN_H + 16);
  for (const p of coinPops) {
    p.y += p.vy; p.vy += CONFIG.COIN_POP_GRAVITY; p.t++;
    if (p.vy > 0 && p.y >= p.y0 - 8) { p.done = true; popups.push({ x: p.x + 2, y: p.y, text: '200', t: 0 }); }
  }
  coinPops = coinPops.filter(p => !p.done);
  for (const b of bumps) b.t++;
  bumps = bumps.filter(b => b.t < 12);
  updatePopups();
}
function updateCamera() {
  if (G.area.kind !== 'over') { G.camX = 0; return; }
  const target = m.x - CONFIG.SCROLL_X;       // 镜头只往右走
  if (target > G.camX) G.camX = Math.min(target, camMax());
}

/* =========================================================================
 * 13. 主更新（固定 60 帧/秒）
 * ========================================================================= */
function startGame() {
  G.score = 0; G.coins = 0; G.lives = CONFIG.START_LIVES;
  resetLevel();
  G.state = 'intro'; G.stateT = 0;
}
function beginPlay() { G.state = 'play'; G.phase = 'run'; G.stateT = 0; playAreaMusic(); }
function toTitle() { G.top = Math.max(G.top, G.score); resetLevel(); G.state = 'title'; G.stateT = 0; Sound.stopMusic(); }

function update() {
  G.frame++;
  const startPressed = consume('start');
  input.jumpPressed = consume('jump');
  input.runPressed = consume('run');
  if (consume('mute')) Sound.toggleMute();
  if (G.blackout > 0) G.blackout--;
  switch (G.state) {
    case 'title':
      if (startPressed || input.jumpPressed) startGame();
      break;
    case 'intro':
      if (++G.stateT >= 150) beginPlay();
      break;
    case 'play':
      if (startPressed && (G.phase === 'run' || G.phase === 'freeze')) {
        G.paused = !G.paused;
        Sound.play('pause');
        if (G.paused) Sound.stopMusic(); else playAreaMusic();
      }
      if (!G.paused) updatePlay();
      break;
    case 'gameover':
      if (++G.stateT >= 330 || (G.stateT > 60 && startPressed)) toTitle();
      break;
    case 'clear':
      if (++G.stateT > 40 && (startPressed || input.jumpPressed)) toTitle();
      break;
  }
}
function updatePlay() {
  switch (G.phase) {
    case 'run': updateRun(); break;
    case 'freeze': updateTransform(); break;
    case 'pipe': updatePipe(); updateEffects(); break;
    case 'dead': updateDeath(); break;
    case 'flag': updateFlag(); updateEnemies(); updateEffects(); break;
  }
}
function updateRun() {
  G.playFrames++;
  // 时间：约 0.4 秒减 1，归零马里奥死亡
  if (++G.timeTick >= CONFIG.TIME_TICK_FRAMES) {
    G.timeTick = 0;
    if (G.time > 0) G.time--;
    if (G.time === 100 && !G.hurry) { G.hurry = true; Sound.stopMusic(); Sound.play('hurry'); G.hurryRestart = 70; }
    if (G.time === 0) { killMario(false); return; }
  }
  if (G.hurryRestart > 0 && --G.hurryRestart === 0) playAreaMusic();
  m.prevY = m.y;
  updateMario();
  if (G.phase !== 'run') return;
  updateItems();
  updateEnemies();
  updateFireballs();
  marioVsItems();
  if (G.phase === 'run') marioVsEnemies();
  updateEffects();
  if (m.invuln > 0) m.invuln--;
  if (m.star > 0) { m.star--; if (m.star === 0 && G.phase === 'run') playAreaMusic(); }
  updateCamera();
}

/* =========================================================================
 * 14. 渲染
 * ========================================================================= */
function qPhase() { return [0, 0, 0, 1, 2, 1][Math.floor(G.frame / 8) % 6]; }
function castleTileName(area, tx, ty) {
  const k = area.castle;
  if (getTile(area, tx, ty - 1) !== 'C') return 'castleTop';
  if (tx === k.cx && ty === k.bottom) return 'castleDoor';
  if (tx === k.cx && ty === k.bottom - 1) return 'castleArch';
  if (ty === k.minY + 1 && Math.abs(tx - k.cx) === 1) return 'castleWindow';
  return 'castleBrick';
}
function tileSprite(area, ch, tx, ty) {
  const tp = area.kind === 'over' ? 'overTile' : 'underTile';
  switch (ch) {
    case '#': return sprite('ground', tp);
    case 'B': case '$': case '*': return sprite('brick', tp);
    case '?': case 'M': return sprite('question', 'q' + qPhase());
    case 'U': return sprite('used', 'overTile');
    case 'S': return sprite('stair', tp);
    case '[': return sprite('pipeTL', 'pipe');
    case ']': return sprite('pipeTR', 'pipe');
    case '{': return sprite('pipeBL', 'pipe');
    case '}': return sprite('pipeBR', 'pipe');
    case 'a': return sprite('sideLipTop', 'pipe');
    case 'b': return sprite('sideLipBot', 'pipe');
    case 'c': return sprite('sideBodyTop', 'pipe');
    case 'd': return sprite('sideBodyBot', 'pipe');
    case 'F': return sprite('pole', 'pole');
    case 'T': return sprite('poleTop', 'pole');
    case 'o': return sprite('coin', 'coin' + qPhase());
    case 'C': return sprite(castleTileName(area, tx, ty), 'overTile');
  }
  return null;
}
function bumpOffset(t) { return -Math.round(Math.sin(Math.min(t, 11) / 11 * Math.PI) * 6); }
function drawTiles(area, cx) {
  const c0 = Math.max(0, Math.floor(cx / TILE)), c1 = Math.min(area.w - 1, c0 + 16);
  let bumpMap = null;
  if (bumps.length) { bumpMap = {}; for (const b of bumps) bumpMap[b.tx + ',' + b.ty] = b; }
  for (let ty = 0; ty < area.h; ty++) {
    for (let tx = c0; tx <= c1; tx++) {
      const ch = area.tiles[ty][tx];
      if (ch === '.' || ch === 'H') continue;          // 隐藏方块平时看不见
      const spr = tileSprite(area, ch, tx, ty);
      if (!spr) continue;
      let oy = 0;
      if (bumpMap) { const b = bumpMap[tx + ',' + ty]; if (b) oy = bumpOffset(b.t); }
      ctx.drawImage(spr, tx * TILE - cx, ty * TILE + oy);
    }
  }
}
function drawItem(it, cx) {
  let spr;
  if (it.kind === 'mushroom') spr = sprite('mushroom', 'mushroom');
  else if (it.kind === '1up') spr = sprite('mushroom', 'oneup');
  else if (it.kind === 'flower') spr = sprite('flower', FLOWER_PALS[Math.floor(G.frame / 4) % 4]);
  else spr = sprite('star', 'star' + (Math.floor(G.frame / 4) % 4));
  ctx.drawImage(spr, Math.floor(it.x) - cx, Math.floor(it.y));
}
function drawEnemy(e, cx) {
  const x = Math.floor(e.x) - 1 - cx;
  if (x < -32 || x > SCREEN_W + 16) return;
  const feet = Math.floor(e.y + e.h);
  let spr;
  if (e.type === 'goomba') {
    if (e.state === 'flat') spr = sprite('goombaFlat', 'goomba');
    else if (e.state === 'dead') spr = sprite('goomba', 'goomba', false, true);
    else spr = sprite('goomba', 'goomba', Math.floor(e.t / 10) % 2 === 1);
  } else {
    if (e.state === 'walk') spr = sprite(Math.floor(e.t / 10) % 2 ? 'koopa2' : 'koopa1', 'koopa', e.dir > 0);
    else if (e.state === 'dead') spr = sprite('shell', 'koopa', false, true);
    else if (e.state === 'shell' && e.shellT > CONFIG.SHELL_REVIVE - 60 && Math.floor(e.shellT / 6) % 2) spr = sprite('shellLegs', 'koopa');
    else spr = sprite('shell', 'koopa');
  }
  ctx.drawImage(spr, x, feet - spr.height);
}
function marioLook() {
  // 返回 [像素图名, 调色板]
  let big = m.power > 0;
  let pal = m.power === 2 ? 'fire' : 'mario';
  if (G.phase === 'freeze' && G.trans) {
    const t = G.trans.t, flick = Math.floor(t / 6) % 2 === 1;
    if (G.trans.kind === 'grow') big = flick || t > CONFIG.TRANSFORM_FRAMES - 12;
    else if (G.trans.kind === 'shrink') big = !flick && t < CONFIG.TRANSFORM_FRAMES - 12;
    else if (G.trans.kind === 'fire') pal = Math.floor(t / 4) % 2 ? 'fire' : 'mario';
    else if (G.trans.kind === 'unfire') pal = Math.floor(t / 4) % 2 ? 'mario' : 'fire';
  }
  if (m.star > 0) pal = STAR_PALS[Math.floor(G.frame / (m.star < 120 ? 8 : 2)) % 4];
  const pre = big ? 'big' : 'small';
  let name;
  if (G.phase === 'dead') return ['smallDeath', 'mario'];
  if (G.phase === 'flag' && G.flag && (G.flag.phase === 'slide' || G.flag.phase === 'turn')) {
    name = pre + 'Climb' + (1 + (Math.floor(m.climbT / 4) % 2));
  } else if (big && m.crouch) name = 'bigCrouch';
  else if (G.phase === 'pipe' && G.pipe && G.pipe.kind === 'right') name = pre + 'Walk' + (m.anim + 1);
  else if (G.phase === 'pipe') name = pre + 'Stand';
  else if (m.throwT > 0 && big) name = m.onGround ? 'bigWalk1' : 'bigJump';
  else if (!m.onGround && m.jumpPose) name = pre + 'Jump';
  else if (!m.onGround) name = pre + 'Walk' + (m.anim + 1);
  else if (m.skid) name = pre + 'Skid';
  else if (Math.abs(m.vx) > 0.05 || (G.phase === 'flag' && G.flag && G.flag.phase === 'walk')) name = pre + 'Walk' + (m.anim + 1);
  else name = pre + 'Stand';
  return [name, pal];
}
function drawMario(cx) {
  if (!m || m.hidden) return;
  if (G.phase === 'run' && m.invuln > 0 && (G.frame & 2)) return;    // 受伤后闪烁无敌
  if (G.phase === 'freeze' && G.trans && G.trans.kind === 'shrink' && (G.frame & 2)) return;
  const look = marioLook();
  const flip = (m.skid && G.phase === 'run') ? m.skidDir < 0 : m.facing < 0;
  const spr = sprite(look[0], look[1], flip);
  ctx.drawImage(spr, Math.floor(m.x) - 2 - cx, Math.floor(m.y + m.h) - spr.height);
}
function drawWorld() {
  const area = G.area, cx = Math.floor(G.camX);
  ctx.fillStyle = area.kind === 'over' ? '#5C94FC' : '#000000';
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  if (area.kind === 'over') {
    for (const d of DECOR) if (d.x + d.img.width > cx && d.x < cx + SCREEN_W) ctx.drawImage(d.img, d.x - cx, d.y);
    if (G.castleFlagUp) ctx.drawImage(sprite('castleFlag', 'castleFlag'), CASTLE_DOOR_X - 8 - cx, Math.floor(G.castleFlagY));
  }
  // 方块后面一层：冒出中的道具、钻管道的马里奥
  for (const it of items) if (it.rise > 0) drawItem(it, cx);
  if (G.state === 'play' && G.phase === 'pipe') drawMario(cx);
  drawTiles(area, cx);
  if (area.kind === 'over') ctx.drawImage(sprite('flag', 'flag'), POLE_X - 16 - cx, Math.floor(G.flagY));
  for (const it of items) if (it.rise <= 0) drawItem(it, cx);
  for (const e of enemies) if (e.active || e.x < cx + SCREEN_W + 16) drawEnemy(e, cx);
  for (const f of fireballs) {
    if (f.explode) ctx.drawImage(sprite('burst' + Math.min(2, Math.floor((f.explode - 1) / 3)), 'fireball'), Math.floor(f.x) - 4 - cx, Math.floor(f.y) - 4);
    else { const r = Math.floor(f.t / 3) % 4; ctx.drawImage(sprite('fireball', 'fireball', r === 1 || r === 2, r >= 2), Math.floor(f.x) - cx, Math.floor(f.y)); }
  }
  for (const d of debris) ctx.drawImage(sprite('debris', area.kind === 'over' ? 'overTile' : 'underTile', Math.floor(d.t / 4) % 2 === 1), Math.floor(d.x) - cx, Math.floor(d.y));
  for (const p of coinPops) {
    const fr = Math.floor(p.t / 3) % 4;
    const name = fr === 0 ? 'coin' : fr === 2 ? 'coinSpin2' : 'coinSpin1';
    ctx.drawImage(sprite(name, 'coin0', fr === 3), Math.floor(p.x) - cx, Math.floor(p.y));
  }
  if (!(G.state === 'play' && G.phase === 'pipe')) drawMario(cx);
  for (const p of popups) drawTiny(p.text, Math.floor(p.x) - cx, Math.floor(p.y));
  if (G.phase === 'flag' && G.flagScore && G.state === 'play') drawTiny(G.flagScore.text, POLE_X + 4 - cx, Math.floor(G.flagScore.y));
}
function pad(n, len) { return String(n).padStart(len, '0'); }
function drawHUD(showTime) {
  drawText('MARIO', 24, 16);
  drawText(pad(G.score, 6), 24, 24);
  ctx.drawImage(sprite('hudCoin', 'coin' + qPhase()), 88, 24);
  drawText('x' + pad(G.coins, 2), 96, 24);
  drawText('WORLD', 144, 16);
  drawText('1-1', 152, 24);
  drawText('TIME', 200, 16);
  if (showTime) drawText(pad(G.time, 3), 208, 24);
  if (Sound.isMuted()) drawText('MUTE', 216, 4, '#FCBCB0');
}
function drawTitle() {
  const x = 24, y = 36, w = 208, h = 88;
  ctx.fillStyle = '#000000'; ctx.fillRect(x + 3, y + 3, w, h);
  ctx.fillStyle = '#C84C0C'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#FCBCB0'; ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y, 2, h);
  ctx.fillStyle = '#881400'; ctx.fillRect(x, y + h - 2, w, 2); ctx.fillRect(x + w - 2, y, 2, h);
  for (const [dx, dy] of [[6, 6], [w - 10, 6], [6, h - 10], [w - 10, h - 10]]) { ctx.fillStyle = '#000000'; ctx.fillRect(x + dx, y + dy, 4, 4); }
  drawTextShadow('SUPER', x + 64, y + 12, '#FCBCB0', 2);
  drawTextShadow('MARIO BROS.', x + 16, y + 36, '#FCBCB0', 2);
  drawText('WORLD 1-1 REMAKE', x + 64, y + 68, '#FCFCFC');
  ctx.drawImage(sprite('mushroom', 'mushroom'), 64, 140);
  drawText('1 PLAYER GAME', 88, 144);
  drawText('TOP- ' + pad(G.top, 6), 96, 164);
  if (Math.floor(G.frame / 30) % 2 === 0) drawText('PRESS ENTER', 84, 184, '#FCBCB0');
}
function render() {
  if (G.state === 'intro' || G.state === 'gameover' || G.blackout > 0) {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    drawHUD(G.state === 'play');
    if (G.state === 'intro') {
      drawText('WORLD 1-1', 88, 80);
      ctx.drawImage(sprite('smallStand', 'mario'), 98, 106);
      drawText('x', 124, 112);
      drawText(String(G.lives).padStart(2, ' '), 144, 112);
    } else if (G.state === 'gameover') {
      drawText('GAME OVER', 92, 120);
    }
    return;
  }
  drawWorld();
  drawHUD(G.state === 'play' || G.state === 'clear');
  if (G.state === 'title') drawTitle();
  if (G.state === 'clear') {
    drawTextShadow('COURSE CLEAR!', 76, 72, '#FCFCFC', 1);
    drawTextShadow('SCORE ' + pad(G.score, 6), 80, 88, '#FCFCFC', 1);
    if (Math.floor(G.frame / 30) % 2 === 0) drawTextShadow('PRESS ENTER', 84, 104, '#FCBCB0', 1);
  }
  if (G.paused) drawTextShadow('PAUSE', 108, 112, '#FCFCFC', 1);
}

/* =========================================================================
 * 15. 主循环：逻辑固定 60 帧/秒（固定时间步长），画面用 requestAnimationFrame
 *     在 120Hz / 144Hz 屏幕上，多出来的刷新只重画，不会多跑逻辑
 * ========================================================================= */
function resize() {
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / SCREEN_W, (window.innerHeight - 30) / SCREEN_H)));
  canvas.style.width = (SCREEN_W * s) + 'px';
  canvas.style.height = (SCREEN_H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();
buildDecor(LEVEL_1_1[0].length);
resetLevel();

const STEP_MS = 1000 / CONFIG.FPS;
let lastTime = performance.now(), accumulator = 0;
function frame(now) {
  let dt = now - lastTime;
  lastTime = now;
  if (!(dt >= 0)) dt = 0;
  if (dt > 250) dt = 250;               // 切回标签页时不要一下子快进
  accumulator += dt;
  let steps = 0;
  // 留 1 毫秒容差，避免 60Hz 屏幕因计时抖动出现"这帧不跑、下帧跑两次"的顿挫；
  // 每跑一步固定扣掉 1/60 秒，长期平均速度不变
  while (accumulator >= STEP_MS - 1 && steps < 8) { update(); accumulator -= STEP_MS; steps++; }
  if (steps >= 8) accumulator = 0;
  render();
  Sound.update();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
