<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090e16">
<title>AURORA IX · 曙光九号</title>
<style>
  :root{color-scheme:dark;--ink:#eef4f1;--muted:#a5b3be;--signal:#bde9cc;--line:rgba(226,239,242,.21)}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e16}
  body{font-family:"Bahnschrift","DIN Alternate","Microsoft YaHei",sans-serif;color:var(--ink);letter-spacing:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .frame{position:fixed;inset:0;pointer-events:none;padding:30px 36px calc(27px + env(safe-area-inset-bottom))}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  .identity{display:flex;gap:13px;align-items:center}
  .insignia{width:33px;height:39px;border-left:1px solid #d8e8ed;border-right:1px solid #d8e8ed;position:relative;transform:skewY(-13deg)}
  .insignia:before{content:"";position:absolute;width:1px;height:41px;left:15px;top:-1px;background:#d8e8ed;transform:rotate(23deg)}
  .brand{font-size:18px;font-weight:600;line-height:1.3}
  .sub{font-size:10px;letter-spacing:2px;color:#afc2cd;margin-top:5px}
  .live{font-size:10px;letter-spacing:2px;display:flex;gap:9px;align-items:center;justify-content:flex-end}
  .live i{width:6px;height:6px;border-radius:50%;background:#b7e6c2;box-shadow:0 0 10px #8bcba6}
  .channel{color:var(--muted);font-size:10px;text-align:right;margin-top:9px;letter-spacing:1px}
  .status{position:absolute;top:112px;left:36px;border-left:2px solid var(--signal);padding-left:12px}
  .status .en{color:#bdcbd1;font-size:9px;letter-spacing:2px;margin-bottom:6px}
  #phase{font-size:15px;font-weight:500;text-shadow:0 2px 9px #000}
  .countdown{position:absolute;right:36px;top:106px;text-align:right;opacity:0;transition:opacity .6s}
  .countdown.visible{opacity:1}
  #clock{font-size:34px;font-variant-numeric:tabular-nums;font-weight:300;text-shadow:0 2px 14px #000}
  .clock-label{color:var(--muted);font-size:9px;letter-spacing:2px;margin-top:4px}
  .bottom{position:absolute;left:36px;right:36px;bottom:calc(27px + env(safe-area-inset-bottom));display:flex;gap:25px;align-items:flex-end;justify-content:space-between}
  .telemetry{flex:1;max-width:565px;opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s}
  .telemetry.visible{opacity:1;transform:translateY(0)}
  .readings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;padding:15px 0 12px;border-top:1px solid var(--line)}
  .label{font-size:9px;color:#b7c2ca;letter-spacing:1.5px;margin-bottom:9px}
  .value{font-size:27px;font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 2px 12px #000}
  .unit{font-size:11px;color:#b4c3ca;margin-left:5px}
  .track{height:2px;background:rgba(209,223,230,.15);position:relative}
  #progress{height:2px;width:0;background:var(--signal);box-shadow:0 0 9px rgba(153,231,183,.45)}
  .telemetry-foot{display:flex;justify-content:space-between;gap:10px;color:#aab8c3;font-size:9px;letter-spacing:1px;margin-top:9px}
  .controls{pointer-events:auto;display:flex;align-items:center;gap:12px;padding-bottom:2px}
  button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}
  #launch{height:53px;min-width:149px;padding:0 24px;display:flex;align-items:center;justify-content:center;gap:13px;background:#dbeee4;color:#14231e;font-size:15px;font-weight:600;border-radius:3px;box-shadow:0 3px 25px #0004;transition:background .2s,opacity .3s}
  #launch:hover:not(:disabled){background:#f3fff8}
  #launch:disabled{cursor:default;background:rgba(202,226,216,.1);color:#a8bbb4;border:1px solid rgba(202,226,216,.2);box-shadow:none}
  button:focus-visible{outline:2px solid white;outline-offset:5px}
  button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  #mute{width:43px;height:43px;border-radius:50%;border:1px solid var(--line);background:#0b172755;color:#d1dbe0;display:none;place-items:center}
  #mute.shown{display:grid}
  #mute .cross{display:none}
  #mute.muted .waves{display:none}
  #mute.muted .cross{display:block}
  .success{position:absolute;top:28%;left:0;right:0;text-align:center;opacity:0;transform:translateY(12px);transition:opacity 2s,transform 2s}
  .success.visible{opacity:1;transform:translateY(0)}
  .success .tag{font-size:10px;letter-spacing:4px;color:#b8eacb;margin-bottom:14px}
  .success h1{font-family:"Yu Mincho","Songti SC","SimSun",serif;font-size:43px;font-weight:400;margin:0;text-shadow:0 2px 26px #000}
  .success .orbit{font-size:11px;letter-spacing:2px;color:#b5c2cc;margin-top:17px}
  .vignette{position:absolute;inset:0;box-shadow:inset 0 0 120px #0003;pointer-events:none}
  @media(max-width:600px){
    .frame{padding:23px 22px}.brand{font-size:16px}.sub{font-size:8px;letter-spacing:1.5px}.insignia{width:27px;height:32px}.insignia:before{height:33px;left:12px}
    .channel{font-size:8px}.live{font-size:8px}.status{left:22px;top:99px}.countdown{right:22px;top:96px}#clock{font-size:27px}
    .bottom{left:22px;right:22px;bottom:calc(20px + env(safe-area-inset-bottom));flex-direction:column;gap:19px;align-items:stretch}
    .telemetry{max-width:none;width:100%}.readings{gap:12px;padding:12px 0}.value{font-size:23px}.label{font-size:8px;letter-spacing:1px}.unit{font-size:9px;margin-left:3px}
    .controls{justify-content:flex-end}#launch{height:47px;min-width:136px}.success h1{font-size:35px}.success{top:26%}
  }
  @media(max-height:500px){.frame{padding:15px 22px}.status{top:75px;left:22px}.countdown{top:74px;right:22px}.bottom{bottom:16px;left:22px;right:22px}.readings{padding:8px 0}.value{font-size:22px}.success{top:22%}.success h1{font-size:32px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="scene" aria-label="曙光九号两级火箭发射与卫星入轨的连续动画"></canvas>
<div class="vignette"></div>
<main class="frame">
  <header class="top">
    <div class="identity"><div class="insignia" aria-hidden="true"></div><div><div class="brand">AURORA IX</div><div class="sub">曙光九号 / FLIGHT 009</div></div></div>
    <div><div class="live"><i></i>LIVE</div><div class="channel">COASTAL RANGE · 04:58</div></div>
  </header>
  <div class="status"><div class="en" id="phaseEnglish">FLIGHT STATUS</div><div id="phase" role="status" aria-live="polite">待命</div></div>
  <div class="countdown" id="timeBox"><div id="clock">T−10.0</div><div class="clock-label">MISSION ELAPSED TIME</div></div>
  <div class="success" id="success"><div class="tag">ORBIT CONFIRMED</div><h1>入轨成功</h1><div class="orbit">曙光九号 · 400 KM LOW EARTH ORBIT</div></div>
  <footer class="bottom">
    <section class="telemetry" id="telemetry" aria-label="实时遥测">
      <div class="readings">
        <div><div class="label">高度 / ALTITUDE</div><div class="value"><span id="altitude">0.00</span><span class="unit">km</span></div></div>
        <div><div class="label">速度 / VELOCITY</div><div class="value"><span id="velocity">0.000</span><span class="unit">km/s</span></div></div>
        <div><div class="label">下行链路 / SIGNAL</div><div class="value"><span id="signal">99.8</span><span class="unit">%</span></div></div>
      </div>
      <div class="track"><div id="progress"></div></div>
      <div class="telemetry-foot"><span>AEON · RANGE TELEMETRY</span><span id="event">系统就绪</span></div>
    </section>
    <div class="controls">
      <button id="mute" aria-label="静音" title="静音" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z"/><g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></g><g class="cross"><path d="m16 9 5 6m0-6-5 6"/></g></svg></button>
      <button id="launch"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="buttonIcon" d="M12 3c1 5 5 6 5 10a5 5 0 0 1-10 0c0-2 1-4 3-6 0 3 1 4 2 4 1-2 1-5 0-8Z"/></svg><span id="buttonLabel">点火</span></button>
    </div>
  </footer>
</main>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });
  const $ = id => document.getElementById(id);
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const END = 77, LIFTOFF = 10;
  let W = 1, H = 1, DPR = 1, start = null, elapsed = 0, now = 0, last = 0;
  let completed = false, muted = false, phaseId = '', audio = null, lastBeep = -1;
  let seed = 90603;
  const random = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
  const mix = (a,b,t) => a+(b-a)*t;
  const smooth = (a,b,t) => { const p=clamp((t-a)/(b-a)); return p*p*(3-2*p); };
  const rgba = (r,g,b,a) => `rgba(${r|0},${g|0},${b|0},${clamp(a)})`;
  function blend(a,b,p){ return a.map((v,i)=>mix(v,b[i],p)); }
  function line(x1,y1,x2,y2,color,width=1){ ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke(); }
  function poly(points,fill,stroke,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}}
  function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
  function glow(x,y,r,color,alpha=1){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=alpha;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}
  const stars = Array.from({length:480},()=>({x:random(),y:random(),r:.3+random()*1.1,b:.25+random()*.7,phase:random()*6.28}));
  const groundMarks = Array.from({length:120},()=>({x:random(),y:random(),r:random(),a:random()}));
  const hullGrain = Array.from({length:460},()=>({x:-20+random()*40,y:-424+random()*400,r:random()*1.8,a:random()}));
  const frost = Array.from({length:250},()=>({x:-20+random()*40,y:-291+random()*78,r:.2+random()*1.7}));
  const trail = [];
  let trailAccumulator = 0;
  const smoke = [];
  let smokeAccumulator = 0, steamAccumulator = 0;
  const vapor = [];

  // Cached, softly lit volumes keep the plume translucent without hard particle outlines.
  function smokeSprite(){
    const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
    for(let i=0;i<24;i++){
      const x=35+random()*58,y=35+random()*58,r=17+random()*24;
      const grad=g.createRadialGradient(x-r*.2,y-r*.3,0,x,y,r);
      grad.addColorStop(0,'rgba(226,233,235,.14)');grad.addColorStop(.46,'rgba(187,202,210,.12)');grad.addColorStop(1,'rgba(158,175,189,0)');
      g.fillStyle=grad;g.fillRect(x-r,y-r,r*2,r*2);
    }
    return c;
  }
  const cloudSprite=smokeSprite();
  const clouds=Array.from({length:12},(_,i)=>({x:random()*1.4-.2,y:.36+random()*.34,size:.13+random()*.2,speed:.001+random()*.0015,alpha:.12+random()*.2}));
  function earthSprite(){
    const c=document.createElement('canvas');c.width=c.height=1400;
    const g=c.getContext('2d'), R=680, center=700;
    g.save();g.beginPath();g.arc(center,center,R,0,Math.PI*2);g.clip();
    const ocean=g.createLinearGradient(120,180,1320,1050);
    ocean.addColorStop(0,'#77acb8');ocean.addColorStop(.25,'#2b7e9d');ocean.addColorStop(.55,'#164f74');ocean.addColorStop(1,'#020916');
    g.fillStyle=ocean;g.fillRect(0,0,1400,1400);
    const continents=[
      [[.04,.27],[.12,.18],[.23,.20],[.29,.26],[.32,.32],[.39,.33],[.42,.39],[.38,.45],[.33,.49],[.31,.56],[.26,.55],[.22,.48],[.14,.47],[.11,.37]],
      [[.29,.51],[.36,.49],[.42,.53],[.46,.61],[.43,.70],[.39,.78],[.36,.87],[.33,.82],[.31,.71],[.28,.62]],
      [[.52,.18],[.58,.15],[.61,.22],[.66,.20],[.74,.16],[.86,.21],[.94,.28],[.97,.38],[.90,.45],[.83,.44],[.80,.50],[.72,.46],[.66,.41],[.63,.36],[.57,.35],[.54,.29]],
      [[.54,.37],[.62,.37],[.68,.45],[.70,.54],[.66,.65],[.60,.72],[.55,.62],[.52,.50]],
      [[.81,.66],[.87,.63],[.93,.67],[.95,.76],[.90,.81],[.84,.78],[.80,.72]],
      [[.40,.04],[.46,.02],[.51,.07],[.50,.15],[.44,.18],[.40,.11]]
    ];
    for(const pts of continents){
      const land=g.createLinearGradient(160,100,1300,1100);land.addColorStop(0,'#8c9481');land.addColorStop(.4,'#547767');land.addColorStop(1,'#122a31');
      g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x*1400,y*1400):g.moveTo(x*1400,y*1400));g.closePath();g.fillStyle=land;g.fill();
      g.save();g.clip();
      for(let i=0;i<2000;i++){const x=random()*1400,y=random()*1400;g.fillStyle=`rgba(${random()>.5?'151,161,124':'25,55,50'},.12)`;g.fillRect(x,y,3+random()*15,1+random()*5);}
      g.restore();
    }
    for(let band=0;band<45;band++){
      const bx=random()*1400,by=random()*1400,length=50+random()*230;
      for(let j=0;j<length;j+=4){
        const x=bx+j,y=by+Math.sin(j*.013+band)*23,r=5+random()*15;
        const cloud=g.createRadialGradient(x,y,0,x,y,r);cloud.addColorStop(0,'rgba(237,246,243,.43)');cloud.addColorStop(1,'rgba(220,242,251,0)');
        g.fillStyle=cloud;g.fillRect(x-r,y-r,r*2,r*2);
      }
    }
    const night=g.createLinearGradient(360,0,1300,300);night.addColorStop(0,'rgba(0,3,14,0)');night.addColorStop(.39,'rgba(0,4,15,.18)');night.addColorStop(.72,'rgba(0,3,12,.88)');night.addColorStop(1,'rgba(0,2,8,.96)');
    g.fillStyle=night;g.fillRect(0,0,1400,1400);
    for(let i=0;i<850;i++){
      const p=continents[2][i%continents[2].length],x=p[0]*1400+(random()-.5)*95,y=p[1]*1400+(random()-.5)*60;
      if(x<860)continue;
      g.fillStyle=`rgba(255,${165+random()*63|0},95,${.13+random()*.7})`;g.fillRect(x,y,.6+random()*1.2,.6+random()*1.2);
    }
    const limb=g.createRadialGradient(570,560,420,700,700,683);
    limb.addColorStop(0,'rgba(0,0,0,0)');limb.addColorStop(.75,'rgba(0,0,0,0)');limb.addColorStop(.965,'rgba(2,30,58,.35)');limb.addColorStop(1,'rgba(135,228,255,.85)');
    g.fillStyle=limb;g.fillRect(0,0,1400,1400);g.restore();
    return c;
  }
  const earth=earthSprite();

  function resize(){
    W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2.5);
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize',resize);resize();

  // Hermite interpolation gives continuous telemetry and zero vertical speed at orbital insertion.
  const altitudeKeys=[[0,0,0],[3,.12,.12],[8,1.8,.65],[15,13,3],[23,50,5.5],[29,89,7],[36,160,12],[44,285,17],[50,375,8],[55,400,0],[67,400,0]];
  const speedKeys=[[0,0,0],[3,.12,.05],[8,.35,.06],[15,1.1,.14],[23,2.4,.16],[28,3.1,.07],[31,3.24,.05],[36,4.3,.3],[44,6.4,.22],[49,7.52,.1],[52,7.7,0],[67,7.7,0]];
  function interpolate(keys,t){
    if(t<=keys[0][0])return keys[0][1];
    for(let i=1;i<keys.length;i++){
      if(t<=keys[i][0]){
        const a=keys[i-1],b=keys[i],d=b[0]-a[0],p=(t-a[0])/d;
        return (2*p*p*p-3*p*p+1)*a[1]+(p*p*p-2*p*p+p)*d*a[2]+(-2*p*p*p+3*p*p)*b[1]+(p*p*p-p*p)*d*b[2];
      }
    }
    return keys[keys.length-1][1];
  }
  function state(){
    const t=elapsed-LIFTOFF, active=start!==null;
    const alt=active?interpolate(altitudeKeys,t):0, speed=active?interpolate(speedKeys,t):0;
    const ignition=active?smooth(7,9.65,elapsed):0;
    const cutoff=1-smooth(26.8,27.35,t);
    const stage2=smooth(30,31.1,t)*(1-smooth(49,50,t));
    const flight=clamp(t/48);
    const theta=mix(0,1.30,smooth(6,49,t));
    const shrink=mix(1,.63,smooth(10,36,t))*mix(1,.65,smooth(52,67,t));
    const initial=Math.min(H*.60/524,W*.24/44);
    const projected=Math.abs(Math.sin(theta))*524+Math.abs(Math.cos(theta))*52;
    const fit=Math.min(1,(W*.72)/(projected*initial));
    const scale=initial*shrink*fit;
    const rise=t>0?initial*(1.5*t*t+.09*t*t*t):0;
    const follow=smooth(2.2,10,t);
    const initialCenter=H*.84-initial*252;
    const y=mix(initialCenter-rise,H*.51,follow)-H*.065*smooth(43,62,t);
    const x=W*(.53+.025*smooth(8,25,t)-.025*smooth(48,67,t));
    const recenter=130*smooth(29,39,t);
    const cameraY=rise*follow;
    const qPulse=Math.sin(Math.PI*smooth(13.5,17.5,t));
    const vibration=motion.matches?0:(ignition*cutoff*(1-smooth(2,15,t))*1.45+qPulse*1.15);
    return {t,active,alt,speed,ignition,cutoff,stage2,flight,theta,scale,initial,x,y,recenter,cameraY,vibration};
  }
  function worldPoint(s,x,y){
    const yy=y+252+s.recenter;
    return {x:s.x+(x*Math.cos(s.theta)-yy*Math.sin(s.theta))*s.scale,y:s.y+(x*Math.sin(s.theta)+yy*Math.cos(s.theta))*s.scale};
  }

  function drawSky(s){
    const a=smooth(1,13,s.t), space=smooth(14,41,s.t);
    let top=blend([13,29,51],[64,121,167],a),mid=blend([72,85,106],[114,167,192],a),bottom=blend([199,143,133],[167,199,204],a);
    top=blend(top,[1,3,8],space);mid=blend(mid,[3,7,17],space);bottom=blend(bottom,[7,19,35],space);
    const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,rgba(...top,1));sky.addColorStop(.56,rgba(...mid,1));sky.addColorStop(1,rgba(...bottom,1));
    ctx.fillStyle=sky;ctx.fillRect(-10,-10,W+20,H+20);
    const starAlpha=mix(.28,0,a)*(1-space)+space*.95;
    for(const st of stars){
      const px=st.x*W,py=((st.y*H+s.cameraY*.008)%(H*1.1));
      const twinkle=motion.matches?1:.88+.12*Math.sin(now*.55+st.phase);
      ellipse(px,py,st.r,st.r,rgba(199+st.b*50,216+st.b*30,255,st.b*starAlpha*twinkle));
      if(st.r>1.2 && space>.6){line(px-3,py,px+3,py,rgba(160,201,255,.12*space),.5);line(px,py-3,px,py+3,rgba(160,201,255,.12*space),.5);}
    }
    const horizonAlpha=smooth(23,37,s.t)*(1-smooth(38,48,s.t));
    if(horizonAlpha>0){
      ctx.save();ctx.globalAlpha=horizonAlpha;
      ctx.beginPath();ctx.moveTo(-W*.2,H*.94);ctx.quadraticCurveTo(W*.5,H*.69,W*1.2,H*.94);
      ctx.strokeStyle='#b6f2ff';ctx.lineWidth=1;ctx.shadowBlur=13;ctx.shadowColor='#5cbafc';ctx.stroke();ctx.restore();
    }
    const orbit=smooth(31,48,s.t);
    if(orbit>0)drawEarth(s,orbit);
    const lowCloud=1-smooth(12,25,s.t);
    ctx.save();
    for(const c of clouds){
      const x=((c.x+c.speed*now)*W)%(W*1.6)-W*.2,y=c.y*H+s.cameraY*.23;
      if(y>H+150)continue;
      const size=c.size*W;
      ctx.globalAlpha=c.alpha*lowCloud;
      ctx.drawImage(cloudSprite,x-size*.8,y-size*.18,size*2.5,size*.68);
      ctx.globalAlpha=c.alpha*.19*lowCloud;ctx.globalCompositeOperation='screen';
      ctx.fillStyle='#ffceb0';ctx.fillRect(x,y+size*.24,size*1.2,1);
      ctx.globalCompositeOperation='source-over';
    }
    ctx.restore();
  }
  function drawEarth(s,alpha){
    const r=Math.max(W*.80,H*.84);
    const top=mix(H*1.14,H*.73,smooth(31,49,s.t));
    const cy=top+r;
    ctx.save();ctx.globalAlpha=alpha;

      inner.addColorStop(0,'rgba(255,255,246,.97)');inner.addColorStop(.15,first?'rgba(255,244,154,.8)':'rgba(222,250,255,.58)');inner.addColorStop(1,'rgba(145,202,255,0)');
      flameShape(y,length*.65,width*.4,inner,flutter);
      if(first&&thin<.9){
        ctx.globalAlpha=(1-thin)*power;
        for(let i=0;i<7;i++){
          const py=y+17+i*17,ww=(11-i*.55)*(1+thin);
          poly([[0,py-6],[-ww,py],[0,py+7],[ww,py]],i%2?'rgba(255,233,146,.42)':'rgba(120,54,11,.25)');
        }ctx.globalAlpha=1;
      }
      glow(0,y,first?31:24,first?'rgba(255,231,138,.65)':'rgba(167,223,255,.53)',power);
    }
    ctx.restore();
    if(s.t<4.7){
      const base=H*.84+s.cameraY,rx=W*.53,p=s.ignition*s.cutoff*(1-smooth(2,4.7,s.t));
      ctx.save();ctx.globalCompositeOperation='screen';
      for(const sign of [-1,1]){
        const g=ctx.createLinearGradient(rx,base,rx+sign*W*.27,base+H*.08);g.addColorStop(0,rgba(255,232,108,p*.75));g.addColorStop(.25,rgba(255,112,18,p*.6));g.addColorStop(1,'rgba(255,78,12,0)');
        ctx.beginPath();ctx.moveTo(rx,base);ctx.bezierCurveTo(rx+sign*W*.05,base+20,rx+sign*W*.13,base+H*.035,rx+sign*W*.32,base+H*.11);ctx.bezierCurveTo(rx+sign*W*.14,base+H*.09,rx+sign*W*.06,base+35,rx,base+19);ctx.closePath();ctx.fillStyle=g;ctx.fill();
      }ctx.restore();
    }
  }

  function updateParticles(s,dt){
    if(s.active && elapsed>=3 && s.t<11){
      smokeAccumulator+=dt*(elapsed<7?23:55);
      while(smokeAccumulator>=1){
        smokeAccumulator--;
        const sign=random()>.5?1:-1;
        smoke.push({x:W*.53+sign*8,y:H*.84+12,age:0,life:7+random()*6,vx:sign*(24+random()*56),vy:-8-random()*17,size:18+random()*25,water:elapsed<7,spin:random()});
      }
    }
    for(let i=smoke.length-1;i>=0;i--){
      const p=smoke[i];p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-dt*.06);
      if(p.age>p.life)smoke.splice(i,1);
    }
    if(!s.active||s.t<1.5){
      steamAccumulator+=dt*12;
      while(steamAccumulator>=1){
        steamAccumulator--;const y=-282+random()*190;
        const p={x:W*.53+21*s.initial,y:H*.84+y*s.initial,age:0,life:2.4+random()*2,vx:14+random()*15,vy:-7-random()*6,size:4+random()*7};vapor.push(p);
      }
    }
    for(let i=vapor.length-1;i>=0;i--){const p=vapor[i];p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.age>p.life)vapor.splice(i,1);}
    if(s.t>0&&s.t<26.8){
      trailAccumulator+=dt*24;
      while(trailAccumulator>=1){
        trailAccumulator--;
        const e=worldPoint(s,0,28),view=s.cameraY;
        trail.push({x:e.x,y:e.y-view,age:0,width:(7+random()*10)*mix(1,.45,smooth(10,26,s.t)),alpha:mix(.44,0,smooth(9,27,s.t)),wind:random()*9+9});
      }
    }
    for(let i=trail.length-1;i>=0;i--){trail[i].age+=dt;trail[i].x+=trail[i].wind*dt;if(trail[i].age>17)trail.splice(i,1);}
  }
  function drawTrail(s){
    ctx.save();
    for(const p of trail){
      const sz=p.width+p.age*3.7,y=p.y+s.cameraY;
      if(y>H+sz||y<-sz)continue;
      ctx.globalAlpha=p.alpha*(1-p.age/17);
      ctx.drawImage(cloudSprite,p.x-sz,y-sz,sz*2,sz*2.5);
    }ctx.restore();
  }
  function drawSmoke(s){
    ctx.save();
    for(const p of vapor){
      const sz=p.size+p.age*13,life=p.age/p.life;
      ctx.globalAlpha=(1-life)*.58;
      ctx.drawImage(cloudSprite,p.x-sz*.5,p.y+s.cameraY-sz*.5,sz*1.8,sz);
    }
    for(const p of smoke){
      const sz=p.size+p.age*(p.water?15:25),y=p.y+s.cameraY;
      if(y-sz>H+50)continue;
      const alpha=Math.sin(Math.PI*clamp(p.age/p.life))*(p.water?.72:.98);
      ctx.globalAlpha=alpha;
      ctx.drawImage(cloudSprite,p.x-sz,y-sz*.52,sz*2.6,sz*1.6);
      if(!p.water&&s.t<4){
        ctx.globalCompositeOperation='screen';ctx.globalAlpha=alpha*.12*s.ignition;
        ctx.fillStyle='#ffad5b';ctx.beginPath();ctx.ellipse(p.x,y,sz*.55,sz*.18,0,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';
      }
    }ctx.restore();
  }
  function drawCloudPass(s){
    const bands=[{a:7.5,b:12,side:-1},{a:10.5,b:15.5,side:1},{a:17,b:20,side:-1}];
    for(const band of bands){
      if(s.t<band.a||s.t>band.b)continue;
      const p=(s.t-band.a)/(band.b-band.a),alpha=Math.sin(p*Math.PI)*.40;
      const y=mix(-H*.2,H*1.25,p),width=W*1.2;
      ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(cloudSprite,-W*.1+band.side*W*.13,y-H*.3,width,H*.65);ctx.restore();
      const mist=Math.pow(Math.sin(p*Math.PI),10)*.13;
      ctx.fillStyle=rgba(210,231,236,mist);ctx.fillRect(0,0,W,H);
    }
  }
  function drawGrain(){
    // Fixed fine sensor grain; no temporal flashing, including reduced-motion mode.
    ctx.fillStyle='rgba(218,235,237,.022)';
    for(let i=0;i<140;i++){const x=(i*193.7)%W,y=(i*317.3)%H;ctx.fillRect(x,y,1,1);}
  }

  function makeAudio(){
    const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
    try{
      const ac=new Audio(),master=ac.createGain();master.gain.value=muted?0:.34;master.connect(ac.destination);
      const buffer=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate),data=buffer.getChannelData(0);
      let filtered=0;
      for(let i=0;i<data.length;i++){filtered=(filtered+(Math.random()*2-1)*.12)/1.12;data[i]=filtered*3;}
      const noise=ac.createBufferSource();noise.buffer=buffer;noise.loop=true;
      const filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=450;
      const engine=ac.createGain();engine.gain.value=0;noise.connect(filter);filter.connect(engine);engine.connect(master);noise.start();
      const bass=ac.createOscillator();bass.type='sine';bass.frequency.value=36;const bassGain=ac.createGain();bassGain.gain.value=0;bass.connect(bassGain);bassGain.connect(master);bass.start();
      ac.resume().catch(()=>{});audio={ac,master,engine,filter,bassGain};
    }catch(e){audio=null;}
  }
  function beep(freq=700,length=.09,volume=.09){
    if(!audio)return;
    const {ac,master}=audio,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;o.type='sine';
    g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(volume,ac.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+length);
    o.connect(g);g.connect(master);o.start();o.stop(ac.currentTime+length+.01);
  }
  function updateAudio(s){
    if(!audio)return;
    const burn=(s.t<28.6?s.ignition*s.cutoff:s.stage2*.32);
    const amount=burn*mix(1,.09,smooth(3,38,s.t));
    const {ac,engine,filter,bassGain}=audio;
    engine.gain.setTargetAtTime(amount,ac.currentTime,.18);bassGain.gain.setTargetAtTime(amount*.2,ac.currentTime,.18);
    filter.frequency.setTargetAtTime(mix(510,120,smooth(4,38,s.t)),ac.currentTime,.3);
    if(elapsed<10){const n=Math.floor(elapsed);if(n!==lastBeep){lastBeep=n;beep(n>=7?940:660);}}
  }
  const phases=[
    [-Infinity,'待命','FLIGHT STATUS','系统就绪'],
    [-10,'倒计时','TERMINAL COUNTDOWN','飞控已接管'],
    [-7,'倒计时','WATER DELUGE ACTIVE','降噪水幕开启'],
    [-3,'点火','ENGINE IGNITION','建立发动机推力'],
    [0,'起飞','LIFTOFF','离台 · 推力正常'],
    [7,'起飞','ASCENT / PITCH PROGRAM','重力转弯'],
    [13.5,'Max-Q','MAXIMUM DYNAMIC PRESSURE','最大动压 · 节流'],
    [17.5,'起飞','UPPER ATMOSPHERE','通过最大动压'],
    [26.8,'一级关机','MAIN ENGINE CUTOFF','MECO · 滑行'],
    [28.6,'级间分离','STAGE SEPARATION','一级分离'],
    [30,'二级点火','SECOND ENGINE START','真空发动机点火'],
    [36,'整流罩分离','FAIRING JETTISON','载荷暴露'],
    [46,'入轨','ORBITAL INSERTION','近地轨道注入'],
    [49,'二级关机','SECOND ENGINE CUTOFF','SECO · 惯性滑行'],
    [52,'卫星分离','PAYLOAD DEPLOYMENT','载荷已释放'],
    [54,'太阳翼展开','SOLAR ARRAY DEPLOYMENT','太阳翼解锁'],
    [60,'入轨','ORBIT VERIFICATION','轨道确认'],
    [67,'入轨成功','MISSION COMPLETE','任务完成']
  ];
  function updateHUD(s){
    let p=phases[0];
    if(s.active)for(const row of phases){if(s.t>=row[0])p=row;}
    if(phaseId!==p[2]){
      phaseId=p[2];$('phase').textContent=p[1];$('phaseEnglish').textContent=p[2];$('event').textContent=p[3];
      if(s.active&&[28.6,36,52].includes(p[0]))beep(180,.18,.16);
    }
    $('clock').textContent=`T${s.t<0?'−':'+'}${Math.abs(s.t).toFixed(1).padStart(4,'0')}`;
    $('altitude').textContent=s.alt<10?s.alt.toFixed(2):s.alt.toFixed(1);
    $('velocity').textContent=s.speed.toFixed(3);
    $('signal').textContent=(99.8-.35*Math.sin(now*.23)**2-(s.t>8&&s.t<24?.8*Math.sin(now*.47)**2:0)).toFixed(1);
    $('progress').style.width=`${clamp(elapsed/END)*100}%`;
    if(s.active&&elapsed>=END&&!completed){
      completed=true;$('success').classList.add('visible');$('launch').disabled=false;$('buttonLabel').textContent='重新发射';
      $('buttonIcon').setAttribute('d','M3 11a9 9 0 1 1 3 7M3 4v7h7');
      beep(880,.35,.065);setTimeout(()=>beep(1174,.5,.045),240);
    }
  }
  function reset(){
    start=null;elapsed=0;completed=false;lastBeep=-1;phaseId='';
    smoke.length=0;vapor.length=0;trail.length=0;smokeAccumulator=steamAccumulator=trailAccumulator=0;
    $('success').classList.remove('visible');$('telemetry').classList.remove('visible');$('timeBox').classList.remove('visible');
    $('launch').disabled=false;$('buttonLabel').textContent='点火';$('mute').classList.remove('shown');
    $('buttonIcon').setAttribute('d','M12 3c1 5 5 6 5 10a5 5 0 0 1-10 0c0-2 1-4 3-6 0 3 1 4 2 4 1-2 1-5 0-8Z');
    if(audio){audio.ac.close().catch(()=>{});audio=null;}
  }
  $('launch').addEventListener('click',()=>{
    if(completed){reset();return;}
    if(start!==null)return;
    start=performance.now();elapsed=0;lastBeep=-1;$('launch').disabled=true;$('buttonLabel').textContent='发射中';
    $('telemetry').classList.add('visible');$('timeBox').classList.add('visible');$('mute').classList.add('shown');makeAudio();
  });
  $('mute').addEventListener('click',()=>{
    muted=!muted;$('mute').classList.toggle('muted',muted);$('mute').setAttribute('aria-pressed',String(muted));$('mute').setAttribute('aria-label',muted?'取消静音':'静音');$('mute').title=muted?'取消静音':'静音';
    if(audio)audio.master.gain.setTargetAtTime(muted?0:.34,audio.ac.currentTime,.08);
  });
  function render(timestamp){
    now=timestamp/1000;
    const dt=Math.min((timestamp-last)/1000,.05);last=timestamp;
    if(start!==null)elapsed=Math.min((timestamp-start)/1000,END);
    const s=state();updateParticles(s,dt);updateHUD(s);if(s.active)updateAudio(s);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.save();
    const shake=s.vibration;
    ctx.translate(Math.sin(now*42)*shake,Math.cos(now*37)*shake*.67);
    drawSky(s);drawGround(s);drawTrail(s);drawPlume(s);drawRocket(s);drawSmoke(s);drawCloudPass(s);drawGrain();
    ctx.restore();
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
