      const smooth=(a,b,x)=>{const q=THREE.MathUtils.clamp((x-a)/(b-a),0,1);return q*q*(3-2*q);};
      function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));}addEventListener('resize',resize);
      const baseTarget=new THREE.Vector3(),desiredCamera=new THREE.Vector3();
      function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;const running=flightStart!==null,t=running?(now-flightStart)/1000:0,ascent=Math.max(0,t-3),travel=Math.min(ascent,38),space=smooth(17,33,ascent);let power=running?smooth(0,2.5,t)*(1-smooth(36,38,ascent)):0;
        const visualAltitude=travel*travel*.72;
        rocket.position.y=3+visualAltitude;rocket.rotation.z=-smooth(13,38,ascent)*.24;rocket.rotation.x=smooth(18,38,ascent)*.045;
        umbilical.rotation.y=-smooth(.2,2.3,t)*1.3;
        scene.background.copy(day).lerp(night,space);scene.fog.color.copy(scene.background);scene.fog.density=.0025*(1-space);
        hemi.intensity=2.3-space*1.5;sun.intensity=4.5-space;sun.position.set(-45,rocket.position.y+80,35);sun.target.position.copy(rocket.position);stars.position.y=rocket.position.y;stars.material.opacity=smooth(.45,1,space);
        ground.visible=ascent<29;cloudLayer.visible=ascent<33;earth.visible=space>.05;earth.position.y=rocket.position.y-230;earth.scale.setScalar(.55+.45*space);
        const mobile=innerWidth<640,distance=mobile?95:74,angle=.59+(reduced?0:Math.sin(now*.000045)*.045)*(1-space);
        baseTarget.set(0,rocket.position.y+15,0);desiredCamera.set(Math.sin(angle)*distance,rocket.position.y+22+space*10,Math.cos(angle)*distance);
        if(!reduced&&power>.1){const shake=power*.06*(1-smooth(2,9,ascent));desiredCamera.x+=Math.sin(now*.047)*shake;desiredCamera.y+=Math.sin(now*.069)*shake;}
        camera.position.copy(desiredCamera);camera.lookAt(baseTarget);
        exhaust.visible=power>.001;exhaust.scale.set(1+space*.45,Math.max(.05,power)*(1+space*.35),1+space*.45);flameMaterial.uniforms.time.value=now/1000;flameMaterial.uniforms.power.value=power;innerFlame.material.opacity=.7*power;flame.scale.x=flame.scale.z=1+Math.sin(now*.07)*.035;fireLight.intensity=power*(65+Math.sin(now*.057)*5);
        if(running&&power>.05){emission+=dt*(reduced?10:42)*power;while(emission>=1){puff(rocket.position.y,power);emission--;}}
        for(const p of smoke){if(p.age>=p.life){p.sprite.visible=false;continue;}p.age+=dt;p.sprite.position.addScaledVector(p.velocity,dt);p.velocity.multiplyScalar(1-dt*.17);p.velocity.y+=dt*.42;const life=p.age/p.life,scale=p.size*(1+life*3.5);p.sprite.scale.set(scale,scale*.78,1);p.sprite.material.opacity=Math.max(0,Math.sin(Math.PI*life))*(reduced?.12:.3)*(1-space);}
        for(let i=0;i<vapor.length;i++){const s=vapor[i],q=((now*.00016+i/vapor.length)%1);s.visible=!running||t<4;s.position.set(1.5+q*9,rocket.position.y+20-q*4+Math.sin(i)*.4,q*2);s.scale.setScalar(.4+q*4);s.material.opacity=(1-q)*.14;}
        if(noiseGain)noiseGain.gain.setTargetAtTime(soundOn?power*.5*(1-space*.6):0,audioCtx.currentTime,.1);
        const altitude=120*Math.pow(travel/38,2.5),speed=running?Math.round(8000*Math.pow(travel/38,1.5)*(1-smooth(36,38,ascent)*.08)):0;
        $('altitude').innerHTML=altitude.toFixed(2)+' <span>km</span>';$('velocity').innerHTML=speed.toLocaleString('en-US')+' <span>m/s</span>';$('thrust').innerHTML=Math.round(power*100)+' <span>%</span>';$('marker').style.bottom=(altitude/120*100)+'%';
        if(!running)$('clock').textContent='T − 00:03';else{const seconds=Math.floor(Math.abs(t-3));$('clock').textContent=(t<3?'T − ':'T + ')+String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
        if(running){if(t<3){$('phaseLabel').textContent='IGNITION SEQUENCE';$('stage').textContent='Engines ignited. Thrust building.';$('flightStatus').textContent='IGNITION';}else if(ascent<9){$('phaseLabel').textContent='LIFTOFF';$('stage').textContent='Hold-down release. Vehicle ascending.';$('flightStatus').textContent='ASCENT';}else if(ascent<18){$('phaseLabel').textContent='ATMOSPHERIC ASCENT';$('stage').textContent='Passing through the cloud layer.';$('flightStatus').textContent='NOMINAL';}else if(ascent<33){$('phaseLabel').textContent='UPPER ATMOSPHERE';$('stage').textContent='Approaching the edge of space.';$('flightStatus').textContent='NOMINAL';}else if(ascent<38){$('phaseLabel').textContent='SPACE REACHED';$('stage').textContent='Above the Karman line. Engine cutoff.';$('flightStatus').textContent='MECO';}if(space>.5)$('ui').classList.add('space');if(ascent>=38&&!finished){finished=true;$('headline').innerHTML='Welcome<br>to space.';$('stage').textContent='120 km above Earth. Mission complete.';$('phaseLabel').textContent='MISSION COMPLETE';$('linkState').textContent='FLIGHT COMPLETE';$('flightStatus').textContent='COMPLETE';$('launchText').textContent='RETURN TO LAUNCHPAD';$('launch').disabled=false;}if(finished)$('clock').textContent='T + 00:38';}
        renderer.render(scene,camera);
      }
      reset();requestAnimationFrame(frame);
    } catch(error) {
      $('error').hidden=false;$('error').textContent='Flight renderer unavailable. Check your internet connection and enable WebGL, then reload.';$('launchText').textContent='RENDERER UNAVAILABLE';console.error(error);
    }
  </script>
