<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>晨曦-7 发射直播 · 赫利昂-2 运载火箭</title>
<style>
  :root {
    --fg: #eef3f9;
    --dim: #9fb0c7;
    --panel: rgba(7, 13, 26, .58);
    --line: rgba(160, 190, 230, .2);
    --amber: #ffd27a;
    --go: #7dffa8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #040814; color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; touch-action: manipulation;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; inset: 0; pointer-events: none; }
  .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  .brand {
    position: absolute; left: max(16px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top));
    display: flex; gap: 10px; align-items: center; text-shadow: 0 1px 6px rgba(0,0,0,.5);
  }
  .brand svg { width: 40px; height: 40px; flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.45)); }
  .brand b { display: block; font-size: 15px; letter-spacing: .08em; }
  .brand span { display: block; font-size: 11px; color: var(--dim); letter-spacing: .12em; margin-top: 2px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; color: #ffc2b8; letter-spacing: .2em; margin-top: 4px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #ff3b30; box-shadow: 0 0 8px #ff3b30; animation: blink 1.6s infinite; }

  .telemetry {
    position: absolute; right: max(16px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top));
    width: 250px; padding: 10px 14px 9px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  .telemetry h2 { margin: 0 0 4px; font-size: 10px; font-weight: 600; letter-spacing: .28em; color: var(--dim); }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .row label { font-size: 12px; color: var(--dim); letter-spacing: .12em; }
  .row output { font-size: 17px; font-weight: 600; }
  .row small { font-size: 11px; color: var(--dim); margin-left: 4px; font-weight: 400; font-family: system-ui, sans-serif; }
  .row.phase { border-bottom: 0; }
  .row.phase output { color: var(--amber); font-size: 15px; letter-spacing: .06em; }
  .event { font-size: 11px; color: #c8d4e4; min-height: 15px; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,.1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .count {
    position: absolute; left: 50%; top: 21%; transform: translate(-50%, -50%);
    font-size: clamp(54px, 10vw, 128px); font-weight: 700; line-height: 1; letter-spacing: .02em; color: #fff;
    text-shadow: 0 0 32px rgba(255, 150, 70, .55), 0 3px 0 rgba(0,0,0,.25);
    opacity: 0; transition: opacity .35s;
  }
  .count.show { opacity: 1; }

  .controls {
    position: absolute; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: auto;
    transition: opacity .6s;
  }
  .controls.hide { opacity: 0; pointer-events: none; }
  .status { font-size: 12px; letter-spacing: .3em; color: var(--dim); text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .status b { color: var(--go); font-weight: 600; }
  .btn {
    font: inherit; cursor: pointer; border: 0; color: #fff; letter-spacing: .5em; text-indent: .5em;
    padding: 16px 46px; border-radius: 999px; font-size: 20px; font-weight: 700;
    background: radial-gradient(120% 140% at 50% 0%, #ff9d4d 0%, #ff5a1f 45%, #c42d12 100%);
    box-shadow: 0 0 0 2px rgba(255,255,255,.18) inset, 0 10px 30px rgba(255, 80, 20, .45), 0 0 0 6px rgba(255, 110, 40, .14);
    animation: pulse 2.2s ease-in-out infinite;
    transition: transform .15s, filter .3s, opacity .3s;
  }
  .btn:hover { transform: translateY(-1px) scale(1.02); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .btn:disabled { cursor: default; opacity: .4; filter: grayscale(.7); animation: none; transform: none; }

  .mute {
    position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom));
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
    color: var(--fg); display: grid; place-items: center; cursor: pointer; pointer-events: auto;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .mute svg { width: 22px; height: 22px; }
  .mute .off { display: none; }
  .mute[aria-pressed="true"] .on { display: none; }
  .mute[aria-pressed="true"] .off { display: block; }
  .mute:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  .done { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity 1.4s; }
  .done.show { opacity: 1; pointer-events: auto; }
  .card {
    text-align: center; padding: 22px 30px 24px; border-radius: 18px; margin: 0 16px; transform: translateY(-14vh);
    background: rgba(5, 11, 24, .55); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .card .ok { font-size: 11px; letter-spacing: .4em; color: var(--go); }
  .card h1 { margin: 6px 0 2px; font-size: clamp(30px, 6vw, 46px); letter-spacing: .24em; text-indent: .24em; font-weight: 700;
    background: linear-gradient(180deg, #fff, #ffd9a8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card p { margin: 0; color: var(--dim); font-size: 12px; letter-spacing: .1em; }
  .stats { display: flex; gap: 22px; justify-content: center; margin: 16px 0 18px; }
  .stats div { min-width: 82px; }
  .stats label { display: block; font-size: 11px; color: var(--dim); letter-spacing: .14em; }
  .stats output { display: block; font-size: 20px; font-weight: 600; margin-top: 3px; }
  .stats small { font-size: 11px; color: var(--dim); margin-left: 3px; font-family: system-ui, sans-serif; font-weight: 400; }
  .btn.again { font-size: 16px; padding: 12px 34px; letter-spacing: .3em; text-indent: .3em; animation: none;
    background: radial-gradient(120% 140% at 50% 0%, #5aa8ff 0%, #2f6fe0 50%, #1d3f99 100%);
    box-shadow: 0 0 0 2px rgba(255,255,255,.18) inset, 0 10px 30px rgba(40, 110, 255, .4); }

  @media (max-width: 640px) {
    .brand svg { width: 34px; height: 34px; }
    .brand b { font-size: 13px; }
    .telemetry {
      left: 12px; right: 12px; width: auto; top: calc(max(14px, env(safe-area-inset-top)) + 58px);
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 14px; padding: 6px 12px 7px;
    }
    .telemetry h2 { display: none; }
    .row { padding: 4px 0; }
    .row label { font-size: 11px; letter-spacing: .06em; }
    .row output { font-size: 14px; }
    .row.phase { border-bottom: 1px solid rgba(255,255,255,.07); }
    .row.phase output { font-size: 13px; }
    .event { grid-column: 1 / -1; min-width: 0; }
    .row { min-width: 0; gap: 6px; }
    .row label { white-space: nowrap; }
    .count { top: 31%; }
    .btn { padding: 14px 40px; font-size: 18px; }
    .stats { gap: 12px; }
    .stats div { min-width: 0; }
    .stats output { font-size: 17px; }
  }
  @media (max-height: 460px) {
    .count { top: 30%; font-size: 56px; }
    .telemetry { padding: 6px 12px; }
    .row { padding: 3px 0; }
  }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255,255,255,.18) inset, 0 10px 30px rgba(255, 80, 20, .45), 0 0 0 6px rgba(255, 110, 40, .14); }
    50% { box-shadow: 0 0 0 2px rgba(255,255,255,.25) inset, 0 10px 40px rgba(255, 90, 20, .7), 0 0 0 12px rgba(255, 110, 40, .06); }
  }
  @media (prefers-reduced-motion: reduce) {
    .live i, .btn { animation: none; }
    .count, .done, .controls { transition: none; }
  }
</style>

<body>
<canvas id="scene" role="img" aria-label="赫利昂-2 运载火箭发射直播画面"></canvas>
<div class="hud">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14244a"/><stop offset=".62" stop-color="#2c3f78"/><stop offset=".63" stop-color="#ff9a4a"/><stop offset="1" stop-color="#ffcf7a"/></linearGradient>
      </defs>
      <circle cx="32" cy="32" r="30" fill="url(#pg)" stroke="#e8eef8" stroke-width="2.5"/>
      <path d="M8 44 Q32 30 56 44" fill="none" stroke="#fff" stroke-width="2" opacity=".85"/>
      <circle cx="32" cy="44" r="7" fill="#fff4d6"/>
      <ellipse cx="32" cy="27" rx="21" ry="8" fill="none" stroke="#9fd0ff" stroke-width="1.6" transform="rotate(-18 32 27)"/>

      <circle cx="49" cy="20" r="2.2" fill="#9fd0ff"/>
    </svg>
    <div>
      <b>晨曦-7 · DAWNLINK-7</b>
      <span>赫利昂-2 运载火箭 · 13 号发射工位</span>

    </div>
  </div>

  <div class="count mono" id="count" aria-hidden="true">T-10</div>

  <section class="telemetry" aria-label="遥测数据">
    <h2>遥测 TELEMETRY</h2>
    <div class="row"><label>任务时间</label><output class="mono" id="tMet">T-00:10.0</output></div>
    <div class="row"><label>高度</label><output class="mono"><span id="tAlt">0.00</span><small>km</small></output></div>

    <div class="row phase"><label>阶段</label><output id="tPhase">待命</output></div>
    <div class="event" id="tEvent">推进剂加注完毕 · 天气许可发射</div>
  </section>

  <div class="controls" id="controls">
    <div class="status">状态 <b id="status">待命</b></div>
    <button class="btn" id="ignite" type="button">点火</button>
  </div>

  <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="静音">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>

  <div class="done" id="done" aria-live="polite">
    <div class="card">
      <div class="ok">● 轨道确认</div>
      <h1>入轨成功</h1>
      <p>晨曦-7 卫星已进入近地轨道，太阳翼展开正常</p>
      <div class="stats">
        <div><label>高度</label><output class="mono"><span id="fAlt">400.0</span><small>km</small></output></div>
        <div><label>速度</label><output class="mono"><span id="fVel">7.67</span><small>km/s</small></output></div>
        <div><label>任务时间</label><output class="mono" id="fMet">T+00:58</output></div>
      </div>
      <button class="btn again" id="again" type="button">重新发射</button>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';

/* =====================================================================
   基础：画布、工具函数、噪声、颜色
   ===================================================================== */
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
const $ = (id) => document.getElementById(id);
const ui = {
  met: $('tMet'), alt: $('tAlt'), vel: $('tVel'), phase: $('tPhase'), event: $('tEvent'),
  status: $('status'), ignite: $('ignite'), controls: $('controls'), mute: $('mute'),
  count: $('count'), done: $('done'), again: $('again'), fAlt: $('fAlt'), fVel: $('fVel'), fMet: $('fMet'),
};

const mq = matchMedia('(prefers-reduced-motion: reduce)');
let RM = mq.matches;
if (mq.addEventListener) mq.addEventListener('change', (e) => { RM = e.matches; });

const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const sat = (v) => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const pulse = (a, b, c, d, x) => smooth(a, b, x) * (1 - smooth(c, d, x));
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);

function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const NOISE = new Float32Array(1024);
{ const r = rng(42); for (let i = 0; i < 1024; i++) NOISE[i] = r(); }
const n1 = (x) => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(NOISE[i & 1023], NOISE[(i + 1) & 1023], u); };
const fbm = (x) => n1(x) * 0.5 + n1(x * 2.17 + 13.1) * 0.3 + n1(x * 4.63 + 71.7) * 0.2;
// 2D value noise for procedural textures
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const h = (a, b) => NOISE[(a * 157 + b * 311 + ((a * b) & 255)) & 1023];
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(h(xi, yi), h(xi + 1, yi), u), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), u), v);
}
const fbm2 = (x, y) => noise2(x, y) * 0.5 + noise2(x * 2.03 + 5.2, y * 2.03 + 1.3) * 0.27 + noise2(x * 4.1 + 9.7, y * 4.1 + 3.1) * 0.15 + noise2(x * 8.3, y * 8.3) * 0.08;

const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${+a.toFixed(4)})`;
function keyed(keys, x) {
  if (x <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (x <= keys[i][0]) {
      const t = (x - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0]);
      const a = keys[i - 1][1], b = keys[i][1];
      return Array.isArray(a) ? mixc(a, b, t) : lerp(a, b, t);
    }
  }
  return keys[keys.length - 1][1];
}
// 单调三次插值：遥测和镜头参数都用它，保证连续、不过冲
function monotone(pts) {
  const n = pts.length, xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const d = [], m = new Array(n).fill(0);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return (x) => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}

/* =====================================================================
   任务时间线（m = 任务时间，秒；点击后 10 秒为 T-0）
   ===================================================================== */
const T0 = 10;
const EV = {
  deluge: -7, arms: [-5.4, -4.6, -3.8, -3.2], ignite: -3, full: -0.7, liftoff: 0, clearPad: 2.6,
  pitch: 8, transonic: [14.3, 16.6], maxq: [14.8, 18.6], meco: 24, sep: 26, ses: 28.2,
  fairing: 33, seco: 44.5, satSep: 46.5, panels: [49, 54.5], success: 58,
};
const PHASES = [
  [-Infinity, '待命'], [-10, '倒计时'], [-3, '点火'], [0, '起飞'], [EV.maxq[0], 'Max-Q'],
  [EV.maxq[1], '一级飞行'], [EV.meco, '级间分离'], [EV.ses + 1.3, '二级飞行'], [EV.fairing, '整流罩分离'],
  [EV.fairing + 3, '二级飞行'], [EV.seco, '入轨'],
];
const phaseAt = (m) => { let p = PHASES[0][1]; for (const [t, name] of PHASES) if (m >= t) p = name; return p; };

// 遥测：高度 km、速度 km/s（时间轴压缩，但连续、单调、与画面阶段一致）
const ALT = monotone([[0, 0], [1, 0.0012], [2, 0.005], [3, 0.011], [4, 0.021], [6, 0.058], [8, 0.135], [10, 0.3],
  [12, 0.8], [14, 2.0], [16, 4.4], [18, 8.4], [20, 15], [22, 25], [24, 38], [26, 50], [28, 62], [30, 76], [33, 101],
  [36, 138], [39, 198], [42, 292], [44.5, 386], [46.5, 399.2], [50, 400.1], [80, 400.5]]);
const VEL = monotone([[0, 0], [1, 0.0025], [2, 0.0055], [3, 0.009], [4, 0.013], [6, 0.025], [8, 0.044], [10, 0.075],
  [12, 0.14], [14, 0.27], [15, 0.345], [16, 0.43], [18, 0.66], [20, 0.98], [22, 1.42], [24, 2.02], [26, 2.01],
  [28, 2.02], [32, 2.95], [36, 4.0], [40, 5.3], [43, 6.6], [44.5, 7.67], [46.5, 7.668], [80, 7.665]]);
const altAt = (m) => (m <= 0 ? 0 : ALT(m));
const velAt = (m) => (m <= 0 ? 0 : VEL(m));

/* =====================================================================
   画面里的飞行轨迹（“视觉米”）：离台慢、随后加速、重力转弯
   ===================================================================== */
const ROCKET_LEN = 70.5;   // 整流罩尖到喷管出口
const R_BODY = 2.9;        // 箭体半径，长细比约 12
const BASE_Y = 12;         // 发射架上喷管出口的高度（台面高 8.2 m）
function visSpeed(m) {
  if (m <= 0) return 0;
  if (m <= 10) return 2 * m + 0.5 * m * m;
  if (m <= EV.meco) return 70 + 21 * (m - 10);
  if (m <= EV.ses) return 364;
  return Math.min(620, 364 + 16 * (m - EV.ses));
}
function pitchAt(m) {
  if (m <= EV.pitch) return 0;
  const s = sat((m - EV.pitch) / 38);
  return (84 * (1 - Math.pow(1 - s, 1.7)) + 4 * smooth(46, 60, m)) * DEG;
}
const TRJ = (() => {
  const dt = 0.02, N = Math.ceil(100 / dt) + 2;
  const X = new Float64Array(N), Y = new Float64Array(N), A = new Float64Array(N);
  let x = 0, y = 0;
  for (let i = 0; i < N; i++) {
    const m = i * dt, a = pitchAt(m);
    X[i] = x; Y[i] = y; A[i] = a;
    const v = visSpeed(m + dt / 2), am = pitchAt(m + dt / 2);

function drawVignette() {
  if (!VIG || VIG.width !== Math.ceil(W / 4)) {
    VIG = makeCanvas(W / 4, H / 4); const g = VIG.getContext('2d');
    const gr = g.createRadialGradient(VIG.width / 2, VIG.height / 2, Math.min(VIG.width, VIG.height) * 0.35, VIG.width / 2, VIG.height / 2, Math.hypot(VIG.width, VIG.height) * 0.62);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.42)');
    g.fillStyle = gr; g.fillRect(0, 0, VIG.width, VIG.height);
  }
  setScreen(); ctx.drawImage(VIG, 0, 0, W, H);
}
function render(m, dt) {
  const t = ST.t, h = altAt(m), pose = stackPose(m), rise = cam._rise || 0;
  setScreen(); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const t1 = thrust1(m);
  const groundness = 1 - smooth(25, 260, pose.by);
  const fl = t1 * groundness * (1 + 0.18 * noiseFlick(t, 11) * (RM ? 0.3 : 1));
  drawSky(h, rise);
  drawStars(h, t);
  const E = drawEarth(h, m, ST.scroll);
  drawFarLand(rise, t, fl);
  drawDawnClouds(rise, dt, h, fl);
  drawGroundWorld(m, t, t1 * (1 - smooth(20, 90, pose.by)) * (1 + 0.2 * noiseFlick(t, 13)));
  drawFloodBeams(1 - smooth(60, 400, rise));
  setScreen();
  drawAscentClouds(false);
  drawParticles(false);
  drawPlumes(m, pose, h, t);
  drawRocket(m, pose, h, t, fl);
  if (pose.by < 120) drawClamps(m);
  drawCondensation(pose, condK(m), t);
  drawParticles(true);
  setScreen();
  drawAscentClouds(true);
  drawFlameLight(fl);
  // 穿云时画面朦胧
  const hz = ST.running ? cloudHaze(cam.y) : 0;
  if (hz > 0.01) { ctx.fillStyle = `rgba(232,238,246,${0.3 * hz})`; ctx.fillRect(0, 0, W, H); }
  // 贴地薄雾
  const fogK = 1 - smooth(20, 160, rise);
  if (fogK > 0.01) {
    const y0 = SY(0) - H * 0.12;
    const fg = ctx.createLinearGradient(0, y0, 0, SY(0) + 10);
    fg.addColorStop(0, 'rgba(150,140,175,0)'); fg.addColorStop(1, `rgba(150,140,175,${0.28 * fogK})`);
    ctx.fillStyle = fg; ctx.fillRect(0, y0, W, SY(0) + 10 - y0);
  }
  drawFlare(E);
  drawVignette();
}

/* =====================================================================
   界面
   ===================================================================== */
const pad2 = (n) => String(n).padStart(2, '0');
function fmtMet(m) {
  const a = Math.abs(m), mm = Math.floor(a / 60), ss = a - mm * 60;
  return `${m < 0 ? 'T-' : 'T+'}${pad2(mm)}:${ss.toFixed(1).padStart(4, '0')}`;
}
function put(key, el, val) { if (ST.ui[key] !== val) { ST.ui[key] = val; el.textContent = val; } }
function updateHUD(m) {
  const h = altAt(m), v = velAt(m);
  put('met', ui.met, fmtMet(m));
  put('alt', ui.alt, h.toFixed(h < 100 ? 2 : 1));
  put('vel', ui.vel, v.toFixed(v < 1 ? 3 : 2));
  put('phase', ui.phase, ST.running ? phaseAt(m) : '待命');
  put('status', ui.status, !ST.running ? '待命' : ST.finished ? '入轨成功' : m < 0 ? '倒计时' : '飞行中');
  const showCount = ST.running && m >= -10 && m < 1.3;
  ui.count.classList.toggle('show', showCount);
  if (showCount) put('count', ui.count, m < 0 ? `T-${Math.ceil(-m - 1e-6)}` : '起飞');
}
function finish() {
  ST.finished = true;
  const m = EV.success;
  ui.fAlt.textContent = altAt(m).toFixed(1);
  ui.fVel.textContent = velAt(m).toFixed(2);
  ui.fMet.textContent = fmtMet(m).replace(/\.\d$/, '');
  ui.controls.classList.add('hide');
  ui.done.classList.add('show');
  setEvent('入轨成功 · 任务圆满完成');
  setTimeout(() => ui.again.focus({ preventScroll: true }), 300);
}
function ignite() {
  if (ST.running) return;
  audioInit();
  ST.running = true; ST.tc = 0; ST.prevM = -T0 - 0.001;
  ui.ignite.disabled = true; ui.ignite.textContent = '发射中';
  ui.mute.focus({ preventScroll: true });
}
function reset() {
  PS.length = 0; trailN = 0;
  Object.assign(ST, { running: false, finished: false, tc: 0, prevM: -99, acc: {}, s1: null, halves: null, scroll: 0 });
  ST.ui = {};
  ui.done.classList.remove('show');
  ui.controls.classList.remove('hide');
  ui.ignite.disabled = false; ui.ignite.textContent = '点火';
  setEvent('推进剂加注完毕 · 天气许可发射');
  orbitPad(false);
  ui.ignite.focus({ preventScroll: true });
}

/* =====================================================================
   主循环：按真实经过的时间推进
   ===================================================================== */
function resize() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  portrait = H > W * 1.1;
  DPR = Math.max(0.75, Math.min(2, window.devicePixelRatio || 1) * quality);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  Z0 = (0.56 * H) / ROCKET_LEN;
  buildScreenCaches();
}
let last = performance.now(), slow = 0, fast = 0;
function adapt(dt) {
  if (dt > 0.034) slow += dt; else slow = Math.max(0, slow - dt * 0.5);
  if (dt < 0.02) fast += dt; else fast = 0;
  if (slow > 1.5 && quality > 0.55) { quality -= 0.15; pBudget = Math.max(0.55, pBudget - 0.15); slow = 0; resize(); }
  if (fast > 8 && quality < 1) { quality = Math.min(1, quality + 0.15); fast = 0; resize(); }
}
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 1 / 60;
  if (dt > 0.25) dt = 0.25;
  ST.t += dt;
  if (ST.running) ST.tc += dt;
  const m = missionTime();
  if (ST.running) { fireEvents(ST.prevM, m); ST.prevM = m; }
  const pose = stackPose(m), h = altAt(m);
  updateCamera(m, pose);
  emitters(m, dt, pose, h);
  updateParticles(dt);
  updateBodies(m, dt);
  ST.scroll += dt * (velAt(m) / 7.67) * Math.max(60, W * 0.05);
  render(m, dt);
  updateHUD(m);
  audioUpdate(m, h);
  adapt(dt);
  requestAnimationFrame(frame);
}

buildSprites();
buildFlames();
buildRocket();
resize();
window.addEventListener('resize', resize);
ui.ignite.addEventListener('click', ignite);
ui.again.addEventListener('click', reset);
ui.mute.addEventListener('click', () => setMuted(!AU.muted));
setTimeout(buildEarth, 60);
requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
