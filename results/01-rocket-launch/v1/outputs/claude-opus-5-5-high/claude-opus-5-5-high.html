<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>晨线-07 · 发射直播</title>
<style>
  :root {
    --ink: #eef3fa;
    --muted: #9fb0c6;
    --panel: rgba(8, 13, 24, 0.58);
    --line: rgba(160, 190, 230, 0.18);
    --accent: #ff7a2f;
    --ok: #57e3a1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #05070d; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  .topbar {
    position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; letter-spacing: .12em;
    padding: 4px 9px; border-radius: 4px; background: rgba(200, 30, 30, .85);
  }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.4s ease-in-out infinite; }
  .mission { font-size: 13px; color: var(--muted); letter-spacing: .04em; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .mission b { color: var(--ink); font-weight: 650; }
  .status {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .status::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #f2c14e; vertical-align: 1px; }
  .status.go::before { background: var(--accent); }
  .status.done::before { background: var(--ok); }

  .telemetry {
    position: absolute; right: max(14px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top));
    width: 236px; padding: 12px 14px 10px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    opacity: 0; transform: translateY(-6px); transition: opacity .6s, transform .6s;
    font-variant-numeric: tabular-nums;
  }
  .telemetry.show { opacity: 1; transform: none; }
  .telemetry h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .18em; color: var(--muted); }
  .telemetry dl { margin: 0; display: grid; grid-template-columns: auto 1fr; row-gap: 6px; column-gap: 12px; align-items: baseline; }
  .telemetry dt { font-size: 12px; color: var(--muted); }
  .telemetry dd { margin: 0; text-align: right; font-size: 17px; font-weight: 650; letter-spacing: .02em; white-space: nowrap; }
  .telemetry dd small { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .telemetry dd.phase { font-size: 14px; color: #ffd2a8; }

  .caption {
    position: absolute; left: 50%; top: calc(max(12px, env(safe-area-inset-top)) + 48px); transform: translateX(-50%);
    padding: 7px 16px; border-radius: 6px; font-size: 15px; font-weight: 600; letter-spacing: .05em;
    background: rgba(6, 10, 20, .55); border-left: 3px solid var(--accent);
    opacity: 0; transition: opacity .45s; white-space: nowrap; pointer-events: none;
  }
  .caption.show { opacity: 1; }

  .countdown {
    position: absolute; left: max(18px, 6vw); top: 34%; pointer-events: none;
    opacity: 0; transition: opacity .4s; font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 18px rgba(0,0,0,.55);
  }
  .countdown.show { opacity: 1; }
  .countdown small { display: block; font-size: 13px; letter-spacing: .3em; color: var(--muted); margin-bottom: 2px; }
  .countdown b { display: block; font-size: clamp(46px, 8vw, 104px); font-weight: 800; line-height: 1; letter-spacing: .02em; }
  .countdown b.tick { animation: tick .9s ease-out; }
  @keyframes tick { from { transform: scale(1.18); opacity: .4; } to { transform: none; opacity: 1; } }
  .controls {
    position: absolute; left: 0; right: 0; bottom: max(26px, calc(env(safe-area-inset-bottom) + 14px));
    display: flex; justify-content: center; pointer-events: none;
  }
  .ignite {
    pointer-events: auto; cursor: pointer;
    min-width: 168px; height: 64px; padding: 0 34px; border-radius: 999px; border: 0;
    font: inherit; font-size: 22px; font-weight: 800; letter-spacing: .3em; text-indent: .3em; color: #fff;
    background: radial-gradient(120% 140% at 50% 0%, #ff9d4d 0%, #f2541b 55%, #b8300c 100%);
    box-shadow: 0 0 0 4px rgba(255, 122, 47, .22), 0 10px 30px rgba(255, 90, 20, .45), inset 0 1px 0 rgba(255,255,255,.35);
    animation: glow 2.2s ease-in-out infinite;
    transition: transform .15s, opacity .5s, filter .5s;
  }
  .ignite:hover { transform: translateY(-1px) scale(1.02); }
  .ignite:active { transform: scale(.98); }
  .ignite:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .ignite.gone { opacity: 0 !important; visibility: hidden; transition: opacity .8s, visibility 0s .8s; }
  .ignite:disabled {
    cursor: default; animation: none; opacity: .38; filter: grayscale(.85);
    transform: none; letter-spacing: .12em; text-indent: .12em; font-size: 16px;
  }

  .mute {
    position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(26px, calc(env(safe-area-inset-bottom) + 14px));
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: grid; place-items: center;
  }
  .mute svg { width: 22px; height: 22px; }
  .mute .off { display: none; }
  .mute[aria-pressed="true"] .on { display: none; }
  .mute[aria-pressed="true"] .off { display: block; }

  .result {
    position: absolute; left: 50%; bottom: max(24px, calc(env(safe-area-inset-bottom) + 14px)); transform: translate(-50%, 14px);
    width: min(360px, calc(100vw - 32px)); padding: 22px 22px 20px; border-radius: 14px; text-align: center;
    background: rgba(8, 13, 24, .72); border: 1px solid rgba(120, 220, 170, .35);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    opacity: 0; visibility: hidden; transition: opacity .8s, transform .8s, visibility 0s .8s;
    font-variant-numeric: tabular-nums;
  }
  .result.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity .8s, transform .8s; }
  .result .badge { font-size: 12px; letter-spacing: .2em; color: var(--ok); }
  .result h1 { margin: 6px 0 14px; font-size: 30px; letter-spacing: .12em; }
  .result .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .result .stats div { padding: 8px 4px; border-radius: 8px; background: rgba(255,255,255,.05); }
  .result .stats span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .result .stats b { font-size: 16px; }
  .relaunch {
    cursor: pointer; border: 0; border-radius: 999px; padding: 12px 30px;
    font: inherit; font-size: 16px; font-weight: 700; letter-spacing: .15em; color: #fff;
    background: linear-gradient(180deg, #ff8a3d, #e2541b);
    box-shadow: 0 8px 22px rgba(255, 100, 30, .35);
  }
  .relaunch:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 4px rgba(255,122,47,.22), 0 10px 30px rgba(255,90,20,.45), inset 0 1px 0 rgba(255,255,255,.35); }
    50% { box-shadow: 0 0 0 10px rgba(255,122,47,.10), 0 10px 40px rgba(255,90,20,.6), inset 0 1px 0 rgba(255,255,255,.35); }
  }

  @media (max-width: 640px) {
    .topbar { right: 14px; gap: 8px; }
    .mission { font-size: 12px; }
    .telemetry {
      left: 12px; right: 12px; width: auto; top: calc(max(12px, env(safe-area-inset-top)) + 34px);
      padding: 8px 12px; border-radius: 9px;
    }
    .telemetry h2 { display: none; }
    .telemetry dl { grid-template-columns: auto 1fr auto 1fr; column-gap: 8px; row-gap: 4px; }
    .telemetry dt { font-size: 11px; }
    .telemetry dd { font-size: 14px; }
    .telemetry dd.phase { font-size: 13px; }
    .caption { font-size: 13px; top: calc(max(12px, env(safe-area-inset-top)) + 118px); }
    .ignite { height: 58px; min-width: 150px; font-size: 20px; }
    .countdown { top: 30%; left: 16px; }
  }
  @media (max-width: 640px) {
    .result { bottom: calc(env(safe-area-inset-bottom) + 84px); }
  }
  @media (max-height: 460px) {
    .ignite { height: 50px; font-size: 18px; }
    .controls, .mute { bottom: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ignite, .live i, .countdown b.tick { animation: none; }
    .telemetry, .result, .caption { transition-duration: .01s; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="火箭发射直播画面"></canvas>
<div class="hud">
  <div class="topbar">
    <span class="live"><i></i>直播</span>
    <span class="mission"><b>晨线-07</b> · DAWNLINE-07 任务</span>
    <span class="status" id="status" role="status">待命</span>
  </div>

  <section class="telemetry" id="telemetry" aria-label="遥测">
    <h2>遥测 TELEMETRY</h2>
    <dl>
      <dt>任务时间</dt><dd id="tTime">T-00:00:10</dd>
      <dt>高度</dt><dd><span id="tAlt">0.00</span><small>km</small></dd>
      <dt>速度</dt><dd><span id="tVel">0.00</span><small>km/s</small></dd>
      <dt>阶段</dt><dd class="phase" id="tPhase">待命</dd>
    </dl>
  </section>

  <div class="caption" id="caption" aria-live="polite"></div>
  <div class="countdown" id="countdown" aria-hidden="true"><small>倒计时</small><b id="cdNum">10</b></div>

  <div class="controls">
    <button class="ignite" id="ignite" type="button">点火</button>
  </div>

  <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="静音">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>
  </button>

  <section class="result" id="result" aria-live="polite">
    <div class="badge">ORBIT ACHIEVED</div>
    <h1>入轨成功</h1>
    <div class="stats">
      <div><span>高度</span><b id="rAlt">400.0 km</b></div>
      <div><span>速度</span><b id="rVel">7.66 km/s</b></div>
      <div><span>任务时间</span><b id="rTime">T+00:01:06</b></div>
    </div>
    <button class="relaunch" id="relaunch" type="button">重新发射</button>
  </section>
</div>

<script>
(() => {
'use strict';

/* =========================================================================
   Utilities
   ========================================================================= */
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const bell = (x, a, b) => smooth(a, a + (b - a) * 0.3, x) * (1 - smooth(a + (b - a) * 0.6, b, x));
const mixc = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const NP = new Float32Array(1024);
{ const r = mulberry32(7); for (let i = 0; i < 1024; i++) NP[i] = r() * 2 - 1; }
function noise1(x) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  const a = NP[i & 1023], b = NP[(i + 1) & 1023];
  return a + (b - a) * u;
}
function hash2(x, y, s) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function noise2(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, s, oct) {
  let v = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { v += a * noise2(x * f, y * f, s + i * 17); f *= 2.03; a *= 0.5; }
  return v;
}
// monotone cubic interpolation (keeps telemetry smooth and never overshooting)
function pchip(xs, ys) {
  const n = xs.length, d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) {
    if (d[i - 1] * d[i] <= 0) m[i] = 0;
    else {
      const h0 = xs[i] - xs[i - 1], h1 = xs[i + 1] - xs[i];
      const w1 = 2 * h1 + h0, w2 = h1 + 2 * h0;
      m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
    }
  }
  return (x) => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

/* =========================================================================
   Mission timeline (mission time mt: seconds relative to T-0)
   ========================================================================= */
const TL = {
  start: -10, deluge: -7, arms: [-5.6, -4.7, -3.8], ign: -3, full: -1.2, lift: 0,
  maxQ0: 19, maxQ1: 25, meco: 33.5, sep: 35, ses: 36.6, fairing: 41.5,
  seco: 50, satSep: 53, panels: 55.5, success: 66,
};
// telemetry, km and km/s; continuous and consistent with the picture
const altKm = pchip(
  [0, 2.5, 6, 10, 16, 22, 28, 33.5, 38, 42, 46, 50, 54, 90],
  [0, 0.006, 0.08, 0.45, 2.6, 11.5, 28, 58, 92, 150, 250, 372, 400, 400.3]);
const velKms = pchip(
  [0, 2.5, 6, 10, 16, 22, 28, 33.5, 35, 36.6, 40, 45, 50, 53, 90],
  [0, 0.006, 0.035, 0.085, 0.2, 0.4, 0.95, 2.15, 2.135, 2.125, 2.95, 5.0, 7.66, 7.66, 7.66]);
const pitchDeg = pchip([0, 7, 12, 20, 28, 34, 41, 50, 60, 90], [0, 0, 5, 20, 38, 53, 67, 80, 86, 88]);
// visual climb speed in world metres per second (heavy start, then fast)
const visSpeed = (t) => 420 * Math.tanh((1.6 * t + 0.45 * t * t) / 420);

const TR = (() => {
  const dt = 1 / 60, n = 120 * 60;
  const X = new Float32Array(n + 1), Y = new Float32Array(n + 1);
  let x = 0, y = 0;
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) * dt, u = visSpeed(t), a = pitchDeg(t) * DEG;
    x += u * Math.sin(a) * dt; y += u * Math.cos(a) * dt;
    X[i + 1] = x; Y[i + 1] = y;
  }
  return { X, Y, dt, n };
})();
function trajAt(t) {
  const f = clamp(t / TR.dt, 0, TR.n - 1e-6), i = Math.floor(f), r = f - i;
  return [lerp(TR.X[i], TR.X[i + 1], r), lerp(TR.Y[i], TR.Y[i + 1], r)];
}

/* =========================================================================
   Rocket geometry (metres; local y up from the nozzle exit plane)
   ========================================================================= */
const R = 2.9, RF = 3.06;              // body / fairing radius: 70 m tall, 5.8 m wide -> ~12:1
const Y = { bell: 2.4, skirt: 5.2, s1top: 41.4, inter: 48.2, s2top: 58.0, adapter: 58.6, fCyl: 63.4, nose: 70 };
const BASE_Y = 1.7;                     // nozzle exit above pad deck while on the mount
const STACK_OUTLINE = (() => {
  const pts = [[-2.7, 0], [-R, Y.bell], [-R, Y.s2top], [-RF, Y.adapter], [-RF, Y.fCyl]];
  for (let i = 1; i <= 14; i++) { const t = i / 14; pts.push([-ogive(t), Y.fCyl + t * (Y.nose - Y.fCyl)]); }
  const right = pts.slice().reverse().map(([x, y]) => [-x, y]);
  return pts.concat(right);
})();
function ogive(t) { return Math.max(0.0, RF * Math.pow(Math.cos(t * Math.PI / 2), 0.72)); }

/* =========================================================================
   Canvas / sizing
   ========================================================================= */
const cvs = document.getElementById('scene');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1, S0 = 7, PRE_AX = 0.58;
let sprites = null, padSprite = null, towerSprite = null, mastSprite = null;
let farClouds = [];

const reduceMQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
let reduced = !!(reduceMQ && reduceMQ.matches);
if (reduceMQ) {
  const onChange = (e) => { reduced = e.matches; };
  reduceMQ.addEventListener ? reduceMQ.addEventListener('change', onChange) : reduceMQ.addListener(onChange);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  S0 = Math.min(H * 0.56 / 70, W * 0.6 / 20);
  PRE_AX = W < H ? 0.6 : 0.56;
  buildSprites();
  buildClouds();
}
let resizeTimer = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });

/* =========================================================================
   Rocket sprites: albedo -> cylindrical shading (multiply) -> specular
   ========================================================================= */
function shadeColor(xn) {
  // xn in [-1,1] across the cylinder; light from the right, slightly in front
  const phi = Math.asin(clamp(xn, -1, 1));
  const nx = Math.sin(phi), nz = Math.cos(phi);
  const lx = 0.82, lz = 0.57;
  const diff = Math.max(0, nx * lx + nz * lz);
  const amb = [0.27, 0.31, 0.45];
  const sun = [0.80, 0.72, 0.60];
  const rim = Math.pow(Math.max(0, nx), 6) * 0.12 - Math.pow(Math.max(0, -nx), 4) * 0.08;
  return [255 * clamp(amb[0] + sun[0] * diff + rim, 0, 1), 255 * clamp(amb[1] + sun[1] * diff + rim, 0, 1), 255 * clamp(amb[2] + sun[2] * diff + rim * 0.8, 0, 1)];
}
function shadeGradient(g, r) {
  const gr = g.createLinearGradient(-r, 0, r, 0);
  for (let i = 0; i <= 24; i++) { const xn = -1 + 2 * i / 24; gr.addColorStop(i / 24, rgb(shadeColor(xn))); }
  return gr;
}
function specGradient(g, r) {
  const gr = g.createLinearGradient(-r, 0, r, 0);
  gr.addColorStop(0, 'rgba(255,255,255,0)');
  gr.addColorStop(0.62, 'rgba(255,255,255,0)');
  gr.addColorStop(0.72, 'rgba(255,252,246,0.55)');
  gr.addColorStop(0.76, 'rgba(255,252,246,0.75)');
  gr.addColorStop(0.81, 'rgba(255,252,246,0.25)');
  gr.addColorStop(0.9, 'rgba(255,255,255,0.05)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  return gr;
}
function makePart(spec) {
  const k = Math.max(3, S0 * DPR * 1.15), pad = 6;
  const w = Math.ceil(spec.hw * 2 * k + pad * 2), h = Math.ceil((spec.y1 - spec.y0) * k + pad * 2);
  const setM = (g) => g.setTransform(k, 0, 0, -k, w / 2, spec.y1 * k + pad);
  const cv = mkCanvas(w, h), g = cv.getContext('2d');

function vText(g, text, x, y, size, color, weight = 800, spacing = 0.12) {
  // text running top-to-bottom along the body (local coords are y-up)
  g.save();
  g.translate(x, y); g.scale(1, -1); g.rotate(Math.PI / 2);
  g.font = `${weight} ${size}px system-ui, "Segoe UI", Arial, sans-serif`;
  g.fillStyle = color; g.textBaseline = 'middle';
  let cx = 0;
  for (const ch of text) { g.fillText(ch, cx, 0); cx += g.measureText(ch).width + size * spacing; }
  g.restore();
}
function hText(g, text, x, y, size, color, weight = 700) {
  g.save(); g.translate(x, y); g.scale(1, -1);
  g.font = `${weight} ${size}px system-ui, "Segoe UI", Arial, sans-serif`;

}
function bellPath(g, cx, yb, h, rt, rb) {
  g.beginPath();
  g.moveTo(cx - rt, yb + h);
  g.bezierCurveTo(cx - rt * 1.05, yb + h * 0.55, cx - rb * 0.92, yb + h * 0.25, cx - rb, yb);
  g.lineTo(cx + rb, yb);
  g.bezierCurveTo(cx + rb * 0.92, yb + h * 0.25, cx + rt * 1.05, yb + h * 0.55, cx + rt, yb + h);
  g.closePath();
}
function paintBell(g, cx, yb, h, rt, rb, dark) {
  bellPath(g, cx, yb, h, rt, rb);
  const gr = g.createLinearGradient(cx - rb, 0, cx + rb, 0);
  const k = dark ? 0.6 : 1;
  gr.addColorStop(0, rgb([20 * k, 20 * k, 22 * k]));
  gr.addColorStop(0.55, rgb([48 * k, 46 * k, 48 * k]));
  gr.addColorStop(0.75, rgb([96 * k, 90 * k, 86 * k]));
  gr.addColorStop(1, rgb([26 * k, 24 * k, 26 * k]));
  g.fillStyle = gr; g.fill();
  g.strokeStyle = rgb([120 * k, 112 * k, 104 * k], 0.8); g.lineWidth = 0.07;
  g.beginPath(); g.moveTo(cx - rb, yb + 0.04); g.lineTo(cx + rb, yb + 0.04); g.stroke();
  g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 0.04;
  for (let i = 1; i < 4; i++) { const yy = yb + h * i / 4, rr = lerp(rb, rt, i / 4); g.beginPath(); g.moveTo(cx - rr, yy); g.lineTo(cx + rr, yy); g.stroke(); }
}

function fairingPath(g, side) {

  g.beginPath();

  g.lineTo(side * RF, Y.fCyl);
  for (let i = 1; i <= 24; i++) { const t = i / 24; g.lineTo(side * ogive(t), Y.fCyl + t * (Y.nose - Y.fCyl)); }
  g.lineTo(0, Y.nose);
  g.closePath();
}

    g.fillStyle = 'rgba(70,74,82,0.85)'; g.fillRect(side > 0 ? 0 : -0.06, Y.adapter, 0.06, Y.nose - Y.adapter);

      g.strokeStyle = '#f4f1e8'; g.lineWidth = 0.06;

/* =========================================================================

function worldSprite(x0, x1, y0, y1, paint) {
  const k = Math.max(2, S0 * DPR), pad = 2;

  const cv = mkCanvas(w, h), g = cv.getContext('2d');
  g.setTransform(k, 0, 0, -k, pad - x0 * k, y1 * k + pad);
  paint(g, k);
  return { cv, k, pad, x0, x1, y0, y1, w, h };
}

    g.fillStyle = sc; g.fillRect(-22, -20, 44, 30);

/* =========================================================================
   Clouds (pre-rendered, three lighting variants)
   ========================================================================= */
function makeCloudSprite(seed, wPx, hPx) {
  // density field: a few soft elliptical lobes, broken up with fractal noise, flattish base

  for (let y = 0; y < hPx; y++) {
    for (let x = 0; x < wPx; x++) {
      const nx = x / wPx, ny = y / hPx;
      let e = 0;
      for (const [cx, cy, rx, ry] of lobes) {
        const dx = (nx - cx) / rx, dy = (ny - cy) / ry;
        e = Math.max(e, 1 - dx * dx - dy * dy);
      }
      e *= 1 - smooth(0.6, 0.78, ny) * 0.85;
      const nz = fbm(nx * 7 + ox, ny * 2.6 + oy, seed, 5);
      const win = smooth(0, 0.14, nx) * smooth(1, 0.86, nx) * smooth(0, 0.2, ny) * smooth(1, 0.8, ny);
      den[y * wPx + x] = clamp((e + (nz - 0.5) * 0.95) * 1.7, 0, 1) * win;
      tex[y * wPx + x] = fbm(nx * 18 + oy, ny * 7 + ox, seed + 3, 3) - 0.5;
    }
  }
  const variant = (shadow, lit, rim, rimK, under) => {
    const c = mkCanvas(wPx, hPx), g = c.getContext('2d');
    const img = g.createImageData(wPx, hPx), d = img.data;
    const lx = 5, ly = under ? 5 : -4;
    for (let y = 0; y < hPx; y++) {
      for (let x = 0; x < wPx; x++) {
        const i = y * wPx + x, a = den[i];
        if (a <= 0.003) continue;
        const sx = clamp(x + lx, 0, wPx - 1), sy = clamp(y + ly, 0, hPx - 1);
        const occl = den[sy * wPx + sx];

        let lightK = clamp(0.72 + vert * 0.9 - (occl - a) * 1.6 + tex[i] * 0.7, 0, 1);

      }
    }
    g.putImageData(img, 0, 0);
    return c;
  };
  return {
    w: wPx, h: hPx,
    dawn: variant([62, 64, 92], [176, 150, 172], [255, 186, 140], 1.1, false),
    day: variant([158, 170, 192], [255, 255, 255], [255, 255, 255], 0.4, false),
    fire: variant([150, 70, 40], [255, 168, 96], [255, 200, 140], 0.8, true),
  };
}

  // distant dawn clouds: placed by their initial screen position, then given world coordinates
  const cam0 = preCamera(), [p0x, p0y] = camPos(cam0);

   Earth texture for the orbital view
   ========================================================================= */
let earthTex = null, cityLights = [];
function buildEarth() {
  const w = 1024, h = 300, c = mkCanvas(w, h), g = c.getContext('2d');
  const img = g.createImageData(w, h), d = img.data;
  const lights = [];
  const seam = (fn, x, y) => { const t = x / w; return lerp(fn(x, y), fn(x - w, y), t); };
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const land = seam((xx, yy) => fbm(xx / 120, yy / 70, 3, 4), x, y);
      const biome = seam((xx, yy) => fbm(xx / 60, yy / 40, 9, 3), x, y);
      const cl = seam((xx, yy) => fbm(xx / 70, yy / 22, 21, 4), x, y);

        if (land > 0.66) col = mixc(col, [120, 104, 80], 0.5);

      const ca = clamp((cl - 0.5) * 3.2, 0, 0.95);
      col = mixc(col, [242, 246, 252], ca);

      d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;

    const wbuf = ac.createBuffer(1, len, ac.sampleRate), wch = wbuf.getChannelData(0);

  sepS1: null, sepFair: null, flash: 0, earthU: 0.2, captionUntil: 0, shown: false,
};

function resetMission() {
  S.running = false; S.mt = TL.start; S.prevMt = TL.start;
  S.parts.length = 0; S.trail.length = 0; S.lastTrail = -99; S.emitAcc = {};
  S.sepS1 = null; S.sepFair = null; S.flash = 0; S.shown = false;
  ui.ignite.disabled = false; ui.ignite.textContent = '点火'; ui.ignite.classList.remove('gone');
  ui.status.textContent = '待命'; ui.status.className = 'status';
  ui.tel.classList.remove('show');
  ui.result.classList.remove('show');
  ui.caption.classList.remove('show');
  if (audio.ac) audioUpdate(0, 0, 1, 0);
  updateTelemetry(true);
}
ui.ignite.addEventListener('click', () => {
  if (S.running) return;
  initAudio();
  S.running = true; S.mt = TL.start; S.prevMt = TL.start - 0.001;
  ui.ignite.disabled = true; ui.ignite.textContent = '发射程序进行中';
  ui.status.textContent = '发射中'; ui.status.className = 'status go';
  ui.tel.classList.add('show');
});
ui.relaunch.addEventListener('click', () => { resetMission(); ui.ignite.focus({ preventScroll: true }); });
ui.mute.addEventListener('click', () => setMuted(!audio.muted));

/* =========================================================================
   Particles
   ========================================================================= */
const MAX_PARTS = 1100;
function spawn(p) { if (S.parts.length < MAX_PARTS) S.parts.push(p); }
function emit(key, rate, dt, fn) {
  S.emitAcc[key] = (S.emitAcc[key] || 0) + rate * dt;
  while (S.emitAcc[key] >= 1) { S.emitAcc[key] -= 1; fn(); }
}
const rnd = Math.random;
function smokeAt(x, y, vx, vy, r0, grow, life, kind, front, alpha) {
  spawn({ x, y, vx, vy, r: r0, grow, life, age: 0, kind, front, a: alpha, v: Math.floor(rnd() * 4), rot: rnd() * TAU, drag: 0.6 });
}

/* =========================================================================
   Derived state for a given mission time
   ========================================================================= */
function engine1(mt) {
  if (mt < TL.ign) return 0;
  if (mt < TL.ign + 0.9) return 0.12 * smooth(TL.ign, TL.ign + 0.3, mt);
  if (mt < TL.meco) return lerp(0.12, 1, smooth(TL.ign + 0.9, TL.full, mt));
  return 1 - smooth(TL.meco, TL.meco + 0.45, mt);
}
function engine2(mt) {
  if (mt < TL.ses) return 0;
  return smooth(TL.ses, TL.ses + 0.6, mt) * (1 - smooth(TL.seco, TL.seco + 0.7, mt));
}
function stackPose(mt) {
  const t = Math.max(0, mt);
  const [x, y] = trajAt(t);
  return { x, y: BASE_Y + y, a: pitchDeg(t) * DEG };
}
function l2w(pose, lx, ly) {
  const c = Math.cos(pose.a), s = Math.sin(pose.a);
  return [pose.x + lx * c + ly * s, pose.y - lx * s + ly * c];
}
function preCamera() {
  return { cx: 0, cy: 0, s: S0, ax: W * PRE_AX, ay: H * 0.8 };
}
function camera(mt, pose) {
  const pre = preCamera();
  // follow: blend target from stack centre to second stage / payload
  const sepK = smooth(TL.sep, TL.sep + 5, mt);
  let tgt = l2w(pose, 0, lerp(30, 53, sepK));
  if (mt > TL.satSep) {
    const sat = satellitePose(mt, pose);
    const k = smooth(TL.satSep, TL.satSep + 8, mt);
    tgt = [lerp(tgt[0], (tgt[0] + sat.x) / 2, k), lerp(tgt[1], (tgt[1] + sat.y) / 2, k)];
  }
  // pull out while the whole stack climbs, push in on the short upper stage, ease back at the end
  const zoom = lerp(1, 0.6, smooth(3, 15, mt)) * lerp(1, 1.75, smooth(TL.sep + 1, TL.sep + 9, mt)) * lerp(1, 0.74, smooth(TL.seco + 1, TL.success + 2, mt));
  const fol = { cx: tgt[0], cy: tgt[1], s: S0 * zoom, ax: W * lerp(0.5, W < H ? 0.46 : 0.42, smooth(10, 40, mt)), ay: H * lerp(0.58, 0.4, smooth(36, 56, mt)) };
  const k = smooth(1.8, 7.5, mt);
  const cam = {
    cx: lerp(pre.cx, fol.cx, k), cy: lerp(pre.cy, fol.cy, k), s: lerp(pre.s, fol.s, k),
    ax: lerp(pre.ax, fol.ax, k), ay: lerp(pre.ay, fol.ay, k),
  };
  if (mt > TL.seco) { cam.ax = lerp(cam.ax, W * 0.5, smooth(TL.seco, TL.success, mt)); cam.ay = lerp(cam.ay, H * 0.34, smooth(TL.seco, TL.success, mt)); }
  return cam;
}
function w2s(cam, x, y) { return [cam.ax + (x - cam.cx) * cam.s, cam.ay - (y - cam.cy) * cam.s]; }
// pinhole projection with the principal point at the screen centre, used for parallax layers
function camPos(cam) { return [cam.cx - (cam.ax - W / 2) / cam.s, cam.cy + (cam.ay - H / 2) / cam.s]; }
function proj(cam, x, y, z) { const [px, py] = camPos(cam); return [W / 2 + (x - px) * cam.s / z, H / 2 - (y - py) * cam.s / z]; }
// the chase camera pitches up as it climbs, so distant layers sink out of the frame
const farTilt = (h) => H * 0.7 * smooth(0.25, 13, h);
function satellitePose(mt, pose) {
  const tau = Math.max(0, mt - TL.satSep);
  const d = 0.55 * tau + 0.02 * tau * tau;
  const [x, y] = l2w(pose, 0.25 * tau, 61.6 + d);
  return { x, y, a: pose.a - 2.2 * DEG * tau, tau };
}

/* =========================================================================
   Update
   ========================================================================= */
const crossed = (t) => S.prevMt < t && S.mt >= t;
const CAPTIONS = [
  [TL.deluge, 'T-7  发射台喷水降噪系统启动'],
  [TL.arms[0], '脐带臂摆开'],
  [TL.ign, '主发动机点火'],
  [TL.lift, '起飞！'],
  [7, '离开塔架 · 开始程序转弯'],
  [TL.maxQ0 + 1, '通过最大动压区 Max-Q'],
  [TL.meco, '一级发动机关机'],
  [TL.sep, '级间分离'],
  [TL.ses, '二级发动机点火'],
  [TL.fairing, '整流罩分离'],
  [TL.seco, '二级关机 · 进入近地轨道'],
  [TL.satSep, '星箭分离'],
  [TL.panels, '太阳能电池板展开'],
];
function showCaption(text) {
  ui.caption.textContent = text; ui.caption.classList.add('show');
  S.captionUntil = S.clock + 3.2;
}

function update(dt) {
  S.clock += dt;
  if (S.running) { S.prevMt = S.mt; S.mt += dt; }
  const mt = S.mt;
  const pose = stackPose(mt);
  const h = altKm(Math.max(0, mt));
  const rho = Math.exp(-h / 7.5);

  if (S.running) {
    for (const [t, text] of CAPTIONS) if (crossed(t)) showCaption(text);
    if (audio.ac) {
      for (let i = 10; i >= 1; i--) if (crossed(-i)) beep(i <= 3 ? 1180 : 880, 0.14);
      if (crossed(0)) beep(1560, 0.5, 0.2);
      if (crossed(TL.sep)) bang(0.7, 60);
      if (crossed(TL.ses)) bang(0.35, 110);
      if (crossed(TL.fairing)) bang(0.4, 90);
      if (crossed(TL.satSep)) bang(0.18, 140);
      for (const t of TL.arms) if (crossed(t)) bang(0.12, 160);
    }
    if (crossed(1)) ui.ignite.classList.add('gone');
    if (crossed(TL.sep)) {
      const p = stackPose(TL.sep);
      S.sepS1 = { t0: TL.sep, pose: p };
      S.flash = 1;
      for (let i = 0; i < 26; i++) {
        const [x, y] = l2w(p, (rnd() - 0.5) * 2 * R, Y.s1top + 6.5);
        smokeAt(x, y, (rnd() - 0.5) * 14, (rnd() - 0.5) * 14, 0.8, 2.5, 1.6 + rnd(), 'white', true, 0.45);
      }
    }
    if (crossed(TL.fairing)) {
      S.sepFair = { t0: TL.fairing };
      for (let i = 0; i < 20; i++) {
        const [x, y] = l2w(pose, (rnd() < 0.5 ? -1 : 1) * RF, Y.adapter + rnd() * 10);
        smokeAt(x, y, (rnd() - 0.5) * 8, (rnd() - 0.5) * 8, 0.5, 1.6, 1.2 + rnd(), 'white', true, 0.35);
      }
    }
    for (const t of TL.arms) if (crossed(t)) {
      const ay = [57, 44.5, 30][TL.arms.indexOf(t)];
      for (let i = 0; i < 18; i++) smokeAt(-R - 0.5 + rnd(), ay + (rnd() - 0.5) * 2, -3 - rnd() * 5, -1 + rnd() * 2, 0.6, 1.8, 2 + rnd() * 1.5, 'white', true, 0.5);
    }
  }
  S.flash = Math.max(0, S.flash - dt * 2.5);

  const e1 = engine1(mt), e2 = engine2(mt);
  const baseH = pose.y; // nozzle height above deck
  // LOX boil-off vapour while fuelled on the pad
  if (mt < 0.5) {
    emit('lox', 9, dt, () => {
      const side = rnd() < 0.6 ? 1 : -1;
      const ly = rnd() < 0.7 ? 24 + rnd() * 15 : 49 + rnd() * 4;
      const [x, y] = l2w(pose, side * (R + 0.1), ly);
      smokeAt(x, y, side * (0.5 + rnd() * 1.2), -0.8 - rnd() * 0.8, 0.5, 1.7, 2.4 + rnd() * 1.8, 'white', rnd() < 0.5, 0.3);
    });
  }
  // water deluge steam from the deck
  if (mt > TL.deluge && mt < 8) {
    const k = smooth(TL.deluge, TL.deluge + 1.5, mt) * (1 - smooth(4, 8, mt));
    emit('deluge', 34 * k, dt, () => {
      const side = rnd() < 0.5 ? -1 : 1;
      smokeAt(side * (4 + rnd() * 9), -0.5 + rnd() * 1.5, side * (2 + rnd() * 6), 1 + rnd() * 3, 1.2, 2.4, 5 + rnd() * 3, 'white', rnd() < 0.55, 0.4);
    });
  }
  // exhaust hitting the trench and deck
  const ground = e1 * (1 - smooth(18, 70, baseH));
  if (ground > 0.02) {
    emit('trench', 46 * ground, dt, () => {
      const side = rnd() < 0.5 ? -1 : 1;
      smokeAt(side * (19 + rnd() * 2), -4 + rnd() * 1.5, side * (18 + rnd() * 26), 2 + rnd() * 6, 2.5, 5 + rnd() * 3, 7 + rnd() * 5, rnd() < 0.5 ? 'gray' : 'white', rnd() < 0.6, 0.55);
    });
    emit('base', 34 * ground * smooth(TL.ign + 0.8, TL.lift, mt), dt, () => {
      const side = rnd() < 0.5 ? -1 : 1;
      smokeAt(side * (2 + rnd() * 8), 0.5 + rnd() * 2, side * (6 + rnd() * 14), 3 + rnd() * 8, 2.2, 4 + rnd() * 3, 6 + rnd() * 5, rnd() < 0.4 ? 'gray' : 'white', rnd() < 0.7, 0.5);
    });
  }
  // ignition sparks
  if (mt > TL.ign && mt < TL.ign + 1.4) {
    emit('spark', 60, dt, () => {
      const [x, y] = l2w(pose, (rnd() - 0.5) * 4, -0.2);
      spawn({ x, y, vx: (rnd() - 0.5) * 30, vy: -2 - rnd() * 10, r: 0.12, grow: 0, life: 0.5 + rnd() * 0.6, age: 0, kind: 'spark', front: true, a: 1, v: 0, drag: 0.2 });
    });
  }
  // exhaust trail in the air
  if (e1 > 0.3 && mt > 0.4 && h < 48) {
    const step = 0.05;
    if (mt - S.lastTrail >= step) {
      S.lastTrail = mt;
      const [x, y] = l2w(pose, 0, -2);
      S.trail.push({ x, y, t: mt, rho, w: 1 + 2.2 * rho });
    }
  }
  // advance particles
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const p = S.parts[i];
    p.age += dt;
    if (p.age >= p.life) { S.parts.splice(i, 1); continue; }
    const drag = Math.exp(-p.drag * dt * (p.kind === 'spark' ? 1 : 1.6));
    p.vx *= drag; p.vy *= drag;
    if (p.kind === 'spark') p.vy -= 9.8 * dt; else p.vy += 0.4 * dt;
    p.x += (p.vx + 1.2) * dt; p.y += p.vy * dt;
    p.r += p.grow * dt * Math.exp(-p.age * 0.25);
  }
  // drop very old trail
  while (S.trail.length && mt - S.trail[0].t > 60) S.trail.shift();

  // earth rotates beneath the orbit
  S.earthU += dt * 0.0025 * (0.3 + velKms(Math.max(0, mt)) / 7.66);

  if (S.running && crossed(TL.success)) {
    ui.result.classList.add('show');
    ui.status.textContent = '入轨成功'; ui.status.className = 'status done';
    setTimeout(() => { if (ui.result.classList.contains('show')) ui.relaunch.focus({ preventScroll: true }); }, 900);
  }
  if (S.captionUntil && S.clock > S.captionUntil) { ui.caption.classList.remove('show'); S.captionUntil = 0; }

  // shake
  const near = 1 - smooth(5, 14, mt);
  const maxq = bell(mt, TL.maxQ0, TL.maxQ1);
  let amp = e1 * (mt < 0 ? 0.45 : 1) * near * 7 + e1 * 0.6 + maxq * 5 + S.flash * 4;
  if (reduced) amp *= 0.12;
  S.shake = amp;
  audioUpdate(e1, e2, rho, maxq);
}

/* =========================================================================
   Render
   ========================================================================= */
const SKY = [
  // h(km), top, mid, low (horizon)
  [0, [14, 28, 62], [62, 82, 130], [236, 160, 128]],
  [2, [24, 58, 118], [70, 120, 186], [190, 196, 210]],
  [6, [16, 48, 110], [52, 104, 178], [150, 190, 228]],
  [15, [8, 26, 72], [26, 66, 140], [90, 140, 210]],
  [32, [2, 6, 22], [8, 20, 56], [36, 70, 140]],
  [70, [0, 0, 3], [1, 3, 10], [6, 14, 34]],
];
function skyAt(h) {
  for (let i = 0; i < SKY.length - 1; i++) {
    const [h0, a0, b0, c0] = SKY[i], [h1, a1, b1, c1] = SKY[i + 1];
    if (h <= h1) { const t = smooth(h0, h1, h); return [mixc(a0, a1, t), mixc(b0, b1, t), mixc(c0, c1, t)]; }
  }
  const l = SKY[SKY.length - 1]; return [l[1], l[2], l[3]];
}

function render() {
  const mt = S.mt;
  const pose = stackPose(mt);
  const h = altKm(Math.max(0, mt));
  const rho = Math.exp(-h / 7.5);
  const day = smooth(1.2, 6, h);
  const space = smooth(25, 70, h);
  const cam = camera(mt, pose);
  if (S.shake > 0.01) {
    const t = S.clock;
    cam.ax += noise1(t * 31) * S.shake; cam.ay += noise1(t * 37 + 50) * S.shake;
  }
  S._cam = cam;
  const pre = preCamera();
  const e1 = engine1(mt), e2 = engine2(mt);
  const flick = reduced ? 0.25 : 1;
  const fl = e1 * (0.85 + 0.15 * flick * noise1(S.clock * 23)) * (1 - smooth(25, 120, pose.y));

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  // horizon line position (far layer parallax)
  const tilt = farTilt(h);
  const [hShift, hDy] = layerShift(cam, pre, 70);
  const horizonY = pre.ay - 9 * pre.s + hDy + tilt;

  // --- sky
  const [cTop, cMid, cLow] = skyAt(h);
  const hy = Math.max(horizonY, H * 0.6);
  const sg = ctx.createLinearGradient(0, 0, 0, hy);
  sg.addColorStop(0, rgb(cTop)); sg.addColorStop(0.55, rgb(cMid)); sg.addColorStop(0.86, rgb(mixc(cMid, cLow, 0.6))); sg.addColorStop(1, rgb(cLow));
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  // dawn glow where the sun is about to rise (right)
  const dawnK = (1 - smooth(4, 14, h));
  if (dawnK > 0.01) {
    const gx = W * 0.86 + hShift * 0.3, gy = horizonY;
    const gr = ctx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(W, H) * 0.75);
    gr.addColorStop(0, `rgba(255,190,130,${0.55 * dawnK})`); gr.addColorStop(0.35, `rgba(255,140,120,${0.22 * dawnK})`); gr.addColorStop(1, 'rgba(255,140,120,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }

  // --- stars
  const starVis = 0.25 * (1 - day) + space;
  if (starVis > 0.01) {
    for (const st of STARS) {
      const thr = 1 - starVis;
      if (st.m < thr * 0.9) continue;
      const y = st.y * H;
      let a = clamp((st.m - thr * 0.9) * 3, 0, 1) * (space > 0.5 ? 1 : clamp(1.25 - y / (horizonY || H), 0, 1));
      if (!reduced) a *= 0.75 + 0.25 * Math.sin(S.clock * (1.5 + st.m * 3) + st.tw);
      if (a <= 0.02) continue;
      const sz = 0.5 + st.m * 1.4;
      ctx.fillStyle = rgb(st.c, a);
      ctx.fillRect(st.x * W, y, sz, sz);
    }
  }

  // --- Earth limb and sunrise (upper atmosphere / orbit)
  if (h > 18) drawEarth(mt, h, cam);

  // --- distant clouds + far ground
  drawCloudsLayer(cam, pre, mt, day, fl, (c) => c.z >= 3);
  if (horizonY < H + 40) drawFarGround(cam, pre, horizonY, hShift, fl, tilt);
  drawCloudsLayer(cam, pre, mt, day, fl, (c) => c.z >= 1 && c.z < 3);

  // --- launch complex
  const padOn = cam.ay - (0 - cam.cy) * cam.s - 120 * cam.s < H + 50;
  if (padOn && sprites) {
    drawWorldSprite(mastSprite, cam, -46, 0);
    drawWorldSprite(mastSprite, cam, 34, 0);
    drawCatenary(cam);
    drawFloodBeams(cam, mt);
    drawWorldSprite(towerSprite, cam);
    drawTowerLights(cam, mt);
    drawWorldSprite(padSprite, cam);
  }

  // --- smoke behind rocket and trail
  drawParticles(cam, false, fl);
  drawTrail(cam, mt, day);

  // --- plumes
  if (e1 > 0.001) {
    const p1 = S.sepS1 ? s1Pose(mt) : pose;
    const [nx, ny] = w2s(cam, ...l2w(p1, 0, 0.1));
    if (mt < TL.full + 0.2 && mt > TL.ign) drawIgnitionFlames(cam, p1, mt, e1);
    if (mt > TL.ign + 0.6) drawPlume1(nx, ny, p1.a, cam.s * (p1.sc || 1), e1, Math.exp(-h / 12), pose.y, mt);
  }
  if (S.sepS1) drawStage1Sep(cam, mt);
  if (e2 > 0.001) {
    const [nx, ny] = w2s(cam, ...l2w(pose, 0, 42.75));
    drawPlume2(nx, ny, pose.a, cam.s, e2, mt);
  }

  // --- rocket
  drawRocket(cam, pose, mt, fl, day);

  // --- umbilicals and floodlights in front
  if (padOn && sprites) {
    drawUmbilicals(cam, mt);
    drawFloodlights(cam, mt);
  }
  drawGroundJets(cam, mt, e1, pose.y);
  drawParticles(cam, true, fl);
  drawVaporCone(cam, pose, mt);

  // --- flame light washes the scene
  if (fl > 0.01) {
    const [lx, ly] = w2s(cam, pose.x, Math.max(0, pose.y - 4));
    const rr = 120 * cam.s;
    const gr = ctx.createRadialGradient(lx, ly, 0, lx, ly, rr);
    gr.addColorStop(0, `rgba(255,170,90,${0.42 * fl})`); gr.addColorStop(0.3, `rgba(255,120,50,${0.2 * fl})`); gr.addColorStop(1, 'rgba(255,100,40,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  // --- clouds passing in front of the camera
  const haze = drawCloudsLayer(cam, pre, mt, day, fl, (c) => c.z < 1);
  const inCloud = cloudHaze(cam, pose, mt);
  const hz = Math.max(haze, inCloud);
  if (hz > 0.01) { ctx.fillStyle = `rgba(232,238,246,${0.5 * hz})`; ctx.fillRect(0, 0, W, H); }

  // --- sun flare in orbit
  if (h > 18) drawSunFlare(mt, h);

  // separation flash
  if (S.flash > 0.01) { ctx.fillStyle = `rgba(255,250,240,${0.12 * S.flash * (reduced ? 0.3 : 1)})`; ctx.fillRect(0, 0, W, H); }

  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.38)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* ---------- far ground: sea, plain, storage tanks, haze ---------- */
function layerShift(cam, pre, z) {
  const a = proj(cam, 0, 0, z), b = proj(pre, 0, 0, z);
  return [a[0] - b[0], a[1] - b[1]];
}
function drawFarGround(cam, pre, hy, hShift, fl, tilt) {
  // plain below the horizon
  const lowY = H + 10;
  let gr = ctx.createLinearGradient(0, hy, 0, Math.max(hy + 10, hy + H * 0.3));
  gr.addColorStop(0, '#6a6680'); gr.addColorStop(0.15, '#3b3c4c'); gr.addColorStop(1, '#1b1d24');
  ctx.fillStyle = gr; ctx.fillRect(0, hy, W, lowY - hy);
  // sea on the right, under the dawn, with a ragged shoreline
  const seaX = W * 0.5 + hShift, seaH = H * 0.07;
  gr = ctx.createLinearGradient(0, hy, 0, hy + seaH);
  gr.addColorStop(0, '#d9a08a'); gr.addColorStop(0.35, '#8a7890'); gr.addColorStop(1, '#3a3d58');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.moveTo(seaX, hy);
  ctx.lineTo(W + 10, hy); ctx.lineTo(W + 10, hy + seaH);
  for (let x = W + 10; x >= seaX; x -= 12) {
    const t = (x - seaX) / Math.max(1, W + 10 - seaX);
    ctx.lineTo(x, hy + seaH * Math.min(1, t * 3) + 1.5 * noise1((x - hShift) * 0.08));
  }
  ctx.closePath(); ctx.fill();
  // sun glitter path

  g = ctx.createLinearGradient(sx - m * 0.7, 0, sx + m * 0.7, 0);
  g.addColorStop(0, 'rgba(140,180,255,0)'); g.addColorStop(0.5, `rgba(200,220,255,${0.35 * I})`); g.addColorStop(1, 'rgba(140,180,255,0)');
  ctx.fillStyle = g; ctx.fillRect(sx - m * 0.7, sy - 1.5, m * 1.4, 3);
  // ghosts along the line through the screen centre
  const ghosts = [[0.35, 0.018, [120, 200, 255]], [0.6, 0.01, [255, 170, 120]], [0.95, 0.028, [140, 255, 200]]];
  for (const [t, rr, c] of ghosts) {
    const gx = lerp(sx, W / 2, t), gy = lerp(sy, H / 2, t), r = rr * m;
    g = ctx.createRadialGradient(gx, gy, r * 0.6, gx, gy, r);
    g.addColorStop(0, rgb(c, 0.07 * I)); g.addColorStop(0.85, rgb(c, 0.12 * I)); g.addColorStop(1, rgb(c, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(gx, gy, r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* =========================================================================
   Telemetry / UI
   ========================================================================= */
function fmtT(mt) {
  const neg = mt < 0;
  const sec = neg ? Math.ceil(-mt - 1e-9) : Math.floor(mt);
  const hh = Math.floor(sec / 3600), mm = Math.floor(sec / 60) % 60, ss = sec % 60;
  const p = (n) => String(n).padStart(2, '0');
  return `T${neg ? '-' : '+'}${p(hh)}:${p(mm)}:${p(ss)}`;
}
function phaseName(mt) {
  if (!S.running && mt <= TL.start) return '待命';
  if (mt < TL.ign) return '倒计时';
  if (mt < TL.lift) return '点火';
  if (mt < 8) return '起飞';
  if (mt < TL.maxQ0) return '程序转弯';
  if (mt < TL.maxQ1) return 'Max-Q';
  if (mt < TL.meco) return '一级飞行';
  if (mt < TL.sep) return '一级关机';
  if (mt < TL.ses) return '级间分离';
  if (mt < TL.fairing) return '二级点火';
  if (mt < TL.fairing + 2) return '整流罩分离';
  if (mt < TL.seco) return '二级飞行';
  if (mt < TL.satSep) return '入轨';
  if (mt < TL.success) return '星箭分离';
  return '入轨成功';
}
let uiAcc = 0;
function updateTelemetry(force) {
  const mt = S.mt, t = Math.max(0, mt);
  const h = altKm(t), v = velKms(t);
  ui.tTime.textContent = fmtT(mt);
  ui.tAlt.textContent = h < 100 ? h.toFixed(2) : h.toFixed(1);
  ui.tVel.textContent = v.toFixed(2);
  ui.tPhase.textContent = phaseName(mt);
  const cdOn = S.running && mt < 1.5;
  ui.cd.classList.toggle('show', cdOn);
  if (cdOn) {
    const txt = mt < 0 ? `T-${Math.ceil(-mt - 1e-9)}` : 'T-0';
    if (ui.cdNum.textContent !== txt) { ui.cdNum.textContent = txt; ui.cdNum.classList.remove('tick'); void ui.cdNum.offsetWidth; ui.cdNum.classList.add('tick'); }
  }
  if (mt >= TL.success && !S.shown) {
    S.shown = true;
    ui.rAlt.textContent = `${h.toFixed(1)} km`;
    ui.rVel.textContent = `${v.toFixed(2)} km/s`;
    ui.rTime.textContent = fmtT(mt);
  }
}

/* =========================================================================
   Main loop
   ========================================================================= */
function frame(now) {
  const dt = S.last ? clamp((now - S.last) / 1000, 0, 0.1) : 0;
  S.last = now;
  update(dt);
  render();
  uiAcc += dt;
  if (uiAcc > 0.05 || dt === 0) { uiAcc = 0; updateTelemetry(); }
  requestAnimationFrame(frame);
}

resize();
updateTelemetry(true);
requestAnimationFrame(frame);
setTimeout(buildEarth, 60);
})();
</script>
